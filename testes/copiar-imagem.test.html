<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Testes: Copiar imagem</title>
<!--
  Testes da feature "Copiar imagem" (docs/produto/planos/copiar-imagem.md, etapa 3).
  Sem dependência. Rodar com o servidor no ar (python3 servidor.py):

    node testes/rodar.mjs copiar-imagem

  O runner abre o Chrome headless em tempo real (CDP), lê o resultado e sai com código 0 só
  quando a linha de resultado diz "OK". Não use --virtual-time-budget com --dump-dom: o
  createImageBitmap/fetch de foto real não termina antes do dump e a página sai pendente.
  Qualquer linha de falha lista o teste e o motivo.

  Regras de segurança desta página:
  - o iframe carrega o /index.html real, que só recebe GET da API real;
  - fetch do iframe passa por uma guarda: POST, PATCH, PUT e DELETE em /api/ nunca saem;
  - os itens são falsos (ids 9xxxxxxxx), montados com renderCard num div solto;
  - nunca clica em .del, .mv, .fetch, #saveLinks nem #saveTpl;
  - a única rede real nos testes são as duas fotos pontuais (Amazon e Mercado Livre).

  Obs.: as palavras de resultado ficam montadas por concatenação no script e fora deste
  comentário, para um grep no texto da página não casar com o código-fonte.
-->
<style>
  body{font:13px/1.45 ui-monospace,monospace;padding:12px;color:#111}
  pre{white-space:pre-wrap;margin:0}
  iframe{position:absolute;left:-9999px;top:0;width:1100px;height:900px;border:0}
</style>
</head>
<body>
<h1 style="font:600 16px sans-serif">Testes: Copiar imagem</h1>
<pre id="saida"></pre>
<iframe id="app" title="app sob teste"></iframe>

<script>
'use strict';
// ---------------------------------------------------------------- mini-harness
const PREF_R = 'RESULT' + 'ADO: ';
const PREF_F = 'FALH' + 'OU: ';
const SAIDA = document.getElementById('saida');
const linhas = [PREF_R + 'PENDENTE'];
const log = l => { linhas.push(l); SAIDA.textContent = linhas.join('\n'); };
SAIDA.textContent = linhas[0];

class Falha extends Error {}
const afirma = (cond, msg) => { if (!cond) throw new Falha(msg || 'asserção falhou'); };
const igual = (obtido, esperado, msg) => {
  const a = JSON.stringify(obtido), b = JSON.stringify(esperado);
  if (a !== b) throw new Falha((msg ? msg + ': ' : '') + 'esperado ' + b + ', obtido ' + a);
};
const testes = [];
const teste = (nome, fn) => testes.push({ nome, fn });
const dormir = ms => new Promise(r => setTimeout(r, ms));
async function esperar(cond, desc = 'condição', tentativas = 1500, passo = 10) {
  for (let i = 0; i < tentativas; i++) {
    let ok = false;
    try { ok = cond(); } catch (e) { ok = false; }
    if (ok) return;
    await dormir(passo);
  }
  throw new Falha('tempo esgotado esperando: ' + desc);
}

let testeAtual = '(início)';
const erros = [];
// As Promises e os erros do app nascem no iframe: os ouvintes precisam estar na janela dele (W),
// além da desta página. Registrados em carregarApp().
function ouvirErros(janela, origem) {
  janela.addEventListener('unhandledrejection', e => {
    erros.push('rejeição não tratada (' + origem + ') durante "' + testeAtual + '": ' + (e.reason && e.reason.message || e.reason));
  });
  janela.addEventListener('error', e => { erros.push('erro não capturado (' + origem + ') durante "' + testeAtual + '": ' + e.message); });
}
ouvirErros(window, 'página de teste');

// ---------------------------------------------------------------- ambiente
const URL_AMZ = 'https://m.media-amazon.com/images/I/41p2HTchUrL._AC_UL320_.jpg';
const URL_AMZ_1000 = 'https://m.media-amazon.com/images/I/41p2HTchUrL._AC_SL1000_.jpg';
const URL_ML = 'https://http2.mlstatic.com/D_Q_NP_2X_624792-MLU75859080805_042024-E.webp';

let W, FETCH_ORIG, CI_ORIG, IMPL = null, TXT = null;
const REG_FETCH = [];   // chamadas a fetch do iframe no teste corrente
const VIOL = [];        // tentativas de escrita na API real (devem ficar vazias)
const cartoes = [];

async function carregarApp() {
  const f = document.getElementById('app');
  await new Promise((res, rej) => { f.onload = res; f.onerror = rej; f.src = '/index.html'; });
  W = f.contentWindow;
  ouvirErros(W, 'app');
  FETCH_ORIG = W.fetch.bind(W);
  CI_ORIG = W.ClipboardItem;
  W.fetch = function (entrada, opcoes) {
    const url = typeof entrada === 'string' ? entrada : ((entrada && entrada.url) || String(entrada));
    const metodo = String((opcoes && opcoes.method) || (entrada && entrada.method) || 'GET').toUpperCase();
    REG_FETCH.push({ url, metodo, opcoes });
    if (metodo !== 'GET' && /\/api\//.test(url)) {
      VIOL.push(metodo + ' ' + url);
      return Promise.reject(new W.TypeError('bloqueado pelo teste: escrita na API real'));
    }
    return IMPL ? IMPL(url, opcoes) : FETCH_ORIG(entrada, opcoes);
  };
  W.open = (...a) => { VIOL.push('window.open ' + a[0]); return null; };
  // espera o app terminar de carregar os dados reais (só GET)
  await esperar(() => W.eval('items.length') > 0 && W.document.querySelectorAll('#grid .card').length > 0,
    'o index.html carregar os itens do servidor (servidor no ar em :8765?)');
  REG_FETCH.length = 0;
  TXT = W.eval('TXT_IMG');
}

function restaurar() {
  try { delete W.navigator.clipboard; } catch (e) { /* ignora */ }
  Object.defineProperty(W, 'ClipboardItem', { value: CI_ORIG, configurable: true, writable: true });
  IMPL = null;
  REG_FETCH.length = 0;
  while (cartoes.length) cartoes.pop().remove();
  const t = W.document.getElementById('toast'); if (t) t.textContent = '';
}

function stubClipboard({ rejeitar, ignorarPromises } = {}) {
  const calls = { write: [], text: [] };
  const cb = {
    write: async function (arr) {
      calls.write.push(arr);                       // registrado de forma síncrona
      if (ignorarPromises) {                       // write pendente que não encosta nas promises do item
        await dormir(60);
        throw new W.DOMException('Failed to write to clipboard', 'NotAllowedError');
      }
      // como o Chrome: espera as promises do ClipboardItem e só depois devolve o resultado do write,
      // com um atraso (o Chrome real responde por IPC). Se a promise da foto falhar, o write rejeita
      // com o erro genérico NotAllowedError, e não com o motivo real.
      const res = await Promise.allSettled(arr.flatMap(it => Array.from(it.types).map(t => it.getType(t))));
      await dormir(20);
      if (rejeitar) throw rejeitar;
      if (res.some(r => r.status === 'rejected')) throw new W.DOMException('Failed to write to clipboard', 'NotAllowedError');
    },
    writeText: async function (t) { calls.text.push(t); }
  };
  Object.defineProperty(W.navigator, 'clipboard', { value: cb, configurable: true });
  return calls;
}

let seq = 0;
function itemFalso(sobre = {}) {
  const n = ++seq;
  const it = {
    id: 900000000 + n, loja: sobre.loja || 'amazon', cat: 'QA', busca: 'qa',
    url: sobre.url || (sobre.loja === 'ml' ? 'https://meli.la/QA' + n : 'https://www.amazon.com.br/dp/B0QA' + n + '?tag=desejodemen01-20'),
    data: { titulo: 'Produto de teste ' + n, preco: 'R$ 99,90', preco_antigo: 'R$ 150,00', desconto: '-34%', imagem: URL_AMZ }
  };
  if ('data' in sobre) it.data = sobre.data;
  if (it.data) {
    if ('imagem' in sobre) it.data.imagem = sobre.imagem;
    if ('titulo' in sobre) it.data.titulo = sobre.titulo;
  }
  return it;
}

function montarCard(it, exigirBotao = true) {
  const card = W.document.createElement('div');
  card.className = 'card';
  W.document.body.appendChild(card);
  cartoes.push(card);
  W.renderCard(card, it);
  if (exigirBotao) afirma(card.querySelector('.copyimg'), 'renderCard não gerou o botão .copyimg');
  return { card, it, btn: card.querySelector('.copyimg'), st: card.querySelector('.status'), ta: card.querySelector('textarea') };
}

async function imagem(l, a, cor) {   // PNG no realm do iframe; cor nula = transparente
  const cv = W.document.createElement('canvas'); cv.width = l; cv.height = a;
  if (cor) { const c = cv.getContext('2d'); c.fillStyle = cor; c.fillRect(0, 0, l, a); }
  return new Promise(r => cv.toBlob(r, 'image/png'));
}
const resp = (blob, { status = 200, tipo = 'image/png', url = '' } = {}) => {
  const r = new W.Response(blob, { status, headers: { 'content-type': tipo } });
  if (url) Object.defineProperty(r, 'url', { value: url });
  return r;
};
async function pixels(blob) {
  const bmp = await W.createImageBitmap(blob);
  const cv = W.document.createElement('canvas'); cv.width = bmp.width; cv.height = bmp.height;
  const c = cv.getContext('2d'); c.drawImage(bmp, 0, 0);
  return { largura: bmp.width, altura: bmp.height, px: (x, y) => Array.from(c.getImageData(x, y, 1, 1).data) };
}
async function ehPng(blob) {
  const b = new Uint8Array(await blob.arrayBuffer());
  return [0x89, 0x50, 0x4e, 0x47].every((v, i) => b[i] === v);
}
const funcao = nome => { const f = W[nome]; afirma(typeof f === 'function', 'index.html não declara a function global ' + nome); return f; };
const semMarca = t => String(t).replace(/^\s*✓\s*/, '').trim().toLowerCase();
function rotuloCoerente(btn, quando) {
  const rot = btn.getAttribute('aria-label');
  if (rot === null) return;   // sem aria-label o nome é o texto visível
  const vis = semMarca(btn.textContent);
  afirma(semMarca(rot).startsWith(vis), 'aria-label "' + rot + '" não começa com o texto visível "' + btn.textContent.trim() + '" (' + quando + ')');
}
const textoStatus = c => c.st.textContent.trim();
const chamadasImagem = () => REG_FETCH.filter(c => !/^\/api\//.test(c.url));

async function clicarEEsperarFim(c) {
  c.btn.click();
  await esperar(() => c.btn.dataset.estado === 'copiada' || c.st.classList.contains('err'),
    'o clique em Copiar imagem terminar (sucesso ou erro)');
}
function afirmaErro(c, motivo) {
  afirma(c.st.classList.contains('err'), '.status deveria ter a classe err');
  igual(textoStatus(c), 'Erro: ' + TXT[motivo], 'texto do erro (' + motivo + ')');
  afirma(c.btn.dataset.estado !== 'copiada', 'não pode marcar data-estado=copiada na falha');
  afirma(c.btn.getAttribute('aria-busy') !== 'true', 'aria-busy deve sair depois da falha');
  afirma(c.btn.getAttribute('aria-disabled') !== 'true', 'o botão deve voltar a ficar clicável depois da falha');
  igual(c.btn.textContent.trim(), TXT.botao, 'texto do botão volta ao padrão');
  rotuloCoerente(c.btn, 'depois da falha');
  afirma(!c.card.classList.contains('img-done'), 'img-done não pode ser marcado na falha');
  afirma(W.document.getElementById('toast').textContent !== TXT.toastOk, 'o toast de sucesso não pode aparecer na falha');
}

// ================================================================ CA1
teste('CA1: card com foto tem um botão .secondary.copyimg logo depois de .copy, habilitado e com o texto padrão', async () => {
  funcao('renderCard');
  const c = montarCard(itemFalso());
  igual(c.card.querySelectorAll('.copyimg').length, 1);
  igual(c.btn.tagName, 'BUTTON');
  igual(c.btn.getAttribute('type'), 'button');
  afirma(c.btn.classList.contains('secondary'), 'deveria ter a classe secondary');
  afirma(c.btn.previousElementSibling === c.card.querySelector('.copy'), 'deveria vir logo depois de .copy');
  igual(c.btn.textContent.trim(), TXT.botao);
  afirma(c.btn.getAttribute('aria-disabled') !== 'true', 'com foto não pode estar aria-disabled');
  rotuloCoerente(c.btn, 'padrão');
});

teste('CA1: aria-label leva o título escapado e nenhum HTML do título vira marcação', async () => {
  const c = montarCard(itemFalso({ titulo: 'Fone "Pro" <i>x</i> & cia' }));
  igual(c.btn.getAttribute('aria-label'), 'Copiar imagem de Fone "Pro" <i>x</i> & cia');
  igual(c.card.querySelectorAll('i').length, 0, 'tags <i> do título não podem virar elemento');
});

teste('CA1: sem título não há aria-label no botão', async () => {
  const c = montarCard(itemFalso({ titulo: '' }));
  igual(c.btn.getAttribute('aria-label'), null);
  afirma(c.btn.getAttribute('aria-disabled') !== 'true', 'a foto existe; o botão fica habilitado');
});

teste('CA1: o clique chama clipboard.write de forma síncrona (gesto do usuário) e entra em carregando; segundo clique é ignorado', async () => {
  funcao('copiarImagem');
  const calls = stubClipboard();
  const png = await imagem(40, 30, '#ff0000');
  let liberar; const pendente = new Promise(r => { liberar = r; });
  IMPL = () => pendente;
  const c = montarCard(itemFalso());
  c.st.textContent = 'sobra de erro antigo'; c.st.className = 'status err';
  c.btn.click();
  igual(calls.write.length, 1, 'write precisa ser chamado antes de qualquer await, ainda dentro do clique');
  igual(c.btn.getAttribute('aria-busy'), 'true');
  igual(c.btn.getAttribute('aria-disabled'), 'true');
  igual(c.btn.textContent.trim(), TXT.carregando);
  igual(textoStatus(c), '', 'o carregando limpa o .status');
  rotuloCoerente(c.btn, 'carregando');
  c.btn.click();
  await dormir(30);
  igual(calls.write.length, 1, 'clique durante o carregando não pode chamar write de novo');
  igual(chamadasImagem().length, 1, 'clique durante o carregando não pode abrir segundo fetch');
  liberar(resp(png));
  await esperar(() => c.btn.dataset.estado === 'copiada', 'terminar a cópia');
  igual(c.btn.getAttribute('aria-busy') === 'true', false, 'aria-busy sai no sucesso');
  igual(c.btn.getAttribute('aria-disabled') === 'true', false, 'o botão volta a ficar clicável no sucesso');
});

teste('CA1: sucesso (stub): write recebe só image/png, PNG de verdade, tamanho natural; estado, selo e toast corretos', async () => {
  funcao('copiarImagem');
  const calls = stubClipboard();
  const png = await imagem(40, 30, '#ff0000');
  IMPL = () => Promise.resolve(resp(png));
  const c = montarCard(itemFalso());
  await clicarEEsperarFim(c);
  igual(calls.write.length, 1);
  igual(calls.write[0].length, 1, 'um ClipboardItem só');
  igual(Array.from(calls.write[0][0].types), ['image/png']);
  const blob = await calls.write[0][0].getType('image/png');
  igual(blob.type, 'image/png');
  afirma(await ehPng(blob), 'os bytes precisam ter a assinatura PNG');
  const p = await pixels(blob);
  igual([p.largura, p.altura], [40, 30], 'tamanho natural da foto');
  igual(p.px(10, 10), [255, 0, 0, 255], 'pixel da foto preservado');
  igual(c.btn.dataset.estado, 'copiada');
  igual(c.btn.textContent.trim(), TXT.ok);
  afirma(c.card.classList.contains('img-done'), 'o card deve ganhar img-done');
  rotuloCoerente(c.btn, 'copiada');
  igual(W.document.getElementById('toast').textContent, TXT.toastOk);
  igual(textoStatus(c), '', 'sem erro no sucesso');
  afirma(!c.st.classList.contains('err'), 'sem classe err no sucesso');
});

teste('CA1: depois do sucesso o botão continua clicável e copia de novo', async () => {
  const calls = stubClipboard();
  const png = await imagem(10, 10, '#00ff00');
  IMPL = () => Promise.resolve(resp(png));
  const c = montarCard(itemFalso());
  await clicarEEsperarFim(c);
  c.btn.click();
  await esperar(() => calls.write.length === 2, 'segundo write');
  await esperar(() => c.btn.getAttribute('aria-busy') !== 'true', 'segunda cópia terminar');
  igual(c.btn.dataset.estado, 'copiada');
});

teste('CA1: novo clique depois de um erro limpa o erro e conclui', async () => {
  const calls = stubClipboard();
  const png = await imagem(10, 10, '#0000ff');
  IMPL = () => Promise.reject(new W.TypeError('Failed to fetch'));
  const c = montarCard(itemFalso({ loja: 'ml', imagem: URL_ML }));
  await clicarEEsperarFim(c);
  afirmaErro(c, 'rede');
  IMPL = () => Promise.resolve(resp(png));
  await clicarEEsperarFim(c);
  igual(c.btn.dataset.estado, 'copiada');
  igual(textoStatus(c), '', 'o erro antigo sai');
  afirma(!c.st.classList.contains('err'), 'a classe err sai');
  igual(calls.write.length, 2);
});

teste('CA1+CA2 (rede real): foto da Amazon vira image/png maior que 320 px, em SL1000, sem credenciais', async () => {
  const calls = stubClipboard();
  const c = montarCard(itemFalso({ imagem: URL_AMZ }));
  await clicarEEsperarFim(c);
  igual(textoStatus(c), '', 'sem erro');
  igual(calls.write.length, 1);
  igual(Array.from(calls.write[0][0].types), ['image/png']);
  const blob = await calls.write[0][0].getType('image/png');
  igual(blob.type, 'image/png');
  afirma(await ehPng(blob), 'assinatura PNG');
  const p = await pixels(blob);
  afirma(p.largura > 320, 'largura ' + p.largura + ' deveria passar de 320 (versão SL1000)');
  afirma(p.largura <= 1000 && p.altura <= 1000, 'não passa de 1000 px: ' + p.largura + 'x' + p.altura);
  const reqs = chamadasImagem();
  igual(reqs[0].url, URL_AMZ_1000, 'primeira requisição pede a versão grande');
  igual(reqs[0].opcoes && reqs[0].opcoes.credentials, 'omit');
  igual(reqs[0].opcoes && reqs[0].opcoes.mode, 'cors');
  afirma(reqs[0].opcoes && reqs[0].opcoes.signal && typeof reqs[0].opcoes.signal.aborted === 'boolean', 'precisa de AbortSignal (timeout)');
  igual(c.btn.dataset.estado, 'copiada');
  afirma(c.card.classList.contains('img-done'), 'img-done');
  igual(W.document.getElementById('toast').textContent, TXT.toastOk);
});

teste('CA1+CA2 (rede real): WEBP do Mercado Livre vira image/png, sem reescrever a URL', async () => {
  const calls = stubClipboard();
  const c = montarCard(itemFalso({ loja: 'ml', imagem: URL_ML }));
  await clicarEEsperarFim(c);
  igual(textoStatus(c), '', 'sem erro');
  igual(calls.write.length, 1);
  igual(Array.from(calls.write[0][0].types), ['image/png']);
  const blob = await calls.write[0][0].getType('image/png');
  igual(blob.type, 'image/png');
  afirma(await ehPng(blob), 'assinatura PNG (a origem era WEBP)');
  const p = await pixels(blob);
  afirma(p.largura > 0 && p.altura > 0, 'o PNG decodifica com tamanho');
  igual(chamadasImagem().map(r => r.url), [URL_ML], 'uma requisição, na URL gravada');
  igual(c.btn.dataset.estado, 'copiada');
  afirma(c.card.classList.contains('img-done'), 'img-done');
});

// ================================================================ CA2
teste('CA2: HOSTS_FOTO tem exatamente os três CDNs (Amazon, Mercado Livre e Shopee)', async () => {
  igual(Array.from(W.eval('HOSTS_FOTO')), ['m.media-amazon.com', 'http2.mlstatic.com', 'down-br.img.susercontent.com']);
});

const TABELA_URL = [
  ['Amazon UL320', 'https://m.media-amazon.com/images/I/41p2HTchUrL._AC_UL320_.jpg', 'https://m.media-amazon.com/images/I/41p2HTchUrL._AC_SL1000_.jpg'],
  ['Amazon SX300_SY300_QL70', 'https://m.media-amazon.com/images/I/71abcDEF12L._AC_SX300_SY300_QL70_.jpg', 'https://m.media-amazon.com/images/I/71abcDEF12L._AC_SL1000_.jpg'],
  ['Amazon com + no id', 'https://m.media-amazon.com/images/I/81+abcDEF-1L._AC_UL320_.jpg', 'https://m.media-amazon.com/images/I/81+abcDEF-1L._AC_SL1000_.jpg'],
  ['Amazon png', 'https://m.media-amazon.com/images/I/51xyz._AC_UL320_.png', 'https://m.media-amazon.com/images/I/51xyz._AC_SL1000_.png'],
  ['Amazon já em SL1000 (idempotente)', URL_AMZ_1000, URL_AMZ_1000],

teste('CA2: sem SL1000 a Amazon cai para a URL gravada e a cópia conclui', async () => {
  const calls = stubClipboard();
  const png = await imagem(30, 20, '#123456');
  IMPL = url => Promise.resolve(url === URL_AMZ_1000 ? resp(new W.Blob(['x']), { status: 400, tipo: 'text/plain' }) : resp(png));

teste('CA2: PNG transparente sai com fundo branco opaco e o canvas tem o tamanho natural', async () => {
  const calls = stubClipboard();

(async () => {
  let falhas = 0, total = 0;
  try {
    API_ANTES = await (await fetch('/api/items')).text();
    await carregarApp();
    IMG_VALIDA = await imagem(16, 16, '#888888');
  } catch (e) {
    log(PREF_F + 'preparação — ' + (e && e.message || e));
    linhas.shift();
    log(PREF_R + 'FALH' + 'OU (preparação)');
    return;
  }
  for (const t of testes) {
    total++; testeAtual = t.nome;
    const antesErros = erros.length;
    try {
      restaurar();
      await t.fn();
      await dormir(30);   // unhandledrejection só dispara depois do fim da microtask
      if (erros.length > antesErros) throw new Falha(erros.slice(antesErros).join(' | '));
      log('ok    ' + t.nome);
    } catch (e) {
      falhas++;
      log(PREF_F + t.nome + ' — ' + (e && e.message || e));
    } finally {
      try { restaurar(); } catch (e) { /* ignora */ }
    }
  }
  linhas.shift();
  log('');
  log(total + ' testes, ' + (total - falhas) + ' passaram, ' + falhas + ' falharam');
  log(falhas === 0 && total > 0 ? PREF_R + 'OK' : PREF_R + 'FALH' + 'OU (' + falhas + ' de ' + total + ')');
})();
