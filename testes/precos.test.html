<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Testes: Preço sempre atualizado</title>
<!--
  Testes do front do plano docs/produto/planos/atualizar-precos.md (etapa 6, CA9) e da spec docs/produto/specs/atualizar-precos.md
  (CA-P1 a CA-P10): idade do preço no cartão, selo "Desatualizado", prazo (config/preco_validade_horas), faixa, quadro
  "Como atualizar os preços", filtro, ordem, avisos ao copiar, "Atualizar preço", atalho #precos e o cabeçalho do disparo. Sem dependência.
  Sobe sobre uma cópia do banco (nunca a 8765 com coleta gravando):

    ACHADINHOS_DB=<copia> ACHADINHOS_PORTA=8766 ACHADINHOS_API_TOKEN_ARQUIVO=/nao/existe ACHADINHOS_DISPARO=0 python3 servidor.py
    PORTA=8766 node testes/rodar.mjs precos

  Regras de segurança desta página:
  - o iframe carrega o /index.html real; só GET sai para a API real. Toda escrita em /api/ (PUT do prazo, PATCH do "Atualizar preço"),
    /api/fetch (a rede da Amazon) e /api/disparo/* é atendida por um servidor FALSO em memória (`FALSO`), registrada e nunca enviada;
  - itens FALSOS (ids 9xxxxxxxx) só existem na memória do iframe; nada disso chega ao banco;
  - sem navegação por hash, exceto o atalho #precos (1 mudança de hash): o disparo.test.html está perto do limite do Chrome no runner.

  Obs.: as palavras de resultado ficam montadas por concatenação no script, e fora deste comentário,
  para um grep no texto da página não casar com o código-fonte.
-->
<style>
  body{font:13px/1.45 ui-monospace,monospace;padding:12px;color:#111}
  pre{white-space:pre-wrap;margin:0}
  iframe{position:absolute;left:-9999px;top:0;width:1100px;height:900px;border:0}
</style>
</head>
<body>
<h1 style="font:600 16px sans-serif">Testes: Preço sempre atualizado</h1>
<pre id="saida"></pre>
<iframe id="app" title="app sob teste"></iframe>

<script>
'use strict';
// ---------------------------------------------------------------- mini-harness
const PREF_R = 'RESULT' + 'ADO: ';
const PREF_F = 'FALH' + 'OU: ';
const SAIDA = document.getElementById('saida');
const linhas = [PREF_R + 'PENDENTE'];
const log = l => { linhas.push(l); SAIDA.textContent = linhas.join('\n'); };
SAIDA.textContent = linhas[0];

class Falha extends Error {}
const afirma = (cond, msg) => { if (!cond) throw new Falha(msg || 'asserção falhou'); };
const igual = (obtido, esperado, msg) => {
  const a = JSON.stringify(obtido), b = JSON.stringify(esperado);
  if (a !== b) throw new Falha((msg ? msg + ': ' : '') + 'esperado ' + b + ', obtido ' + a);
};
const testes = [];
const teste = (nome, fn) => testes.push({ nome, fn });
const dormir = ms => new Promise(r => setTimeout(r, ms));
async function esperar(cond, desc = 'condição', tentativas = 1500, passo = 10) {
  for (let i = 0; i < tentativas; i++) {
    let ok = false;
    try { ok = cond(); } catch (e) { ok = false; }
    if (ok) return;
    await dormir(passo);
  }
  throw new Falha('tempo esgotado esperando: ' + desc);
}

let testeAtual = '(início)';
const erros = [];
function ouvirErros(janela, origem) {
  janela.addEventListener('unhandledrejection', e => {
    erros.push('rejeição não tratada (' + origem + ') durante "' + testeAtual + '": ' + (e.reason && e.reason.message || e.reason));
  });
  janela.addEventListener('error', e => { erros.push('erro não capturado (' + origem + ') durante "' + testeAtual + '": ' + e.message); });
}
ouvirErros(window, 'página de teste');

// ---------------------------------------------------------------- ambiente
let W, FETCH_ORIG, API_ANTES = null;
const VIOL = [];       // escrita na API real (deve ficar vazia)
const REG = [];        // tudo que o iframe chamou: { url, metodo, corpo }
const FALSO = {};      // 'METODO /caminho' -> (corpo, url) => Response | objeto | Promise; atende no lugar do servidor real
const COPIADOS = [];   // texto que o app mandou para a área de transferência (falsa)

const q = s => W.document.querySelector(s);
// Identidade de nó do DOM: o igual() compara por JSON e veria qualquer nó como {}
const mesmoNo = (a, b, msg) => { if (a !== b) throw new Falha(msg || 'não é o mesmo nó do DOM'); };
const qa = s => [...W.document.querySelectorAll(s)];
const txt = el => el.textContent.replace(/\s+/g, ' ').trim();
const visivel = el => !!el && el.checkVisibility() && W.getComputedStyle(el).visibility !== 'hidden' && el.getClientRects().length > 0;   // checkVisibility pega o <details> fechado (content-visibility)
const semRolagemHorizontal = () => { const d = W.document.documentElement; return d.scrollWidth <= d.clientWidth + 1; };
const ev = expr => W.eval(expr);
const json = o => new W.Response(JSON.stringify(o), { headers: { 'Content-Type': 'application/json' } });

async function largura(px) { document.getElementById('app').style.width = px + 'px'; await dormir(150); }

async function abrirApp(sufixo = '') {
  document.getElementById('app').style.width = '1100px';
  localStorage.removeItem('activeCat');
  for (const k of Object.keys(FALSO)) delete FALSO[k];
  const antes = erros.length;
  const f = document.getElementById('app');
  await new Promise((res, rej) => { f.onload = res; f.onerror = rej; f.src = '/index.html?t=' + Date.now() + sufixo; });
  W = f.contentWindow;
  ouvirErros(W, 'app');
  FETCH_ORIG = W.fetch.bind(W);
  REG.length = 0; COPIADOS.length = 0;
  W.fetch = function (entrada, opcoes) {
    const url = typeof entrada === 'string' ? entrada : ((entrada && entrada.url) || String(entrada));
    const metodo = String((opcoes && opcoes.method) || (entrada && entrada.method) || 'GET').toUpperCase();
    const corpo = opcoes && opcoes.body !== undefined ? opcoes.body : undefined;
    const caminho = url.replace(/^https?:\/\/[^/]+/, '').split('?')[0];
    REG.push({ url, metodo, corpo, caminho });
    const f = FALSO[metodo + ' ' + caminho];
    if (f) return Promise.resolve().then(() => f(corpo === undefined ? undefined : JSON.parse(corpo), url));
    if (metodo !== 'GET' && /\/api\//.test(url)) { VIOL.push(metodo + ' ' + url); return Promise.reject(new W.TypeError('bloqueado pelo teste: escrita na API real')); }
    if (/\/api\/fetch\b/.test(url)) { VIOL.push(metodo + ' ' + url); return Promise.reject(new W.TypeError('bloqueado pelo teste')); }   // a rede da Amazon nunca sai; GET de /api/disparo/* (leitura) vai ao servidor real
    return FETCH_ORIG(entrada, opcoes);
  };
  W.open = (...a) => { VIOL.push('window.open ' + a[0]); return null; };
  W.prompt = () => { VIOL.push('prompt'); return null; };
  Object.defineProperty(W.navigator, 'clipboard', { configurable: true, value: { writeText: async t => { COPIADOS.push(t); }, write: async () => {} } });
  await esperar(() => ev('ofertasProntas === true') && ev('items.length') > 0, 'o index.html carregar os itens (PORTA=... aponta para o servidor da cópia?)');
  await dormir(30);
  if (erros.length > antes) throw new Falha('erro ao abrir o app: ' + erros.slice(antes).join(' | '));
}

// ---- itens falsos: ids 9xxxxxxxx, só na memória do iframe
let SEQ = 900000000;
const URLS = { amazon: n => 'https://www.amazon.com.br/dp/B0FALSO' + n + '?tag=desejodemen01-20', ml: n => 'https://meli.la/F' + n, shopee: n => 'https://s.shopee.com.br/F' + n };
const CAT = 'Pets';
const iso = d => { const p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()); };
const haHoras = h => iso(new Date(Date.now() - h * 36e5 - 1500));   // 1,5 s a mais: não encosta no limite durante o teste
const falso = (loja, preco_em, extra = {}, data = {}) => {
  const n = ++SEQ;
  return { id: n, loja, item_id: 'F' + n, cat: CAT, busca: 'termo falso', url: URLS[loja](n), preco_em,
    data: { titulo: 'Produto falso ' + n, preco: 'R$ 10,00', ...data }, genero: 'sem', genero_origem: '', genero_auto: 'sem', ...extra };
};
function usarItens(lista, validade = 24) {
  ev('precoValidade = ' + validade + '; validadeAviso = false; activeCat = ' + JSON.stringify(CAT) + '; items = ' + JSON.stringify(lista) + '; page = 1;'
    + " for (const s of ['#fLoja','#fBusca','#fPreco','#fOrdem','#fTexto']) $(s).value = ''; render();");
}
const cartoes = () => qa('#grid .card');
const cartao = i => cartoes()[i];
function escolher(sel, valor) { sel.value = valor; sel.dispatchEvent(new W.Event('change', { bubbles: true })); }
const toastTexto = () => q('#toast').textContent;
// Clica e espera o toast novo (o #toast nasce com "Copiado!" fixo no HTML: limpa antes para não ler o resto de um aviso anterior)
async function clicarEEsperarToast(botao) {
  const t = q('#toast'); t.textContent = ''; t.classList.remove('show');
  botao.click();
  await esperar(() => t.classList.contains('show') && t.textContent !== '', 'o toast depois do clique');
  return t.textContent;
}

// 4 itens para as tabelas de contagem (a aba é CAT): 2 velhos com data, 1 sem data, 1 em dia, mais um sem preço
function lote() {
  return [
    falso('amazon', haHoras(1)),
    falso('amazon', haHoras(30)),
    falso('amazon', null),
    falso('ml', haHoras(50)),
    falso('ml', haHoras(2)),
    falso('shopee', haHoras(100)),
    falso('shopee', null, {}, { preco: '' }),   // sem preço: fora das contagens, sem linha de idade
  ];
}

// ================================================================ funções puras
teste('textoIdadePreco: os seis textos da spec, com o relógio injetado', async () => {
  await abrirApp();
  const t = (preco_em, agora) => W.textoIdadePreco(preco_em, agora);
  const agora = new W.Date(2026, 10, 4, 15, 0, 0);
  igual(t('2026-11-04T14:30:00', agora), 'Preço de agora há pouco', '30 min');
  igual(t('2026-11-04T14:00:01', agora), 'Preço de agora há pouco', '59 min 59 s');
  igual(t('2026-11-04T14:00:00', agora), 'Preço de hoje, 14:00', 'exatamente 1 h já é "hoje"');
  igual(t('2026-11-04T08:05:09', agora), 'Preço de hoje, 08:05', 'mesmo dia: hora e minuto, com zero à esquerda');
  igual(t('2026-11-03T18:05:00', agora), 'Preço de ontem, 18:05');
  igual(t('2026-11-03T00:00:00', agora), 'Preço de ontem, 00:00', 'ontem à meia-noite ainda é ontem');
  igual(t('2026-11-02T23:59:59', agora), 'Preço de 02/11 (há 2 dias)', 'dia de calendário, não 48 h');
  igual(t('2026-10-06T10:00:00', agora), 'Preço de 06/10 (há 29 dias)');
  igual(t('2026-10-05T10:00:00', agora), 'Preço de 05/10 (há mais de 1 mês)', '30 dias');
  igual(t('2025-01-02T10:00:00', agora), 'Preço de 02/01 (há mais de 1 mês)');
  // virada do dia e do ano
  const cedo = new W.Date(2026, 10, 4, 0, 30, 0);
  igual(t('2026-11-03T23:50:00', cedo), 'Preço de agora há pouco', 'menos de 1 h vale mesmo na virada do dia');
  igual(t('2026-11-03T22:00:00', cedo), 'Preço de ontem, 22:00');
  igual(t('2026-12-31T09:00:00', new W.Date(2027, 0, 2, 10, 0, 0)), 'Preço de 31/12 (há 2 dias)', 'virada do ano');
  // relógio do navegador um pouco atrás do servidor: até 5 min no futuro ainda é "agora há pouco";
  // além disso o precoVelho marca velho (S2), e o texto não pode dizer o contrário (D6)
  igual(t('2026-11-04T15:05:00', agora), 'Preço de agora há pouco', '+5 min exatos ainda vale');
  igual(t('2026-11-04T15:05:01', agora), 'Idade do preço desconhecida', '+5 min 1 s: futuro demais');
  igual(t('2026-11-04T15:20:00', agora), 'Idade do preço desconhecida', '+20 min');
  igual(t('2026-11-05T09:00:00', agora), 'Idade do preço desconhecida', 'dia seguinte (relógio muito atrás): sem inventar "há -1 dias"');
});

    '2026-02-30T10:00:00', '2026-11-04T25:00:00', '2026-11-04T14:20:60', ' 2026-11-04T14:20:00', '2026-11-04T14:20:00 ', '2026-11-04T14:20:00\n',
    '２０２６-11-04T14:20:00', 20261104142000, true, [], {}, '0000-01-01T00:00:00'];

// A mesma tabela que o disparo.preco_recente (servidor) responde para estes casos: recente = !velho. Gerada de lá (agora = 2026-11-04 15:00).
// Inclui a folga de 5 min no futuro (15:05:00 vale, 15:05:01 é velho) e a hora 24, que o datetime.fromisoformat aceitaria.
const PARIDADE = [["2026-11-04T15:00:00", 24, true], ["2026-11-04T14:59:59", 1, true], ["2026-11-04T14:00:00", 1, true], ["2026-11-04T13:59:59", 1, false], ["2026-11-03T15:00:00", 24, true], ["2026-11-03T14:59:59", 24, false], ["2026-11-03T15:00:01", 24, true], ["2026-10-28T15:00:00", 168, true], ["2026-10-28T14:59:59", 168, false], ["2026-11-04T15:05:00", 24, true], ["2026-11-04T15:05:01", 24, false], ["2026-11-04T16:00:00", 1, false], ["2027-01-01T00:00:00", 24, false], ["2026-11-04T24:00:00", 24, false], ["2026-11-03T24:00:00", 24, false], ["2026-11-04T23:60:00", 24, false], ["2026-11-04T15:00:00Z", 24, false], ["2026-11-04 15:00:00", 24, false], ["2026-11-04T15:00", 24, false], ["2026-02-30T10:00:00", 24, false], ["2026-13-01T10:00:00", 24, false], ["2026-11-04T25:00:00", 24, false], ["2026-11-04T15:00:00\n", 24, false], [" 2026-11-04T15:00:00", 24, false], ["2026-11-04T15:00:00 ", 24, false], ["", 24, false], ["ontem", 24, false], ["２０２６-11-04T15:00:00", 24, false], ["2026-11-04T15:00:60", 24, false], ["0001-01-01T00:00:00", 24, false], ["0000-01-01T00:00:00", 24, false], ["0099-01-01T00:00:00", 24, false], [null, 24, false], [20261104150000, 24, false], [true, 24, false], [[], 24, false], [{}, 24, false]];
teste('precoVelho espelha disparo.preco_recente: limites do prazo, nulo, malformado e mais de 5 min no futuro contam como velho', async () => {
  await abrirApp();
  const agora = new W.Date(2026, 10, 4, 15, 0, 0);
  for (const [s, h, recente] of PARIDADE) igual(W.precoVelho(s, h, agora), !recente, JSON.stringify(s) + ' com ' + h + ' h');
  // a data é conferida nos números: ano 1 a 99 não vira 1900 e a hora que o horário de verão pulou (válida no servidor) é lida
  igual(W.lerPrecoEm('0099-03-01T10:00:00').getFullYear(), 99);
  igual(W.lerPrecoEm('2024-02-29T23:59:59').getDate(), 29, 'ano bissexto');
  igual(W.lerPrecoEm('2026-02-29T00:00:00'), null, 'ano comum');
  igual(W.lerPrecoEm('1900-02-29T00:00:00'), null, '1900 não é bissexto');
  afirma(W.lerPrecoEm('2018-11-04T00:30:00') !== null, 'hora pulada pelo horário de verão de 2018');
  // sem o 3º argumento vale o relógio do navegador; sem o 2º, o prazo em vigor
  ev('precoValidade = 24');
  afirma(W.precoVelho(haHoras(23)) === false && W.precoVelho(haHoras(25)) === true, 'padrão: prazo em vigor e agora');
  ev('precoValidade = 48');
  afirma(W.precoVelho(haHoras(25)) === false && W.precoVelho(haHoras(49)) === true, 'o prazo em vigor muda o resultado');
  ev('precoValidade = 24');
  // Date e número (ms) valem como `agora`
  igual(W.precoVelho('2026-11-03T14:59:59', 24, agora.getTime()), true);
  igual(W.precoVelho('2026-11-03T15:00:00', 24, agora.getTime()), false);
});

// ================================================================ CA-P1: o cartão
teste('CA-P1: cartão em dia mostra só a idade, num <time> com datetime e title absoluto, sem selo e sem botão na linha', async () => {
  await abrirApp();
  const pe = haHoras(3);
  usarItens([falso('amazon', pe)]);
  const c = cartao(0), linha = c.querySelector('.idade-preco');
  afirma(linha, 'sem .idade-preco');
  afirma(c.querySelector('.price').nextElementSibling === linha, 'a linha vem logo abaixo de .price');
  igual(c.querySelector('.idade-preco ~ .idade-msg') !== null, true, '.idade-msg depois da linha');
  const t = linha.querySelector('time');
  igual(t.getAttribute('datetime'), pe);
  igual(t.title, ev('textoAbsolutoPreco(' + JSON.stringify(pe) + ')'));
  afirma(/^Preço de (hoje, \d\d:\d\d|ontem, \d\d:\d\d)$/.test(txt(t)), 'texto: ' + txt(t));
  igual(linha.querySelector('.velho'), null, 'em dia: sem selo');
  igual(linha.querySelector('button'), null, 'em dia: sem botão na linha');
  afirma(c.querySelector('.rare .fetch'), 'Amazon em dia: "Atualizar preço" continua em "Mais ações"');
  const antesMeta = c.querySelector('.meta');
  if (antesMeta) afirma(linha.compareDocumentPosition(antesMeta) & W.Node.DOCUMENT_POSITION_FOLLOWING, '.meta vem depois da linha');
});

teste('CA-P1: passou do prazo, nulo ou malformado: selo "Desatualizado" em palavra e borda, sem cor nova', async () => {
  await abrirApp();
  usarItens([falso('amazon', haHoras(30)), falso('amazon', null), falso('amazon', '2026-13-45T99:99:99'), falso('ml', haHoras(30)), falso('shopee', haHoras(200))]);
  const cs = cartoes();
  igual(cs.length, 5);
  const textos = cs.map(c => txt(c.querySelector('.idade-preco')));
  afirma(/^Desatualizado Preço de (ontem, \d\d:\d\d|\d\d\/\d\d \(há 2 dias\))( Atualizar preço)?$/.test(textos[0]), 'amazon 30 h: ' + textos[0]);

  igual(textos[2].startsWith('Desatualizado Idade do preço desconhecida'), true, 'malformado: ' + textos[2]);
  afirma(textos[3].startsWith('Desatualizado '), 'ml: ' + textos[3]);

    igual(cs1.color, W.getComputedStyle(W.document.body).color, 'a cor do texto é a Tinta, sem cor nova');

});

teste('CA-P1: item sem preço não ganha linha de idade nem selo (nem com preco_em velho); sem dados também não', async () => {

teste('CA-P4: lerValidade aceita só inteiro de 1 a 168; qualquer outra coisa vale 24 e levanta o aviso; ausente vale 24 sem aviso', async () => {
  await abrirApp();
  const ler = async valor => {
    FALSO['GET /api/config/preco_validade_horas'] = () => json(valor);
    await W.lerValidade();
    return [ev('precoValidade'), ev('validadeAviso')];
  };
  igual(await ler(48), [48, false]);
  igual(await ler(1), [1, false]);
  igual(await ler(168), [168, false]);
  igual(await ler(24), [24, false]);
  igual(await ler(null), [24, false], 'nunca gravado: padrão, sem aviso');
  for (const v of [0, 169, -5, 24.5, '24', true, false, [], {}, 1e9]) igual(await ler(v), [24, true], JSON.stringify(v));
  FALSO['GET /api/config/preco_validade_horas'] = () => new W.Response('{"error":"x"}', { status: 500 });
  await W.lerValidade();
  igual([ev('precoValidade'), ev('validadeAviso')], [24, true], 'HTTP 500');
  FALSO['GET /api/config/preco_validade_horas'] = () => Promise.reject(new W.TypeError('rede'));
  await W.lerValidade();
  igual([ev('precoValidade'), ev('validadeAviso')], [24, true], 'rede fora');
  FALSO['GET /api/config/preco_validade_horas'] = () => json(72);
  await W.lerValidade();
  igual([ev('precoValidade'), ev('validadeAviso')], [72, false], 'volta ao normal');
  // Q1: o texto cru decide, como o json.loads + int do servidor: "48.0" e "1e2" o JSON.parse leria como inteiros, e o servidor usa 24
  const cru = async texto => {
    FALSO['GET /api/config/preco_validade_horas'] = () => new W.Response(texto, { headers: { 'Content-Type': 'application/json' } });
    await W.lerValidade();
    return [ev('precoValidade'), ev('validadeAviso')];
  };
  for (const t of ['48.0', '1e2', '2.5e1', '1E+1', '72.00', '100.0', '-0', '048', '"48"', 'NaN', 'Infinity', '', 'lixo']) igual(await cru(t), [24, true], 'texto ' + JSON.stringify(t));
  igual(await cru('48'), [48, false]);
  igual(await cru(' 72\n'), [72, false], 'espaço em volta do JSON vale');
  igual(await cru('null'), [24, false], 'nunca gravado');
  igual(W.validadeDoTexto('48'), 48);
  igual(W.validadeDoTexto('null'), null);
  afirma(Number.isNaN(W.validadeDoTexto('48.0')), 'validadeDoTexto("48.0") não é NaN');
});

});

teste('CA-P10: nenhum token novo (cores só por var()), o quadro funciona em claro e escuro; o selo usa a borda do campo (3:1)', async () => {
  await abrirApp();
  const html = await (await fetch('/index.html')).text();
  const css = html.slice(html.indexOf('/* ---- Preço sempre atualizado'), html.indexOf('@media (prefers-reduced-motion'));
  afirma(css.length > 500, 'bloco de CSS dos preços não achado');
  igual(/#[0-9a-fA-F]{3,8}\b/.test(css), false, 'cor literal no CSS dos preços');
  igual(/rgba?\(/.test(css), false);
  igual(/--[a-z-]+\s*:/.test(css), false, 'token novo declarado no CSS dos preços');
  const usados = [...new Set([...css.matchAll(/var\((--[a-z0-9-]+)\)/g)].map(m => m[1]))];
  const raiz = html.slice(html.indexOf(':root{'), html.indexOf('@media (prefers-color-scheme:dark)'));
  for (const t of usados) afirma(raiz.includes(t + ':'), 'token inexistente: ' + t);
  afirma(!usados.includes('--falhou') || /\.idade-msg\.err\{color:var\(--falhou\)/.test(css), '--falhou só no erro de .idade-msg');
  igual(/\.velho[^}]*--falhou/.test(css), false, 'o selo não usa vermelho');
});

let PRAZO_ANTES = null;
(async () => {
  let falhas = 0, total = 0;
  try {
    API_ANTES = await (await fetch('/api/items')).text();
    const lista = JSON.parse(API_ANTES);
    afirma(Array.isArray(lista) && lista.length > 0, '/api/items vazio');
    afirma(lista.every(i => 'preco_em' in i), 'o servidor não traz preco_em (etapa 1 do plano não está no ar nesta porta?)');
    PRAZO_ANTES = await (await fetch('/api/config/preco_validade_horas')).json();
  } catch (e) {
    log(PREF_F + 'preparação — ' + (e && e.message || e));
    linhas.shift();
    log(PREF_R + 'FALH' + 'OU (preparação)');
    return;
  }
  const guardado = localStorage.getItem('activeCat');
  for (const t of testes) {
    total++; testeAtual = t.nome;
    const antesErros = erros.length;
    try {
      await t.fn();
      await dormir(30);
      if (erros.length > antesErros) throw new Falha(erros.slice(antesErros).join(' | '));
      log('ok    ' + t.nome);
    } catch (e) {
      falhas++;
      log(PREF_F + t.nome + ' — ' + (e && e.message || e));
    }
  }
  if (guardado === null) localStorage.removeItem('activeCat'); else localStorage.setItem('activeCat', guardado);
  linhas.shift();
  log('');
  log(total + ' testes, ' + (total - falhas) + ' passaram, ' + falhas + ' falharam');
  log(falhas === 0 && total > 0 ? PREF_R + 'OK' : PREF_R + 'FALH' + 'OU (' + falhas + ' de ' + total + ')');
})();
