<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Testes: Abas</title>
<!--
  Testes das 17 abas por nicho (docs/produto/planos/abas-nichadas-e-coleta.md, etapa 8, CA6; spec docs/produto/specs/abas-nichadas.md,
  CA-D1 a CA-D14). Sem dependência. Rode sobre um banco JÁ MIGRADO para as 17 abas (a cópia migrada do plano, nunca o achadinhos.db
  antes da migração). Sobe o servidor com a cópia e roda o runner apontando para a porta dele:

    ACHADINHOS_DB=<copia migrada> ACHADINHOS_PORTA=8772 ACHADINHOS_DISPARO=0 python3 servidor.py
    PORTA=8772 node testes/rodar.mjs abas

  O runner abre o Chrome headless em tempo real (CDP) e sai com código 0 só quando a linha de resultado diz "OK". Com o banco ainda
  nas abas antigas, o primeiro teste falha de propósito.

  Os nomes e a ordem das abas, os grupos e os textos estão escritos AQUI de propósito (a ordem do dono, spec "Decisões do dono"):
  o teste não lê ORDEM_ABAS do index.html para provar a ordem (o test_front_constantes.py amarra a constante ao buscas.json).

  Regras de segurança desta página:
  - o iframe carrega o /index.html real; só GET sai para a API;
  - fetch do iframe passa por uma guarda: POST, PUT, DELETE e PATCH em /api/ nunca saem. O único PATCH
    que o teste provoca ("Mover para") é interceptado, gravado para conferência e respondido por um
    Response falso: o banco não muda;
  - itens FALSOS (ids 9xxxxxxxx) só existem na memória do iframe (`items = ...`); nada disso chega ao banco;
  - nunca clica em .del, .fetch, #saveLinks nem #saveTpl; window.open e prompt são trocados.

  Obs.: as palavras de resultado ficam montadas por concatenação no script e fora deste comentário,
  para um grep no texto da página não casar com o código-fonte.
-->
<style>
  body{font:13px/1.45 ui-monospace,monospace;padding:12px;color:#111}
  pre{white-space:pre-wrap;margin:0}
  iframe{position:absolute;left:-9999px;top:0;width:1100px;height:900px;border:0}
</style>
</head>
<body>
<h1 style="font:600 16px sans-serif">Testes: Abas</h1>
<pre id="saida"></pre>
<iframe id="app" title="app sob teste"></iframe>

<script>
'use strict';
// ---------------------------------------------------------------- mini-harness
const PREF_R = 'RESULT' + 'ADO: ';
const PREF_F = 'FALH' + 'OU: ';
const SAIDA = document.getElementById('saida');
const linhas = [PREF_R + 'PENDENTE'];
const log = l => { linhas.push(l); SAIDA.textContent = linhas.join('\n'); };
SAIDA.textContent = linhas[0];

class Falha extends Error {}
const afirma = (cond, msg) => { if (!cond) throw new Falha(msg || 'asserção falhou'); };
const igual = (obtido, esperado, msg) => {
  const a = JSON.stringify(obtido), b = JSON.stringify(esperado);
  if (a !== b) throw new Falha((msg ? msg + ': ' : '') + 'esperado ' + b + ', obtido ' + a);
};
const testes = [];
const teste = (nome, fn) => testes.push({ nome, fn });
const dormir = ms => new Promise(r => setTimeout(r, ms));
async function esperar(cond, desc = 'condição', tentativas = 1500, passo = 10) {
  for (let i = 0; i < tentativas; i++) {
    let ok = false;
    try { ok = cond(); } catch (e) { ok = false; }
    if (ok) return;
    await dormir(passo);
  }
  throw new Falha('tempo esgotado esperando: ' + desc);
}

let testeAtual = '(início)';
const erros = [];
function ouvirErros(janela, origem) {
  janela.addEventListener('unhandledrejection', e => {
    erros.push('rejeição não tratada (' + origem + ') durante "' + testeAtual + '": ' + (e.reason && e.reason.message || e.reason));
  });
  janela.addEventListener('error', e => { erros.push('erro não capturado (' + origem + ') durante "' + testeAtual + '": ' + e.message); });
}
ouvirErros(window, 'página de teste');

// ---------------------------------------------------------------- ambiente
// A ordem do dono (17 abas), os 4 grupos da spec e as 3 abas com "Público".
const ORDEM = ['Celulares e Informática', 'Áudio e Acessórios', 'TV, Alexa e Casa Conectada', 'Games', 'Eletroportáteis',
  'Eletrodomésticos e Climatização', 'Cozinha', 'Cama, Mesa e Banho', 'Casa, Móveis e Ferramentas', 'Beleza e Cuidados',
  'Perfumes e Perfumaria', 'Mercado e Limpeza', 'Pets', 'Bebês e Brinquedos', 'Suplementos e Fitness', 'Moda e Viagem', 'Natal e Papelaria'];
const GRUPOS = [['Tecnologia', ORDEM.slice(0, 4)], ['Casa', ORDEM.slice(4, 9)], ['Beleza e consumo', ORDEM.slice(9, 13)], ['Família e estilo', ORDEM.slice(13, 17)]];
const ANTIGAS = ['Black Friday | Eletrônicos', 'Eletrodomésticos', 'Casa e Decoração', 'Lista WhatsApp', 'Black Friday', 'Casa Nova'];
const COM_PUBLICO = ['Perfumes e Perfumaria', 'Beleza e Cuidados', 'Moda e Viagem'];
const PRIMEIRA = ORDEM[0];
const CELULARES = ORDEM[0], TV = ORDEM[2], GAMES = ORDEM[3], ELETRODOMESTICOS = ORDEM[5], PETS = ORDEM[12], BELEZA = ORDEM[9], MODA = ORDEM[15], PERFUMES = ORDEM[10];
const PAGINA = 24;   // PAGE em render()

let W, FETCH_ORIG, API = null, API_ANTES = null;
const VIOL = [];      // tentativas de escrita na API real (devem ficar vazias)
const PATCHES = [];   // PATCH interceptado de "Mover para": { url, corpo, cabecalhos }
const REG_FETCH = [];

const daCat = c => API.filter(i => i.cat === c);
const q = s => W.document.querySelector(s);
const qa = s => [...W.document.querySelectorAll(s)];
const txt = el => el.textContent.replace(/\s+/g, ' ').trim();
const mesmo = (a, b, msg) => { if (a !== b) throw new Falha(msg || 'não é o mesmo nó do DOM'); };

async function largura(px) {
  document.getElementById('app').style.width = px + 'px';
  await dormir(150);
}

async function abrirApp(activeCat) {
  document.getElementById('app').style.width = '1100px';
  localStorage.removeItem('activeCat');
  if (activeCat !== undefined) localStorage.setItem('activeCat', activeCat);
  const antes = erros.length;
  const f = document.getElementById('app');
  await new Promise((res, rej) => { f.onload = res; f.onerror = rej; f.src = '/index.html?t=' + Date.now(); });
  W = f.contentWindow;
  ouvirErros(W, 'app');
  FETCH_ORIG = W.fetch.bind(W);
  PATCHES.length = 0; REG_FETCH.length = 0;
  W.fetch = function (entrada, opcoes) {
    const url = typeof entrada === 'string' ? entrada : ((entrada && entrada.url) || String(entrada));
    const metodo = String((opcoes && opcoes.method) || (entrada && entrada.method) || 'GET').toUpperCase();
    REG_FETCH.push({ url, metodo });
    if (metodo === 'PATCH' && /\/api\/items\/\d+$/.test(url)) {
      PATCHES.push({ url, corpo: JSON.parse(opcoes.body), cabecalhos: opcoes.headers });
      return Promise.resolve(new W.Response('{}', { headers: { 'Content-Type': 'application/json' } }));
    }
    if (metodo !== 'GET' && /\/api\//.test(url)) {
      VIOL.push(metodo + ' ' + url);
      return Promise.reject(new W.TypeError('bloqueado pelo teste: escrita na API real'));
    }
    return FETCH_ORIG(entrada, opcoes);
  };
  W.open = (...a) => { VIOL.push('window.open ' + a[0]); return null; };
  W.prompt = () => { VIOL.push('prompt'); return null; };
  // pronto = a lista carregou (uma aba salva pode estar vazia: não dá para esperar por cartões)
  await esperar(() => W.eval('ofertasProntas === true') && W.eval('items.length') > 0,
    'o index.html carregar os itens (servidor da cópia migrada no ar? PORTA=...)');
  await dormir(30);   // unhandledrejection só dispara depois do fim da microtask
  if (erros.length > antes) throw new Falha('erro ao abrir o app: ' + erros.slice(antes).join(' | '));
}

// Item falso só na memória do iframe (id 9xxxxxxxx; nunca chega ao banco)
let SEQ = 900000000;
const falso = (cat, genero = 'sem', extra = {}) => {
  const n = ++SEQ;
  return { id: n, loja: 'amazon', item_id: 'FALSO' + n, cat, busca: 'termo falso', url: 'https://www.amazon.com.br/dp/B0FALSO' + n + '?tag=desejodemen01-20',
    data: { titulo: 'Produto falso ' + n, preco: 'R$ 10,00' }, genero, genero_origem: '', genero_auto: genero, ...extra };
};
function usarItens(lista) {
  W.eval('items = ' + JSON.stringify(lista) + '; page = 1; render();');
}
const normaliza = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');   // o separador de milhar do app

const abas = () => qa('#tabs .tab');
// Texto do botão sem o contador (o <span class="muted">N</span> no fim).
const nomeDaAba = b => b.firstChild.textContent.replace(/\s+$/, '');
// o contador tem separador de milhar ("3.110", como o controle Público)
const contadorDaAba = b => +b.querySelector('.muted').textContent.replace(/\./g, '');
const milhar = normaliza;
const abaAtiva = () => abas().filter(b => b.classList.contains('active'));
const abaPorNome = nome => abas().find(b => b.dataset.c === nome);
const catAtiva = () => W.eval('activeCat');
const cartoes = () => qa('#grid .card');
const totalFiltrado = () => W.eval('filtrada().length');
const tituloPager = () => q('.pager').textContent.replace(/\s+/g, ' ').trim();
const selCat = () => q('#selCat');
const visivel = el => !!el && W.getComputedStyle(el).display !== 'none' && el.getClientRects().length > 0;
const semRolagemHorizontal = () => { const d = W.document.documentElement; return d.scrollWidth <= d.clientWidth + 1; };

function clicar(botao) { botao.click(); }
function escolher(select, valor) {
  select.value = valor;
  select.dispatchEvent(new W.Event('change', { bubbles: true }));
}
const textoAnuncio = (cat, n) => n === 0 ? cat + ': nenhuma oferta' : n === 1 ? cat + ': 1 oferta' : cat + ': ' + milhar(n) + ' ofertas';

// ================================================================ precondição
teste('o banco da cópia está migrado: toda categoria dos itens é uma das 17 abas finais, e nenhuma é antiga', async () => {
  await abrirApp();
  const cs = [...new Set(API.map(i => i.cat))];
  const fora = cs.filter(c => !ORDEM.includes(c));
  afirma(fora.length === 0, 'categorias fora das 17 (rode a página sobre a cópia JÁ migrada): ' + JSON.stringify(fora));
  afirma(!cs.some(c => ANTIGAS.includes(c)), 'o banco ainda tem aba antiga: ' + JSON.stringify(cs));
});

// ================================================================ CA-D1, CA-D2: as 17 abas em 4 faixas
teste('CA-D1: há 17 abas, na ordem do dono, com o nome exato e a contagem do banco; nenhuma aba antiga; sem grupo "Outras"', async () => {
  await abrirApp();
  igual(W.eval('ORDEM_ABAS'), ORDEM, 'a constante do app é a ordem do dono');
  igual(abas().map(b => b.dataset.c), ORDEM);
  igual(abas().map(nomeDaAba), ORDEM, 'o texto do botão (sem o contador) é o nome');
  for (const c of ORDEM) {
    const b = abaPorNome(c);
    igual(b.textContent.replace(/\s+/g, ' ').trim(), c + ' ' + milhar(daCat(c).length), 'texto + contador de "' + c + '"');
    igual(contadorDaAba(b), daCat(c).length, 'contador de "' + c + '"');
  }
  igual(abas().reduce((s, x) => s + contadorDaAba(x), 0), API.length, 'a soma dos contadores é o total');
  for (const a of ANTIGAS) afirma(!abaPorNome(a), 'aba antiga na barra: ' + a);
  igual(qa('#tabs .tabs-grupo').length, 4, 'sem "Outras" quando não há categoria fora das 17');
  // cada pílula nasce uma vez só
  igual(new Set(abas().map(b => b.dataset.c)).size, 17);
});

teste('CA-D2: em 1280 px as abas formam 4 faixas rotuladas (4, 5, 4 e 4), com até 230 px de altura e sem rolagem horizontal', async () => {
  await abrirApp(PRIMEIRA);   // sem nada guardado o app abre sem categoria (todas): a pílula ativa precisa de uma categoria marcada
  await largura(1280);
  const faixas = qa('#tabs .tabs-grupo');
  igual(faixas.map(f => txt(f.querySelector('.lbl'))), GRUPOS.map(g => g[0]));
  igual(faixas.map(f => [...f.querySelectorAll('.tab')].map(b => b.dataset.c)), GRUPOS.map(g => g[1]));
  for (const f of faixas) {
    const rot = f.querySelector('.lbl');
    igual(f.getAttribute('role'), 'group');
    igual(f.getAttribute('aria-labelledby'), rot.id, 'a faixa é nomeada pelo rótulo visível');
    afirma(rot.id && q('#' + rot.id) === rot);
    igual(Math.round(rot.getBoundingClientRect().width), 144, 'rótulo em coluna fixa de 144 px');
  }
  igual(q('#tabs').getAttribute('aria-label'), 'Categorias');
  const h = q('#tabs').getBoundingClientRect().height;
  afirma(h <= 230, 'altura das abas em 1280 px: ' + h);
  afirma(semRolagemHorizontal(), 'rolagem horizontal em 1280 px');
  afirma(visivel(q('#tabs')) && !visivel(selCat()), 'no desktop só as faixas aparecem');
  // a pílula ativa é a única com Etiqueta (borda escura) e fica à vista
  igual(abaAtiva().map(b => b.dataset.c), [catAtiva()]);
  // abaixo de 900 px o rótulo passa para cima das pílulas
  await largura(700);
  const f0 = qa('#tabs .tabs-grupo')[0];
  afirma(f0.querySelector('.lbl').getBoundingClientRect().bottom <= f0.querySelector('.tab').getBoundingClientRect().top + 1, 'rótulo acima das pílulas em 700 px');
  afirma(semRolagemHorizontal(), 'rolagem horizontal em 700 px');
});

// ================================================================ CA-D3: celular
teste('CA-D3: em 320, 360 e 375 px as faixas somem e entra o seletor "Categoria" (44 px, rótulo visível, optgroup por grupo, contagem em cada opção); a partir de 601 px é o contrário', async () => {
  await abrirApp(PRIMEIRA);
  for (const px of [320, 360, 375]) {
    await largura(px);
    afirma(!visivel(q('#tabs')), px + ' px: as faixas ficam escondidas');
    const s = selCat();
    afirma(visivel(s), px + ' px: o seletor aparece');
    afirma(s.getBoundingClientRect().height >= 44, px + ' px: altura do seletor ' + s.getBoundingClientRect().height);
    afirma(s.getBoundingClientRect().width >= px - 48, px + ' px: o seletor ocupa a largura: ' + s.getBoundingClientRect().width);
    const rot = q('label[for="selCat"]');
    afirma(rot && visivel(rot) && txt(rot) === 'Categoria', 'rótulo visível "Categoria" associado por for');
    igual([...s.querySelectorAll('optgroup')].map(g => g.label), GRUPOS.map(g => g[0]));
    igual([...s.querySelectorAll('optgroup')].map(g => [...g.querySelectorAll('option')].map(o => o.value)), GRUPOS.map(g => g[1]));
    // a primeira opção, sem valor, é "Todas as categorias" e conta todos os itens; as outras 17 são as abas
    igual([s.options[0].value, s.options[0].textContent], ['', 'Todas as categorias (' + milhar(API.length) + ')'], 'primeira opção');
    for (const o of [...s.options].slice(1)) igual(o.textContent, o.value + ' (' + milhar(daCat(o.value).length) + ')', 'opção "' + o.value + '"');
    igual(s.options.length, 18);
    igual([...s.options].slice(1).map(o => o.value), ORDEM, 'as 17 abas, na ordem');
    igual(s.value, catAtiva(), 'o seletor mostra a aba ativa');
    afirma(semRolagemHorizontal(), px + ' px: rolagem horizontal');
  }
  // ordem das barras: seletor, contador, filtros
  afirma(selCat().compareDocumentPosition(q('#count')) & W.Node.DOCUMENT_POSITION_FOLLOWING, '#count vem depois do seletor');
  afirma(q('#count').compareDocumentPosition(q('.filters')) & W.Node.DOCUMENT_POSITION_FOLLOWING, 'os filtros vêm depois do contador');
  await largura(600);
  afirma(visivel(selCat()) && !visivel(q('#tabs')), '600 px ainda é celular');
  await largura(601);
  afirma(!visivel(selCat()) && visivel(q('#tabs')), '601 px: faixas, sem seletor');
  afirma(semRolagemHorizontal());
});

// ================================================================ CA-D4: trocar de aba
teste('CA-D4: escolher a aba pelo botão ou pelo seletor faz o mesmo: aba ativa trocada, busca e página zeradas, anúncio no aria-live, controles em sincronia', async () => {
  await abrirApp();
  const aria = q('#anuncioLista');
  igual([aria.getAttribute('role'), aria.getAttribute('aria-live')], ['status', 'polite']);
  const n = daCat(GAMES).length;
  afirma(n > 1, 'a cópia precisa de itens em Games');
  for (const via of ['botão', 'seletor']) {
    // estado sujo: outra aba, uma busca e a página 2
    clicar(abaPorNome(ELETRODOMESTICOS));
    escolher(q('#fBusca'), [...q('#fBusca').options][1].value);
    W.eval('page = 2');
    afirma(q('#fBusca').value !== '', 'precondição: busca escolhida');
    aria.textContent = '';
    if (via === 'botão') clicar(abaPorNome(GAMES)); else escolher(selCat(), GAMES);
    igual(catAtiva(), GAMES, via + ': activeCat');
    igual(abaAtiva().map(b => b.dataset.c), [GAMES], via + ': só a Games ativa');
    igual(abaAtiva()[0].getAttribute('aria-pressed'), 'true');
    igual(abas().filter(b => b.getAttribute('aria-pressed') === 'false').length, 16);
    igual(selCat().value, GAMES, via + ': o seletor acompanha');
    igual(q('#fBusca').value, '', via + ': busca zerada');
    igual(W.eval('page'), 1, via + ': página zerada');
    igual(txt(aria), textoAnuncio(GAMES, n), via + ': anúncio');
    igual(localStorage.getItem('activeCat'), GAMES);
    igual(totalFiltrado(), n);
  }
  // a mesma aba de novo também zera a busca (a busca escolhida existe nela: sem o zeramento, o render a manteria)
  for (const via of ['botão', 'seletor']) {
    clicar(abaPorNome(GAMES));
    const busca = [...q('#fBusca').options][1].value;
    escolher(q('#fBusca'), busca);
    igual(q('#fBusca').value, busca, 'precondição: busca escolhida na própria aba');
    if (via === 'botão') clicar(abaPorNome(GAMES)); else escolher(selCat(), GAMES);
    igual(q('#fBusca').value, '', via + ': a mesma aba zera a busca');
  }
  // singular e zero no anúncio
  usarItens([falso(GAMES)]);
  clicar(abaPorNome(PETS));
  igual(txt(aria), 'Pets: nenhuma oferta');
  clicar(abaPorNome(GAMES));
  igual(txt(aria), 'Games: 1 oferta');
});

teste('CA-D4: trocar de aba restaura o público lembrado daquela aba (o controle some nas abas sem público)', async () => {
  await abrirApp();
  localStorage.setItem('genero:' + PERFUMES, 'feminino');
  try {
    clicar(abaPorNome(PERFUMES));
    igual(q('#publicoBox input:checked').value, 'feminino');
    escolher(selCat(), GAMES);
    igual(q('#publicoBox fieldset'), null);
    escolher(selCat(), PERFUMES);
    igual(q('#publicoBox input:checked').value, 'feminino', 'o público lembrado volta com a aba');
  } finally { localStorage.removeItem('genero:' + PERFUMES); }
});

// ================================================================ CA-D5: aba vazia
teste('CA-D5: aba sem item aparece com contagem 0, pode ser aberta (não é desabilitada) e mostra a frase de categoria vazia, sem filtros', async () => {
  await abrirApp();
  usarItens(API.filter(i => i.cat !== PETS));
  const b = abaPorNome(PETS);
  igual(contadorDaAba(b), 0);
  igual(b.disabled, false);
  igual(b.getAttribute('aria-disabled'), null);
  igual([...selCat().options].find(o => o.value === PETS).textContent, 'Pets (0)');
  clicar(b);
  igual(catAtiva(), PETS);
  igual(abaAtiva().map(x => x.dataset.c), [PETS]);
  igual(txt(q('#estadoLista')), 'Esta categoria ainda não tem ofertas. Use Adicionar links para incluir.');
  igual(qa('#estadoLista button').length, 0, 'sem "Limpar filtros": não há filtro a limpar');
  igual(cartoes().length, 0);
  afirma(visivel(q('#tabs')) && visivel(q('#count')), 'as abas continuam à vista para sair dela');
  for (const s of ['.filters', '.barra-lista', '.pager']) afirma(!visivel(q(s)), s + ' some na aba vazia');
  // sair dela devolve a tela
  clicar(abaPorNome(GAMES));
  igual(txt(q('#estadoLista')), '');
  for (const s of ['.filters', '.barra-lista', '.pager', '#grid']) afirma(visivel(q(s)), s + ' volta');
  // abrir já nela, vindo do localStorage (a cópia migrada tem abas vazias; se não tiver, o filtro acima já cobriu)
  await abrirApp(PETS);
  igual(catAtiva(), PETS, 'uma aba salva e vazia continua sendo a ativa');
});

// ================================================================ CA-D6: aba salva que não existe mais
async function abreNaPrimeira(valorGuardado, descricao) {
  afirma(!ORDEM.includes(valorGuardado), 'precondição: "' + valorGuardado + '" não pode ser uma das 17');
  await abrirApp(valorGuardado);
  igual(catAtiva(), PRIMEIRA, descricao + ': activeCat');
  igual(abaAtiva().map(b => b.dataset.c), [PRIMEIRA], descricao + ': só a primeira aba fica ativa');
  igual(abaAtiva()[0].getAttribute('aria-pressed'), 'true');
  afirma(cartoes().length > 0, descricao + ': a grade tem que mostrar os itens da primeira aba');
  igual(localStorage.getItem('activeCat'), PRIMEIRA, 'o activeCat gravado é corrigido para a primeira aba');
  igual(totalFiltrado(), daCat(PRIMEIRA).length);
  igual(selCat().value, PRIMEIRA, 'o seletor também');
}

teste('CA-D6: com activeCat de uma aba que sumiu ("Black Friday", "Casa Nova"...) o front abre em "Celulares e Informática", sem erro', async () => {
  for (const [valor, desc] of [['Black Friday', 'Black Friday'], ['Casa Nova', 'Casa Nova'], ['Black Friday | Eletrônicos', 'aba antiga'], ['Eletrodomésticos', 'aba antiga'],
                                ['Casa e Decoração', 'aba antiga'], ['celulares e informática', 'caixa diferente'],
                                [PRIMEIRA + ' ', 'com espaço no fim'], ['Categoria que nunca existiu', 'inexistente']]) {
    await abreNaPrimeira(valor, desc);
  }
});

teste('CA-D6: sem activeCat guardado (ou guardado vazio) abre com todas as categorias; com uma das 17 guardada, reabre nela', async () => {
  for (const [guardado, desc] of [[undefined, 'nada guardado'], ['', 'guardado vazio']]) {

teste('CA-D14: com 10.400 itens, trocar de aba e de público leva menos de 200 ms, sem recriar as pílulas e contando as abas uma vez por render()', async () => {
  await abrirApp();
  const extra = [];
  const alvo = Math.max(10400, API.length + 17);   // a base real cresce com a coleta
  while (API.length + extra.length < alvo) extra.push(falso(ORDEM[extra.length % 17], ['feminino', 'masculino', 'sem'][extra.length % 3]));
  usarItens([...API, ...extra]);
  igual(W.eval('items.length'), alvo);
  let chamadas = 0;
  const original = W.contarAbas;
  W.contarAbas = function () { chamadas++; return original.apply(this, arguments); };
  try {
    const antes = abas();
    let t0 = W.performance.now();
    clicar(abaPorNome(GAMES));
    const tAba = W.performance.now() - t0;
    igual(chamadas, 1, 'contarAbas por render() ao trocar de aba');
    afirma(tAba < 200, 'trocar de aba levou ' + Math.round(tAba) + ' ms');
    antes.forEach((b, i) => mesmo(abas()[i], b, 'a pílula ' + i + ' foi recriada'));
    clicar(abaPorNome(PERFUMES));
    chamadas = 0;
    t0 = W.performance.now();
    q('#publicoBox input[value="feminino"]').click();
    const tPub = W.performance.now() - t0;
    igual(chamadas, 1, 'contarAbas por render() ao trocar de público');
    afirma(tPub < 200, 'trocar de público levou ' + Math.round(tPub) + ' ms');
  } finally { W.contarAbas = original; }
});

(async () => {
  let falhas = 0, total = 0;
  try {
    API_ANTES = await (await fetch('/api/items')).text();
    API = JSON.parse(API_ANTES);
    afirma(Array.isArray(API) && API.length > 0, '/api/items vazio');
  } catch (e) {
    log(PREF_F + 'preparação — ' + (e && e.message || e));
    linhas.shift();
    log(PREF_R + 'FALH' + 'OU (preparação)');
    return;
  }
  const guardado = localStorage.getItem('activeCat');
  for (const t of testes) {
    total++; testeAtual = t.nome;
    const antesErros = erros.length;
    try {
      await t.fn();
      await dormir(30);
      if (erros.length > antesErros) throw new Falha(erros.slice(antesErros).join(' | '));
      log('ok    ' + t.nome);
    } catch (e) {
      falhas++;
      log(PREF_F + t.nome + ' — ' + (e && e.message || e));
    }
  }
  if (guardado === null) localStorage.removeItem('activeCat'); else localStorage.setItem('activeCat', guardado);
  linhas.shift();
  log('');
  log(total + ' testes, ' + (total - falhas) + ' passaram, ' + falhas + ' falharam');
  log(falhas === 0 && total > 0 ? PREF_R + 'OK' : PREF_R + 'FALH' + 'OU (' + falhas + ' de ' + total + ')');
})();
