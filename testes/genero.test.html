<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Testes: Público (gênero) no front</title>
<!--
  Testes da Parte A da spec docs/produto/specs/genero-e-ux.md (plano docs/produto/planos/genero-nas-categorias.md, etapa 6):
  controle "Público", contagens, memória por aba, select de buscas, selo no cartão, correção à mão em "Mais ações"
  e o campo "Público" da regra do disparo. Sem dependência. Servidor de teste sobre CÓPIA do banco:

    ACHADINHOS_DB=<copia> ACHADINHOS_PORTA=8766 ACHADINHOS_DISPARO=0 python3 servidor.py
    PORTA=8766 node testes/rodar.mjs genero

  O runner abre o Chrome headless em tempo real (CDP) e sai com código 0 só quando a linha de resultado diz "OK".

  Regras de segurança desta página:
  - o iframe carrega o /index.html real; só GET sai para a API. Escrita (PUT do público, PATCH de "Mover para")
    passa por uma guarda: o PUT de /api/items/<id>/genero e o PATCH de /api/items/<id> são interceptados, gravados
    para conferência e respondidos por um Response falso; qualquer outra escrita em /api/ vira violação e nunca sai;
  - quase tudo roda com itens FALSOS (montados em `items` e desenhados por render()/renderCard); só o teste de
    "recarregar a página" lê os itens reais, por GET;
  - window.open e prompt são trocados; nunca clica em .del, .fetch nem #saveLinks.

  Obs.: as palavras de resultado ficam montadas por concatenação no script, para um grep no texto da página
  não casar com o código-fonte.
-->
<style>
  body{font:13px/1.45 ui-monospace,monospace;padding:12px;color:#111}
  pre{white-space:pre-wrap;margin:0}
  iframe{position:absolute;left:-9999px;top:0;width:1100px;height:900px;border:0}
</style>
</head>
<body>
<h1 style="font:600 16px sans-serif">Testes: Público (gênero) no front</h1>
<pre id="saida"></pre>
<iframe id="app" title="app sob teste"></iframe>

<script>
'use strict';
// ---------------------------------------------------------------- mini-harness
const PREF_R = 'RESULT' + 'ADO: ';
const PREF_F = 'FALH' + 'OU: ';
const SAIDA = document.getElementById('saida');
const linhas = [PREF_R + 'PENDENTE'];
const log = l => { linhas.push(l); SAIDA.textContent = linhas.join('\n'); };
SAIDA.textContent = linhas[0];

class Falha extends Error {}
const afirma = (cond, msg) => { if (!cond) throw new Falha(msg || 'asserção falhou'); };
const igual = (obtido, esperado, msg) => {
  const a = JSON.stringify(obtido), b = JSON.stringify(esperado);
  if (a !== b) throw new Falha((msg ? msg + ': ' : '') + 'esperado ' + b + ', obtido ' + a);
};
// Identidade de nó do DOM: JSON.stringify de elemento não distingue um do outro, então `igual` não serve para isto
const mesmo = (obtido, esperado, msg) => { if (obtido !== esperado) throw new Falha((msg ? msg + ': ' : '') + 'não é o mesmo nó do DOM'); };
const testes = [];
const teste = (nome, fn) => testes.push({ nome, fn });
const dormir = ms => new Promise(r => setTimeout(r, ms));
async function esperar(cond, desc = 'condição', tentativas = 1500, passo = 10) {
  for (let i = 0; i < tentativas; i++) {
    let ok = false;
    try { ok = cond(); } catch (e) { ok = false; }
    if (ok) return;
    await dormir(passo);
  }
  throw new Falha('tempo esgotado esperando: ' + desc);
}

let testeAtual = '(início)';
const erros = [];
function ouvirErros(janela, origem) {
  janela.addEventListener('unhandledrejection', e => {
    erros.push('rejeição não tratada (' + origem + ') durante "' + testeAtual + '": ' + (e.reason && e.reason.message || e.reason));
  });
  janela.addEventListener('error', e => { erros.push('erro não capturado (' + origem + ') durante "' + testeAtual + '": ' + e.message); });
}
ouvirErros(window, 'página de teste');

// ---------------------------------------------------------------- ambiente
const PERF = 'Perfumes e Perfumaria';
const CASA = 'Casa e Decoração';
const ELETRO = 'Eletrodomésticos';
const PAGINA = 24;   // PAGE em render()

let W, FETCH_ORIG, API = null, API_ANTES = null;
const VIOL = [];      // escrita na API real (deve ficar vazia)
const PUTS = [];      // PUT interceptado de /api/items/<id>/genero: { url, corpoTexto, cabecalhos }
const PATCHES = [];   // PATCH interceptado de /api/items/<id>: { url, corpo }
let RESP_PUT = null;  // (pedido) => Promise<Response>; o teste define
let RESP_PATCH = null;

const json = (corpo, status = 200) => new W.Response(JSON.stringify(corpo), { status, headers: { 'Content-Type': 'application/json' } });

async function abrirApp(activeCat) {
  localStorage.removeItem('activeCat');
  if (activeCat !== undefined) localStorage.setItem('activeCat', activeCat);
  const antes = erros.length;
  const f = document.getElementById('app');
  f.removeAttribute('srcdoc');   // abrirAppComApi usa srcdoc, que vale mais que src
  await new Promise((res, rej) => { f.onload = res; f.onerror = rej; f.src = '/index.html?t=' + Date.now(); });
  W = f.contentWindow;
  ouvirErros(W, 'app');
  FETCH_ORIG = W.fetch.bind(W);
  PUTS.length = 0; PATCHES.length = 0; RESP_PUT = null; RESP_PATCH = null;
  W.fetch = function (entrada, opcoes) {
    const url = typeof entrada === 'string' ? entrada : ((entrada && entrada.url) || String(entrada));
    const metodo = String((opcoes && opcoes.method) || (entrada && entrada.method) || 'GET').toUpperCase();
    if (metodo === 'PUT' && /^\/api\/items\/\d+\/genero$/.test(url)) {
      const pedido = { url, corpoTexto: opcoes.body, cabecalhos: opcoes.headers };
      PUTS.push(pedido);
      return RESP_PUT ? RESP_PUT(pedido) : Promise.reject(new W.TypeError('sem resposta definida'));
    }
    if (metodo === 'PATCH' && /^\/api\/items\/\d+$/.test(url)) {
      const pedido = { url, corpo: JSON.parse(opcoes.body) };
      PATCHES.push(pedido);
      return Promise.resolve(RESP_PATCH ? RESP_PATCH(pedido) : json({}));
    }
    if (metodo !== 'GET' && /\/api\//.test(url)) {
      VIOL.push(metodo + ' ' + url);
      return Promise.reject(new W.TypeError('bloqueado pelo teste: escrita na API real'));
    }
    return FETCH_ORIG(entrada, opcoes);
  };
  W.open = (...a) => { VIOL.push('window.open ' + a[0]); return null; };
  W.prompt = () => { VIOL.push('prompt'); return null; };
  await esperar(() => W.eval('items.length') > 0 && W.document.querySelectorAll('#grid .card').length > 0, 'o index.html carregar os itens (servidor no ar? PORTA=...)');
  await dormir(30);
  if (erros.length > antes) throw new Falha('erro ao abrir o app: ' + erros.slice(antes).join(' | '));
}

const q = s => W.document.querySelector(s);
const qa = s => [...W.document.querySelectorAll(s)];
const txt = el => el.textContent.replace(/\s+/g, ' ').trim();
const cartoes = () => qa('#grid .card');
const radios = () => qa('#publicoBox input[name="publico"]');
const valoresPublico = () => radios().map(i => i.value);
const contagens = () => radios().map(i => +i.nextElementSibling.querySelector('.num').textContent.replace(/\./g, ''));
const marcado = () => (radios().find(i => i.checked) || {}).value;
function escolherPublico(v) {
  const r = radios().find(i => i.value === v);
  afirma(r, 'não existe a opção "' + v + '" (opções: ' + valoresPublico() + ')');
  r.click();
}
function escolher(select, valor) {
  select.value = valor;
  select.dispatchEvent(new W.Event('change', { bubbles: true }));
}
const aba = nome => qa('#tabs .tab').find(b => b.dataset.c === nome);
const toastTxt = () => txt(q('#toast'));
const buscasDoSelect = () => [...q('#fBusca').options].map(o => o.textContent);

// ---------------------------------------------------------------- itens falsos
let seq = 5000;
function item(cat, genero, o = {}) {
  const id = ++seq;
  return {
    id, loja: o.loja || 'amazon', item_id: 'FALSO' + id, cat, busca: o.busca || 'Busca A', url: 'https://meli.la/F' + id,
    data: o.data === null ? null : { titulo: o.titulo || 'Produto ' + genero + ' ' + id, preco: 'R$ 10,00', desconto: '-10%', ...(o.data || {}) },
    genero, genero_origem: o.origem === undefined ? (cat === PERF && genero !== 'sem' ? 'titulo' : '') : o.origem,
    genero_auto: o.auto || genero,
  };
}
// Perfumes: F 30 (20 "Busca F" amazon + 10 "Busca Mista" ml), M 20 (15 "Busca M" amazon + 5 "Busca Mista" ml), U 5, sem 7 (3 amazon + 4 ml "Busca S").
// Casa e Eletrodomésticos: tudo "sem" (a aba não separa por público).
function cenario() {
  seq = 5000;
  const L = [];
  for (let i = 0; i < 20; i++) L.push(item(PERF, 'feminino', { busca: 'Busca F' }));
  for (let i = 0; i < 10; i++) L.push(item(PERF, 'feminino', { busca: 'Busca Mista', loja: 'ml' }));
  for (let i = 0; i < 15; i++) L.push(item(PERF, 'masculino', { busca: 'Busca M' }));
  for (let i = 0; i < 5; i++) L.push(item(PERF, 'masculino', { busca: 'Busca Mista', loja: 'ml' }));
  for (let i = 0; i < 5; i++) L.push(item(PERF, 'unissex', { busca: 'Busca Mista' }));
  for (let i = 0; i < 3; i++) L.push(item(PERF, 'sem', { busca: 'Busca Mista' }));
  for (let i = 0; i < 4; i++) L.push(item(PERF, 'sem', { busca: 'Busca S', loja: 'ml' }));
  for (let i = 0; i < 10; i++) L.push(item(CASA, 'sem', { busca: 'Casa A' }));
  for (let i = 0; i < 5; i++) L.push(item(ELETRO, 'sem', { busca: 'Eletro A' }));
  return L;
}
// Troca os itens do app pelos falsos, limpa filtros e a memória de público, e desenha a aba pedida
function montar(lista, cat = PERF) {
  for (const k of Object.keys(localStorage)) if (k.startsWith('genero:')) localStorage.removeItem(k);
  PUTS.length = 0; PATCHES.length = 0; RESP_PUT = null; RESP_PATCH = null;
  W.eval('items = ' + JSON.stringify(lista) + '; activeCat = ' + JSON.stringify(cat) + '; page = 1;');
  for (const id of ['fLoja', 'fBusca', 'fOrdem']) q('#' + id).value = '';
  q('#fTexto').value = '';
  W.render();
}

// ================================================================ constantes e funções puras
teste('constantes: ABAS_COM_GENERO e GENEROS são as do servidor (genero.py)', async () => {
  await abrirApp();
  igual(W.eval('ABAS_COM_GENERO'), [PERF]);
  igual(W.eval('GENEROS'), ['feminino', 'masculino', 'unissex', 'sem']);
  igual(W.eval('abaTemGenero')(PERF), true);
  for (const c of [CASA, ELETRO, 'Black Friday | Eletrônicos', '', 'perfumes e perfumaria']) igual(W.eval('abaTemGenero')(c), false, c);
});

teste('casaGenero: lista vazia = todos; público só vale em aba com gênero; valor estranho vale como "sem"', async () => {
  const casa = W.eval('casaGenero');
  const p = g => ({ cat: PERF, genero: g }), c = { cat: CASA, genero: 'sem' };
  for (const g of ['feminino', 'masculino', 'unissex', 'sem']) {
    igual(casa(p(g), []), true, 'vazio: ' + g);
    igual(casa(p(g), undefined), true, 'sem a lista (regra antiga): ' + g);
    igual(casa(p(g), [g]), true, 'o próprio: ' + g);
  }
  igual(casa(p('feminino'), ['masculino']), false);
  igual(casa(p('feminino'), ['masculino', 'unissex']), false);
  igual(casa(p('unissex'), ['feminino', 'unissex']), true);
  igual(casa(p('sem'), ['feminino']), false);
  igual(casa(p('sem'), ['sem']), true);
  // fora das abas com gênero o item passa inteiro, como no servidor
  igual(casa(c, ['feminino']), true);
  igual(casa({ cat: ELETRO, genero: 'sem' }, ['masculino', 'unissex']), true);
  // item sem o campo, ou com um valor que não é da lista, conta como "sem"
  igual(casa({ cat: PERF }, ['sem']), true);
  igual(casa({ cat: PERF }, ['feminino']), false);
  igual(casa({ cat: PERF, genero: '<img src=x>' }, ['sem']), true);
  igual(casa({ cat: PERF, genero: '<img src=x>' }, ['feminino']), false);
});

teste('contarGeneros: "todos" é a soma e inclui os sem gênero; valor estranho cai em "sem"', async () => {
  const cont = W.eval('contarGeneros');
  igual(cont([]), { todos: 0, feminino: 0, masculino: 0, unissex: 0, sem: 0 });
  igual(cont([{ genero: 'feminino' }, { genero: 'feminino' }, { genero: 'masculino' }, { genero: 'unissex' }, { genero: 'sem' }, {}, { genero: 'xis' }]),
    { todos: 7, feminino: 2, masculino: 1, unissex: 1, sem: 3 });
  igual(cont(cenario().filter(i => i.cat === PERF)), { todos: 62, feminino: 30, masculino: 20, unissex: 5, sem: 7 });
});

// ================================================================ controle "Público" (CA-V1, V4, V5)
teste('CA-V1: em Perfumes o controle "Público" tem Todos, Feminino, Masculino, Unissex (e Sem gênero) com a contagem; em aba sem gênero não existe no DOM', async () => {
  montar(cenario());
  const fs = q('#publicoBox fieldset');
  afirma(fs, 'faltou o fieldset do Público');
  igual(txt(fs.querySelector('legend')), 'Público');
  igual(valoresPublico(), ['todos', 'feminino', 'masculino', 'unissex', 'sem']);
  igual(radios().map(i => txt(i.closest('label'))), ['Todos 62', 'Feminino 30', 'Masculino 20', 'Unissex 5', 'Sem gênero 7']);
  igual(contagens(), [62, 30, 20, 5, 7]);
  igual(marcado(), 'todos', 'abre em Todos');
  igual(new Set(radios().map(i => i.name)).size, 1, 'um grupo só (setas trocam a opção)');
  igual(radios().every(i => i.type === 'radio'), true, 'rádio nativo');
  igual(fs.tagName, 'FIELDSET'); mesmo(fs.querySelector('legend').parentElement, fs);
  // em aba sem gênero o controle some do DOM
  aba(CASA).click();
  igual(q('#publicoBox fieldset'), null);
  igual(q('#publicoBox').children.length, 0);
  igual(radios().length, 0);
  aba(ELETRO).click();
  igual(q('#publicoBox fieldset'), null);
  aba(PERF).click();
  igual(valoresPublico().length, 5, 'volta ao voltar para Perfumes');
});

teste('CA-V1/CA-V12: o controle usa Tinta (neutro), nunca o acento Etiqueta; a opção marcada tem "✓" e a contagem é Mono', async () => {
  montar(cenario());
  escolherPublico('masculino');
  const marcada = radios().find(i => i.checked).nextElementSibling;
  const cs = W.getComputedStyle(marcada), corpo = W.getComputedStyle(W.document.body);
  igual(cs.backgroundColor, corpo.color, 'fundo da opção marcada = Tinta (a cor do texto do corpo)');
  igual(W.getComputedStyle(marcada, '::before').content.replace(/["' /]/g, '').slice(0, 1), '✓', 'o ✓ não depende da cor');
  const etiqueta = ['#FF5B14', '#FF6A2B', '#C2410C', '#FFEDE3', '#3A2216'];
  const rgb = h => { const n = parseInt(h.slice(1), 16); return 'rgb(' + (n >> 16) + ', ' + ((n >> 8) & 255) + ', ' + (n & 255) + ')'; };
  for (const i of radios()) {
    const s = W.getComputedStyle(i.nextElementSibling);
    afirma(!etiqueta.map(rgb).includes(s.backgroundColor) && !etiqueta.map(rgb).includes(s.borderTopColor), 'opção "' + i.value + '" usa o acento: ' + s.backgroundColor + ' / ' + s.borderTopColor);
  }
  afirma(/mono/i.test(W.getComputedStyle(radios()[0].nextElementSibling.querySelector('.num')).fontFamily), 'a contagem é Mono');
});

teste('CA-V5: "Sem gênero" só existe se houver ao menos um item (com a loja e o título de agora)', async () => {
  montar(cenario().filter(i => i.genero !== 'sem'));
  igual(valoresPublico(), ['todos', 'feminino', 'masculino', 'unissex'], 'nenhum sem gênero na aba');
  igual(contagens(), [55, 30, 20, 5]);
  montar(cenario());
  igual(valoresPublico().includes('sem'), true);
  // com o filtro de loja a "Sem gênero" some se a loja não tem nenhum
  escolher(q('#fLoja'), 'shopee');
  igual(valoresPublico(), ['todos', 'feminino', 'masculino', 'unissex']);
  igual(contagens(), [0, 0, 0, 0], 'opção com zero continua habilitada, mostrando 0');
  igual(radios().some(i => i.disabled), false, 'nunca desabilitada');
  escolher(q('#fLoja'), '');
  igual(valoresPublico().includes('sem'), true);
});

teste('CA-V5: item sem gênero só aparece em "Todos" e em "Sem gênero"', async () => {
  montar(cenario());
  const ehSem = i => i.genero === 'sem';
  igual(W.eval('filtrada()').filter(ehSem).length, 7);
  for (const v of ['feminino', 'masculino', 'unissex']) {
    escolherPublico(v);
    igual(W.eval('filtrada()').some(ehSem), false, 'sem gênero apareceu em ' + v);
  }
  escolherPublico('sem');
  igual(W.eval('filtrada()').every(ehSem), true);
  igual(W.eval('filtrada().length'), 7);
  igual(cartoes().length, 7);
  escolherPublico('todos');
  igual(W.eval('filtrada().filter(i => i.genero === "sem").length'), 7);
  igual(W.eval('filtrada().length'), 62);
});

// ================================================================ escolher (CA-V2, V3, V10)
teste('CA-V2: escolher "Feminino" lista só os femininos, atualiza o pager e o "Copiar da página", volta à página 1 e anuncia', async () => {
  montar(cenario());
  W.eval('page = 3'); W.render();
  igual(W.eval('page'), 3, 'precondição: 62 itens dão 3 páginas');
  escolherPublico('feminino');
  igual(W.eval('page'), 1, 'a escolha volta à página 1');
  igual(W.eval('filtrada().length'), 30);
  igual(W.eval('filtrada().every(i => i.genero === "feminino")'), true);
  igual(cartoes().length, PAGINA);
  const pager = txt(q('.pager'));
  afirma(pager.includes('Página 1 de 2') && pager.includes('30 itens'), 'pager: ' + pager);
  const msgs = qa('.card textarea').map(t => t.value);
  igual(msgs.length, PAGINA);
  afirma(msgs.every(m => m.includes('Produto feminino')) && !msgs.some(m => m.includes('masculino')), 'o "Copiar todas da página" copia só os femininos');
  igual(txt(q('#anuncioLista')), 'Mostrando 30 ofertas: Feminino');
  igual(q('#anuncioLista').getAttribute('role'), 'status');
  igual(q('#anuncioLista').getAttribute('aria-live'), 'polite');
  q('.pager .pg[data-p="2"]').click();
  igual(cartoes().length, 6, 'última página: 30 - 24');
  escolherPublico('unissex');
  igual(txt(q('#anuncioLista')), 'Mostrando 5 ofertas: Unissex');
  escolherPublico('todos');
  igual(txt(q('#anuncioLista')), 'Mostrando 62 ofertas: Todos');
});

teste('CA-V10: escolher não recria o controle: o mesmo input fica no DOM, marcado e com o foco', async () => {
  montar(cenario());
  const f = radios().find(i => i.value === 'feminino'), fieldset = q('#publicoBox fieldset');
  f.focus();
  mesmo(W.document.activeElement, f, 'precondição: o foco está no rádio');
  f.click();
  mesmo(q('#publicoBox fieldset'), fieldset, 'o fieldset é o mesmo');
  mesmo(radios().find(i => i.value === 'feminino'), f, 'o input é o mesmo');
  igual(f.isConnected, true);
  mesmo(W.document.activeElement, f, 'o foco continua no controle');
  igual(f.checked, true);
  // contagens mudam no lugar (filtro de loja), sem recriar
  escolher(q('#fLoja'), 'ml');
  mesmo(q('#publicoBox fieldset'), fieldset);
  igual(contagens(), [19, 10, 5, 0, 4]);
  // nenhum ARIA extra: grupo nativo de rádio (fieldset/legend)
  igual(fieldset.hasAttribute('role'), false);
  igual(radios().some(i => i.hasAttribute('tabindex') || i.hasAttribute('aria-label')), false);
});

teste('CA-V3: a escolha fica lembrada por aba (localStorage "genero:<aba>"); trocar de aba não vaza; voltar a Perfumes traz a escolha', async () => {
  montar(cenario());
  escolherPublico('masculino');
  igual(localStorage.getItem('genero:' + PERF), 'masculino');
  aba(CASA).click();
  igual(W.eval('filtrada().length'), 10, 'Casa não filtra por público');
  igual(localStorage.getItem('genero:' + CASA), null);
  aba(PERF).click();
  igual(marcado(), 'masculino', 'a escolha voltou');
  igual(W.eval('filtrada().length'), 20);
  igual(W.eval('page'), 1);
  // um valor guardado para uma aba sem gênero (chave plantada) não vale nada
  localStorage.setItem('genero:' + CASA, 'feminino');
  igual(W.eval('generoEscolhido')(CASA), '');
  aba(CASA).click();
  igual(W.eval('filtrada().length'), 10);
  aba(PERF).click();
  // valor que não existe mais cai em Todos
  localStorage.setItem('genero:' + PERF, 'xis'); W.render();
  igual(marcado(), 'todos'); igual(W.eval('filtrada().length'), 62);
  localStorage.setItem('genero:' + PERF, '<img src=x onerror=1>'); W.render();
  igual(marcado(), 'todos');
  // "Todos" apaga a chave
  escolherPublico('feminino'); escolherPublico('todos');
  igual(localStorage.getItem('genero:' + PERF), null);
});

teste('CA-V3/CA-V5: "Sem gênero" lembrado que zerou cai em "Todos" e a chave é apagada', async () => {
  montar(cenario());
  escolherPublico('sem');
  igual(W.eval('filtrada().length'), 7);
  escolher(q('#fLoja'), 'shopee');   // ninguém da Shopee: a opção some
  igual(valoresPublico().includes('sem'), false);
  igual(marcado(), 'todos');
  igual(localStorage.getItem('genero:' + PERF), null);
  escolher(q('#fLoja'), '');
  igual(marcado(), 'todos', 'não volta sozinho para "sem"');
  igual(W.eval('filtrada().length'), 62);
});

teste('CA-V3: a escolha sobrevive a recarregar a página (itens reais); as contagens são as dos itens', async () => {
  const perfumes = API.filter(i => i.cat === PERF);

});

function cartaoFalso(it) {
  const c = W.document.createElement('div'); c.className = 'card';
  W.document.body.appendChild(c);
  W.renderCard(c, it);
  return c;
}
const selos = c => [...c.querySelectorAll('.selo-genero')];
const limpar = c => c.remove();

// ================================================================ correção: PUT (CA-V24, V25, V27, V28)
const resposta = (it, genero, origem, auto) => ({ ...JSON.parse(JSON.stringify(it)), genero, genero_origem: origem, genero_auto: auto });
function adiado() { let ok, nao; const p = new Promise((a, b) => { ok = a; nao = b; }); return { p, ok, nao }; }

teste('CA-V24: escolher um valor trava o campo (aria-busy) até a resposta e, no sucesso, atualiza selo, contagens e toast sem recriar o cartão (foco, "copiado" e "Mais ações" ficam)', async () => {
  montar(cenario());
  const c = cartoes()[0], it = W.eval('filtrada()[0]'), sel = c.querySelector('select.gen');
  c.classList.add('done'); c.querySelector('details.more').open = true;
  const textarea = c.querySelector('textarea'); textarea.value = 'texto editado à mão';
  sel.focus();
  const d = adiado();
  RESP_PUT = () => d.p;
  escolher(sel, 'masculino');
  await esperar(() => PUTS.length === 1, 'o PUT sair');
  igual(PUTS[0].url, '/api/items/' + it.id + '/genero');
  igual(PUTS[0].corpoTexto, '{"genero":"masculino"}', 'só a chave genero');
  igual(PUTS[0].cabecalhos['Content-Type'], 'application/json');
  igual(sel.disabled, true, 'desabilitado enquanto espera');
  igual(sel.getAttribute('aria-busy'), 'true');
  igual(q('#toast').classList.contains('show') && toastTxt().startsWith('Público salvo'), false, 'ainda sem aviso de sucesso');
  igual(it.genero, 'feminino', 'o item só muda depois da resposta');
  await dormir(150);   // o Chrome tira o foco de um campo desabilitado no próximo quadro; a resposta vem depois disso, como na rede
  d.ok(json(resposta(it, 'masculino', 'manual', 'feminino')));
  await esperar(() => !sel.disabled, 'o campo reabilitar');
  igual(sel.hasAttribute('aria-busy'), false);
  igual(sel.value, 'masculino');
  igual(txt(sel.options[0]), 'Automático (Feminino)');
  mesmo(c.querySelector('select.gen'), sel, 'o select é o mesmo');
  mesmo(cartoes()[0], c, 'o cartão é o mesmo (não foi recriado)');
  igual(c.isConnected, true);
  igual(c.classList.contains('done'), true, '"Mensagem copiada" continua');
  igual(c.querySelector('details.more').open, true, '"Mais ações" continua aberto');
  igual(c.querySelector('textarea').value, 'texto editado à mão', 'o texto editado continua');
  mesmo(W.document.activeElement, sel, 'o foco volta ao campo');
  igual(selos(c).map(txt), ['Masculino · corrigido']);
  igual(W.eval('filtrada()[0]').genero, 'masculino');
  igual(W.eval('filtrada()[0]').genero_origem, 'manual');
  igual(toastTxt(), 'Público salvo: Masculino.');
  igual(q('#toast').classList.contains('show'), true);
  igual(contagens(), [62, 29, 21, 5, 7], 'as contagens do controle atualizaram sem recarregar');
  igual(txt(c.querySelector('.gen-msg')), '', 'sem mensagem em Todos');
  igual(c.querySelector('.gen-msg').classList.contains('err'), false);
});

teste('CA-V28: em falha (sem servidor, 404, 400, resposta estranha) o campo volta ao valor anterior, reabilita e a linha de status mostra a mensagem em pt-BR', async () => {
  montar(cenario());
  const casos = [
    ['sem servidor', () => Promise.reject(new W.TypeError('Failed to fetch')), 'Não consegui falar com o servidor. Verifique se ele está aberto e tente de novo.'],
    ['404', () => Promise.resolve(json({ error: 'item não encontrado' }, 404)), 'Este item não existe mais. Recarregue a página.'],
    ['400', () => Promise.resolve(json({ error: 'esta categoria não separa por público' }, 400)), 'Não consegui salvar o público. Tente de novo.'],
    ['500 sem corpo', () => Promise.resolve(new W.Response('', { status: 500 })), 'Não consegui salvar o público. Tente de novo.'],
    ['200 sem o gênero', () => Promise.resolve(json({})), 'Não consegui salvar o público. Tente de novo.'],
    ['200 com gênero fora da lista', () => Promise.resolve(json({ genero: '<b>x</b>' })), 'Não consegui salvar o público. Tente de novo.'],
  ];
  const c = cartoes()[0], it = W.eval('filtrada()[0]'), sel = c.querySelector('select.gen'), st = c.querySelector('.gen-msg');
  c.querySelector('details.more').open = true;   // foco só existe em campo visível
  const antes = JSON.stringify(W.eval('filtrada()[0]'));
  let n = 0;
  for (const [nome, resp, msg] of casos) {
    RESP_PUT = resp;
    sel.focus();
    toast_limpar();
    escolher(sel, 'unissex');
    n++;
    await esperar(() => PUTS.length === n && !sel.disabled, nome + ': esperar a resposta');
    igual(sel.value, '', nome + ': o campo volta ao valor anterior (Automático)');
    igual(sel.hasAttribute('aria-busy'), false, nome);
    igual(txt(st), msg, nome);
    igual(st.classList.contains('err'), true, nome + ': mensagem de erro');
    igual(st.getAttribute('role'), 'alert', nome + ': erro é lido na hora');
    igual(sel.getAttribute('aria-describedby'), st.id);
    igual(txt(c.querySelector('.status')), '', nome + ': o .status do cartão não leva a mensagem do público');
    igual(txt(q('#toastErro')), msg, nome + ': o aviso de erro também sai');
    igual(q('#toastErro').classList.contains('show'), true);
    igual(selos(c).map(txt), ['Feminino'], nome + ': o selo não mudou');
    igual(JSON.stringify(W.eval('filtrada()[0]')), antes, nome + ': o item não mudou');
    igual(contagens(), [62, 30, 20, 5, 7], nome);
    mesmo(W.document.activeElement, sel, nome + ': o foco continua no campo');
    afirma(!toastTxt().startsWith('Público salvo'), nome + ': não há aviso de sucesso');
  }
  // um sucesso depois de um erro limpa a mensagem de erro
  RESP_PUT = () => Promise.resolve(json(resposta(it, 'unissex', 'manual', 'feminino')));
  escolher(sel, 'unissex');
  n++;
  await esperar(() => PUTS.length === n && !sel.disabled, 'sucesso depois do erro');
  igual(st.classList.contains('err'), false);
  igual(st.getAttribute('role'), 'status', 'depois do sucesso o papel volta a status');
  igual(txt(st), '');
  // mensagem de erro do corpo nunca vira marcação
  W.__xss = undefined;
  RESP_PUT = () => Promise.resolve(json({ error: '<img src=x onerror="window.__xss=1">' }, 400));
  escolher(sel, 'masculino');
  n++;
  await esperar(() => PUTS.length === n && !sel.disabled, 'erro com HTML');
  igual(st.querySelectorAll('img').length, 0);
  igual(W.__xss, undefined);
});
function toast_limpar() { for (const id of ['#toast', '#toastErro']) { q(id).textContent = ''; q(id).classList.remove('show'); } }

// ================================================================ M3: carregando e erro de carga (CA-V17), com a API simulada
// O iframe carrega o index.html por srcdoc com um fetch trocado ANTES do script do app rodar (o app busca os itens logo ao abrir);
// o fetch simulado só atende GET, nada de escrita sai.
let RESP_APP = null;
window.FETCH_APP = (url, opcoes) => {
  const metodo = String((opcoes && opcoes.method) || 'GET').toUpperCase();
  if (metodo !== 'GET' && /\/api\//.test(String(url))) { VIOL.push(metodo + ' ' + url); return Promise.reject(new TypeError('bloqueado pelo teste')); }
  return RESP_APP ? RESP_APP(String(url), opcoes) : Promise.reject(new TypeError('sem resposta definida'));
};
window.ERRO_APP = m => erros.push(m + ' durante "' + testeAtual + '"');
const jsonP = (corpo, status = 200) => new Response(JSON.stringify(corpo), { status, headers: { 'Content-Type': 'application/json' } });
const respostaOk = url => jsonP(/\/api\/items$/.test(url) ? cenario() : null);
async function abrirAppComApi(resposta) {
  RESP_APP = resposta;
  const html = await (await fetch('/index.html')).text();
  afirma(html.includes('<head>'), 'o index.html não tem <head>');
  const injetado = '<script>window.fetch = (u, o) => window.parent.FETCH_APP(u, o);'
    + "window.addEventListener('unhandledrejection', e => window.parent.ERRO_APP('rejeição não tratada (app, API simulada): ' + (e.reason && e.reason.message || e.reason)));"
    + "window.addEventListener('error', e => window.parent.ERRO_APP('erro não capturado (app, API simulada): ' + e.message));<\/script>";
  const f = document.getElementById('app');
  await new Promise((res, rej) => { f.onload = res; f.onerror = rej; f.srcdoc = html.replace('<head>', '<head>' + injetado); });
  W = f.contentWindow;
  W.open = (...a) => { VIOL.push('window.open ' + a[0]); return null; };
  W.prompt = () => { VIOL.push('prompt'); return null; };
}

    if (modo === 'rede') return Promise.reject(new TypeError('Failed to fetch'));
    if (modo === '500') return Promise.resolve(jsonP({ error: 'quebrou' }, 500));
    if (modo === 'objeto') return Promise.resolve(jsonP(/\/api\/items$/.test(url) ? { error: 'x' } : null));
    if (modo === 'config') return Promise.resolve(/config\/templates$/.test(url) ? jsonP({ error: 'x' }, 500) : respostaOk(url));
    if (modo === 'texto') return Promise.resolve(new Response('<html>erro</html>', { status: 200, headers: { 'Content-Type': 'text/html' } }));
    return portao.then(() => respostaOk(url));
  };
  await abrirAppComApi(resp);
  const confereErro = (onde) => {
    const b = blocoLista();
    afirma(b, onde + ': sem bloco de erro');
    igual(txt(b.querySelector('p')), 'Não consegui carregar as ofertas. Verifique se o servidor está aberto e tente de novo.', onde);
    igual(b.getAttribute('role'), 'alert', onde);
    igual(qa('#estadoLista button').map(txt), ['Tentar de novo'], onde);
    igual(q('main').hasAttribute('aria-busy'), false, onde + ': main parou de carregar');
    for (const s of ['#tabs', '.filters', '.barra-lista', '#grid']) afirma(!visivel(q(s)), onde + ': ' + s + ' aparece com a carga falha');
    igual(W.eval('items.length'), 0, onde);
  };
  await esperar(() => q('#estadoLista [role="alert"]'), 'o erro de rede');
  confereErro('rede');
  igual(pedidos.slice(0, 3).sort(), ['/api/config/currentTpl', '/api/config/templates', '/api/items']);
  igual(W.eval('disparoIniciado'), true, 'as rotas do disparo ligam mesmo com a lista fora do ar');
  W.render();   // um render solto (vindo de outra tela) não desenha lista sem dados
  confereErro('depois de um render()');
  for (const m of ['500', 'objeto', 'config', 'texto', 'rede']) {
    modo = m;
    const botao = q('#estadoLista button');
    botao.focus(); botao.click();
    igual(txt(blocoLista()), 'Carregando as ofertas…', m + ': o clique mostra o carregando na hora');
    igual(blocoLista().getAttribute('role'), 'status');
    igual(q('main').getAttribute('aria-busy'), 'true');
    afirma(estadoLista().contains(W.document.activeElement), m + ': o foco ficou no bloco, não foi para o body');
    await esperar(() => q('#estadoLista [role="alert"]'), 'o erro de novo (' + m + ')');
    confereErro(m);
    mesmo(W.document.activeElement, q('#estadoLista button'), m + ': o foco volta ao "Tentar de novo"');
  }
  // agora a API volta: o carregando aparece, e ao chegar a lista o foco vai à aba ativa
  let liberar; portao = new Promise(r => { liberar = r; });
  modo = 'ok';
  const botao = q('#estadoLista button');
  botao.focus(); botao.click();
  igual(txt(blocoLista()), 'Carregando as ofertas…');
  liberar();
  await esperar(() => cartoes().length > 0, 'a lista depois do "Tentar de novo"');
  igual(blocoLista(), null);
  igual(q('main').hasAttribute('aria-busy'), false);
  igual(W.eval('items.length'), cenario().length);
  for (const s of ['#tabs', '.filters', '#grid']) afirma(visivel(q(s)), s + ' tem que aparecer');
  mesmo(W.document.activeElement, q('#tabs .tab.active'), 'o foco vai à aba ativa, não ao body');
  igual(W.eval('disparoIniciado'), true);
});

// ================================================================ execução
(async () => {
  let falhas = 0, total = 0;
  try {
    API_ANTES = await (await fetch('/api/items')).text();
    API = JSON.parse(API_ANTES);
    afirma(Array.isArray(API) && API.length > 0, '/api/items vazio');
    afirma(API.every(i => ['feminino', 'masculino', 'unissex', 'sem'].includes(i.genero)), 'o servidor não devolve "genero" em todo item (servidor antigo?)');
  } catch (e) {
    log(PREF_F + 'preparação — ' + (e && e.message || e));
    linhas.shift();
    log(PREF_R + 'FALH' + 'OU (preparação)');
    return;
  }
  const guardado = localStorage.getItem('activeCat');
  for (const t of testes) {
    total++; testeAtual = t.nome;
    const antesErros = erros.length;
    try {
      if (!W) await abrirApp();
      await t.fn();
      await dormir(30);
      if (erros.length > antesErros) throw new Falha(erros.slice(antesErros).join(' | '));
      log('ok    ' + t.nome);
    } catch (e) {
      falhas++;
      log(PREF_F + t.nome + ' — ' + (e && e.message || e));
    }
  }
  for (const k of Object.keys(localStorage)) if (k.startsWith('genero:')) localStorage.removeItem(k);
  if (guardado === null) localStorage.removeItem('activeCat'); else localStorage.setItem('activeCat', guardado);
  linhas.shift();
  log('');
  log(total + ' testes, ' + (total - falhas) + ' passaram, ' + falhas + ' falharam');
  log(falhas === 0 && total > 0 ? PREF_R + 'OK' : PREF_R + 'FALH' + 'OU (' + falhas + ' de ' + total + ')');
})();
