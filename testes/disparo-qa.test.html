<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Testes de QA: tela Disparo automático</title>
<!--
  Testes de QA da tela "Disparo automático" (plano docs/produto/planos/disparo-automatico.md, etapa 5: CA1, CA2, CA9, CA10,
  CA11). Complementa testes/disparo.test.html com bordas: limites de formulário, dados pessoais em qualquer lugar da página,
  HTML injetado em todos os pontos que mostram texto da API, falhas de rede nas ações da fila, histórico, "Disparar agora"
  cancelado, beforeunload e o selo "· atenção". Sem dependência. Rodar com um servidor no ar:

    node testes/rodar.mjs disparo-qa            (porta 8765; PORTA=<n> troca a porta)

  (O nome tem hífen porque o servidor só serve /testes/[a-z0-9-]+.test.html.)

  Mesmas regras de segurança do disparo.test.html: o iframe carrega o /index.html real, toda rota /api/disparo/* e o
  GET/PUT de /api/config/templates são atendidos por um servidor FALSO em memória (função falso), só GET real nas demais
  rotas, escrita fora do servidor falso vira VIOL. A integração com o servidor de verdade fica em
  testes/disparo-integracao.test.html (só contra um servidor com banco temporário).

  Obs.: as palavras de resultado ficam montadas por concatenação no script e fora deste comentário.
-->
<style>
  body{font:13px/1.45 ui-monospace,monospace;padding:12px;color:#111}
  pre{white-space:pre-wrap;margin:0}
  iframe{position:absolute;left:-9999px;top:0;width:1100px;height:900px;border:0}
</style>
</head>
<body>
<h1 style="font:600 16px sans-serif">Testes de QA: tela Disparo automático</h1>
<pre id="saida"></pre>
<iframe id="app" title="app sob teste"></iframe>

<script>
'use strict';
// ---------------------------------------------------------------- mini-harness
const PREF_R = 'RESULT' + 'ADO: ';
const PREF_F = 'FALH' + 'OU: ';
const SAIDA = document.getElementById('saida');
const linhas = [PREF_R + 'PENDENTE'];
const log = l => { linhas.push(l); SAIDA.textContent = linhas.join('\n'); };
SAIDA.textContent = linhas[0];

class Falha extends Error {}
const afirma = (cond, msg) => { if (!cond) throw new Falha(msg || 'asserção falhou'); };
const igual = (obtido, esperado, msg) => {
  const a = JSON.stringify(obtido), b = JSON.stringify(esperado);
  if (a !== b) throw new Falha((msg ? msg + ': ' : '') + 'esperado ' + b + ', obtido ' + a);
};
const testes = [];
const teste = (nome, fn) => testes.push({ nome, fn });
const dormir = ms => new Promise(r => setTimeout(r, ms));
async function esperar(cond, desc = 'condição', tentativas = 800, passo = 10) {
  for (let i = 0; i < tentativas; i++) {
    let ok = false;
    try { ok = cond(); } catch (e) { ok = false; }
    if (ok) return;
    await dormir(passo);
  }
  throw new Falha('tempo esgotado esperando: ' + desc);
}

let testeAtual = '(início)';
const erros = [];
function ouvirErros(janela, origem) {
  janela.addEventListener('unhandledrejection', e => {
    erros.push('rejeição não tratada (' + origem + ') durante "' + testeAtual + '": ' + (e.reason && e.reason.message || e.reason));
  });
  janela.addEventListener('error', e => { erros.push('erro não capturado (' + origem + ') durante "' + testeAtual + '": ' + e.message); });
}
ouvirErros(window, 'página de teste');

// ---------------------------------------------------------------- dados de teste
const FONE = '00000000001', FONE_FMT = '(00) 00000-0001', FONE_MASC = '(00) ·····-0001';   // número fictício
const GID = '120363012345678901@g.us', GID_MASC = '120···@g.us';
const URL_ML = 'https://http2.mlstatic.com/D_Q_NP_2X_624792-MLU75859080805_042024-E.webp';
const XSS = '<img src=x onerror="window.__xss=1">';

// ---------------------------------------------------------------- ambiente
let W, FETCH_ORIG, API_ANTES = null, PNG_BLOB = null;
let E;                       // estado do servidor falso
const LOG = [];              // pedidos do iframe: {metodo, url, corpo}
const VIOL = [];             // escrita fora do servidor falso (deve ficar vazia)
const SPY = { set: [], clear: [] };   // setInterval/clearInterval do iframe
const q = s => W.document.querySelector(s);
const qa = s => [...W.document.querySelectorAll(s)];
const txt = el => (el ? el.textContent : '').replace(/\s+/g, ' ').trim();
// o aviso de erro (role=alert) é outro elemento (#toastErro); toastTxt lê o que está aparecendo
const toastTxt = () => {
  const e = W.document.getElementById('toastErro'), t = W.document.getElementById('toast');
  return e.classList.contains('show') && e.textContent ? e.textContent : t.textContent;
};
const tela = () => W.document.getElementById('telaDisparo');
const reqs = (metodo, re) => LOG.filter(r => r.metodo === metodo && re.test(r.url));

function novoEstado() {
  return { templates: null, numeros: [], regras: [], envios: [], seqN: 0, seqR: 0, seqE: 0, falhas: [], previa: null, agora: null };
}
const json = (corpo, status = 200) => new W.Response(JSON.stringify(corpo), { status, headers: { 'content-type': 'application/json' } });
const iso = (d = new Date()) => {
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
};
const minAtras = n => iso(new Date(Date.now() - n * 60000));
const dataLocal = d => iso(d).slice(0, 10);

function numeroFalso(s = {}) {
  return { id: ++E.seqN, nome: 'Loja 1', telefone: FONE, grupo_nome: 'Achadinhos', grupo_id: GID, limite_diario: 40, ativo: 1, criado_em: iso(), atualizado_em: iso(), ...s };
}
function regraFalsa(s = {}) {
  return { id: ++E.seqR, nome: 'Eletrônicos de manhã', numero_id: E.numeros[0] ? E.numeros[0].id : 1, ativa: 1, cats: [CAT1()], lojas: ['amazon', 'ml'],
    palavras: [], desconto_min: 0, ordem: 'desconto', template: 'Template 1', com_foto: 1, dias: [0, 1, 2, 3, 4], horarios: ['09:00', '12:00'],
    por_disparo: 1, max_por_dia: 20, repetir_apos_dias: 7, intervalo_seg: 60, aviso: '', criado_em: iso(), atualizado_em: iso(), ...s };
}
function envioFalso(s = {}) {
  const n = ++E.seqE;
  return { id: n, regra_id: E.regras[0] ? E.regras[0].id : 1, numero_id: E.numeros[0] ? E.numeros[0].id : 1, item_pk: ITEM1().id, slot: '2026-11-03T09:00#' + n,
    status: 'pendente', mensagem: '*Produto ' + n + '*\n🔥 Por *R$ 10,00*\n🛒 https://meli.la/QA' + n, imagem: URL_ML, titulo: 'Produto ' + n,
    motivo: '', transporte: 'manual', criado_em: minAtras(n), enviado_em: null, ...s };
}
const CAT1 = () => W.eval('cats()[0]');
const ITEM1 = () => W.eval('items[0]');

// Servidor falso: devolve Response ou null (= não é comigo; GET segue para o servidor real, o resto é VIOL)
function falso(url, opcoes) {
  const u = new URL(url, 'http://x');
  const metodo = String((opcoes && opcoes.method) || 'GET').toUpperCase();
  const caminho = u.pathname.replace(/^\/api\//, '');
  if (!/^\/api\//.test(u.pathname)) return null;
  const corpo = opcoes && opcoes.body ? JSON.parse(opcoes.body) : undefined;
  const pedido = { metodo, url: u.pathname + u.search, corpo };
  if (caminho === 'config/templates' || caminho.startsWith('disparo/')) {
    LOG.push(pedido);
    for (const f of E.falhas) if (f.re.test(metodo + ' ' + caminho)) return f.erro === '__rede' ? 'rede' : json({ error: f.erro }, f.status);
  }
  if (caminho === 'config/templates') {
    if (metodo === 'GET') return json(E.templates);
    if (metodo === 'PUT') { E.templates = corpo; return json({ ok: true }); }
  }
  if (!caminho.startsWith('disparo/')) return null;
  const r = caminho.slice(8);
  let m;
  const achar = (lista, id) => lista.find(x => x.id === +id);
  if (r === 'numeros') {
    if (metodo === 'GET') return json(E.numeros);
    if (metodo === 'POST') { const n = numeroFalso(corpo); E.numeros.push(n); return json(n, 201); }
  }
  if ((m = /^numeros\/(\d+)$/.exec(r))) {
    const n = achar(E.numeros, m[1]);
    if (!n) return json({ error: 'número não encontrado' }, 404);
    if (metodo === 'PUT') { Object.assign(n, corpo); return json(n); }
    if (metodo === 'DELETE') {
      if (E.regras.some(x => x.numero_id === n.id)) return json({ error: 'este número é usado por uma regra: mude ou exclua a regra primeiro' }, 409);
      E.numeros.splice(E.numeros.indexOf(n), 1); return json({ ok: true });
    }
  }
  if (r === 'regras') {
    if (metodo === 'GET') return json(E.regras.map(x => ({ ...x, proximo: x.ativa ? iso(new Date(Date.now() + 86400000)).slice(0, 11) + '09:00:00' : null })));
    if (metodo === 'POST') { const x = regraFalsa(corpo); E.regras.push(x); return json(x, 201); }
  }
  if ((m = /^regras\/(\d+)$/.exec(r))) {
    const x = achar(E.regras, m[1]);
    if (!x) return json({ error: 'regra não encontrada' }, 404);
    if (metodo === 'PUT') { Object.assign(x, corpo); return json(x); }
    if (metodo === 'DELETE') { E.regras.splice(E.regras.indexOf(x), 1); return json({ ok: true }); }
  }
  if ((m = /^regras\/(\d+)\/agora$/.exec(r)) && metodo === 'POST') {
    const novos = (E.agora || [envioFalso({ regra_id: +m[1] })]).map(e => ({ ...e }));
    E.envios.push(...novos);
    return json({ criados: novos.length, envios: novos });
  }
  if (r === 'previa' && metodo === 'POST') {
    return json(E.previa || [
      { item_pk: 1, titulo: 'Item A', mensagem: '*Item A*\n🔥 Por *R$ 10,00*\n🛒 https://meli.la/AAA', imagem: URL_ML },
      { item_pk: 2, titulo: 'Item B', mensagem: '*Item B*\n🛒 https://meli.la/BBB', imagem: '' },
      { item_pk: 3, titulo: 'Item C', mensagem: '*Item C*\n🛒 https://meli.la/CCC', imagem: URL_ML }]);
  }
  if (r === 'fila' && metodo === 'GET') return json(E.envios.filter(e => e.status === 'pendente' || e.status === 'incerto').sort((a, b) => a.criado_em < b.criado_em ? -1 : a.criado_em > b.criado_em ? 1 : a.id - b.id));
  if ((m = /^envios\/(\d+)$/.exec(r)) && metodo === 'PATCH') {
    const e = achar(E.envios, m[1]);
    if (!e) return json({ error: 'envio não encontrado' }, 404);
    if (!['pendente', 'incerto'].includes(e.status)) return json({ error: 'este envio não pode mais ser marcado assim' }, 409);
    e.status = corpo.status; if (corpo.status === 'enviado') e.enviado_em = iso();
    return json(e);
  }
  if (r === 'envios' && metodo === 'GET') {
    const desde = u.searchParams.get('desde'), st = u.searchParams.get('status');
    return json(E.envios.filter(e => (!desde || e.criado_em >= desde) && (!st || e.status === st)).sort((a, b) => b.criado_em < a.criado_em ? -1 : 1).slice(0, 500));
  }
  return json({ error: 'rota não encontrada' }, 404);
}

async function pngBlob() {
  const cv = W.document.createElement('canvas'); cv.width = 8; cv.height = 8;
  const c = cv.getContext('2d'); c.fillStyle = '#c00'; c.fillRect(0, 0, 8, 8);
  return new Promise(r => cv.toBlob(r, 'image/png'));
}

function instalarStubs(janela) {
  const orig = janela.fetch.bind(janela);
  FETCH_ORIG = FETCH_ORIG || orig;
  janela.fetch = function (entrada, opcoes) {
    const url = typeof entrada === 'string' ? entrada : ((entrada && entrada.url) || String(entrada));
    const metodo = String((opcoes && opcoes.method) || 'GET').toUpperCase();
    if (/^https:\/\/http2\.mlstatic\.com\//.test(url)) return Promise.resolve(new W.Response(PNG_BLOB, { status: 200, headers: { 'content-type': 'image/png' } }));
    const f = falso(url, opcoes);
    if (f === 'rede') return Promise.reject(new janela.TypeError('Failed to fetch'));
    if (f) return Promise.resolve(f);
    if (metodo !== 'GET' && /\/api\//.test(url)) {
      VIOL.push(metodo + ' ' + url);
      return Promise.reject(new janela.TypeError('bloqueado pelo teste: escrita na API real'));
    }
    return orig(entrada, opcoes);
  };
  janela.open = (...a) => { VIOL.push('window.open ' + a[0]); return null; };
  // espia os timers da fila (a atualização é de 30 s)
  const si = janela.setInterval.bind(janela), ci = janela.clearInterval.bind(janela);
  janela.setInterval = (fn, ms, ...r) => { const id = si(fn, ms, ...r); SPY.set.push({ id, ms }); return id; };
  janela.clearInterval = id => { SPY.clear.push(id); return ci(id); };
}

async function carregarApp() {
  const f = document.getElementById('app');
  await new Promise((res, rej) => { f.onload = res; f.onerror = rej; f.src = '/index.html'; });
  W = f.contentWindow;
  ouvirErros(W, 'app');
  E = novoEstado();
  PNG_BLOB = await pngBlob();
  instalarStubs(W);
  await esperar(() => W.eval('items.length') > 0 && W.document.querySelectorAll('#grid .card').length > 0,
    'o index.html carregar os itens do servidor (servidor no ar?)');
}

let clip;
function stubClipboard() {
  clip = { write: [], text: [] };
  const cb = {
    write: async arr => {
      clip.write.push(arr.map(it => Array.from(it.types)));
      await Promise.all(arr.flatMap(it => Array.from(it.types).map(t => it.getType(t))));
    },
    writeText: async t => { clip.text.push(t); }
  };
  Object.defineProperty(W.navigator, 'clipboard', { value: cb, configurable: true });
}

async function restaurar() {
  try { delete W.navigator.clipboard; } catch (e) { /* ignora */ }
  const d = W.document.getElementById('dlg'); if (d && d.open) d.close('0');
  E = novoEstado();
  LOG.length = 0; SPY.set.length = 0; SPY.clear.length = 0;
  for (const id of ['toast', 'toastErro']) { const t = W.document.getElementById(id); if (t) { t.textContent = ''; t.classList.remove('show'); } }
  document.getElementById('app').style.width = '';
  W.eval('templatesGarantidos = false; rascunhoRegra = null;');
  delete W.__xss;
  W.eval('marcarSujo(false); confirmandoRota = false');   // antes de mudar o hash: formulário sujo pergunta (D3)
  if (W.location.hash) { W.location.hash = ''; await esperar(() => tela().hidden, 'voltar às ofertas'); }
}

// ---------------------------------------------------------------- ajudantes de tela
const carregou = () => { const c = q('#dspCorpo'); return !!c && !/Carregando…/.test(c.textContent); };
// Navega e espera a tela NOVA (o <h2> é recriado a cada rota); no mesmo hash não há hashchange, então recarrega a rota
async function abrir(hash) {
  const antes = q('#dspTitulo');
  if (W.location.hash === hash) W.eval('rotear()'); else W.location.hash = hash;
  await esperar(() => !tela().hidden && q('#dspTitulo') && q('#dspTitulo') !== antes && carregou(), 'a tela ' + hash + ' carregar');
}
function digitar(sel, valor) {
  const el = typeof sel === 'string' ? q(sel) : sel;
  afirma(el, 'campo não existe: ' + sel);
  el.value = valor; el.dispatchEvent(new W.Event('input', { bubbles: true }));
}
const chip = (grupo, valor) => qa(grupo + ' input').find(i => i.value === String(valor));
function marcarChip(grupo, valor, v = true) {
  const i = chip(grupo, valor); afirma(i, 'chip ' + valor + ' não existe em ' + grupo);
  if (i.checked !== v) i.click();
}
const clicar = sel => { const b = typeof sel === 'string' ? q(sel) : sel; afirma(b, 'botão não existe: ' + sel); b.click(); };
const acao = (nome, id) => q('[data-acao="' + nome + '"]' + (id !== undefined ? '[data-id="' + id + '"]' : ''));
const dialogoAberto = () => q('#dlg').open;
const botaoDialogo = r => q('#dlg button[data-r="' + r + '"]');
const textoTela = () => txt(tela());
const semDadoPessoal = (onde, texto) => {
  for (const s of [FONE, FONE_FMT, GID, '00000-0001', '363012345678901']) afirma(!String(texto).includes(s), 'dado pessoal "' + s + '" apareceu em ' + onde);
};
// preenche o formulário de regra com o mínimo válido
function preencherRegra(sobre = {}) {
  digitar('#f-nome', sobre.nome || 'Regra de teste');
  if (sobre.numero !== false) { const s = q('#f-numero'); if (!s.value) { s.value = String(E.numeros[0].id); s.dispatchEvent(new W.Event('change', { bubbles: true })); } }
  if (sobre.cats !== false) marcarChip('#f-cats', sobre.cat || CAT1());
}

// ================================================================ ajudantes de QA
const XSS_ATTR = '" autofocus onfocus="window.__xss=2" x="';
const PAYLOADS = [XSS, XSS_ATTR];
const todoTexto = () => W.document.documentElement.outerHTML;
// Varre a página inteira (texto, atributos, título, URL, armazenamento) atrás de telefone e id de grupo inteiros.
// `permitirValue` deixa passar o atributo value dos campos do formulário de edição (o único lugar permitido).
function semDadoPessoalNaPagina(onde, { permitirValue = false } = {}) {
  let html = todoTexto();
  if (permitirValue) html = html.replace(/ value="[^"]*"/g, ' value="…"');
  const lixo = [W.document.title, W.location.href, W.location.hash, JSON.stringify(W.localStorage), JSON.stringify(W.sessionStorage), W.name, toastTxt()].join('\n');
  for (const s of [FONE, FONE_FMT, GID, '00000-0001', '363012345678901', '0000000']) {
    afirma(!html.includes(s), 'dado pessoal "' + s + '" no HTML de ' + onde);
    afirma(!lixo.includes(s), 'dado pessoal "' + s + '" em título/URL/armazenamento/toast de ' + onde);
  }
}
const injecao = () => ({ xss: W.__xss, imgs: qa('img[src="x"]').length, onerror: qa('[onerror],[onfocus],[autofocus]').length });
function semInjecao(onde) {
  const i = injecao();
  igual(i, { xss: undefined, imgs: 0, onerror: 0 }, 'HTML injetado em ' + onde);
}
const nSemantico = (re, metodo) => LOG.filter(r => (!metodo || r.metodo === metodo) && re.test(r.url)).length;
async function abrirDialogoEsperando(fn) { fn(); await esperar(dialogoAberto, 'o diálogo abrir'); }

// ================================================================ 1. formulário da regra: limites e bordas
teste('regra sem categorias: o erro aparece sob o campo, no resumo e nada é enviado', async () => {
  E.numeros.push(numeroFalso());
  await abrir('#disparo/nova');
  digitar('#f-nome', 'Sem categoria');
  clicar('#btnSalvar');
  igual(txt(q('#e-cats')), 'Escolha ao menos uma categoria.');
  afirma(qa('#f-cats input').every(i => i.getAttribute('aria-invalid') === 'true'), 'os chips ganham aria-invalid');
  afirma(txt(q('#dspErros')).includes('Escolha ao menos uma categoria.'), 'resumo no topo');
  igual(nSemantico(/regras$/, 'POST'), 0);
  igual(txt(q('#f-contador')), 'Escolha ao menos uma categoria para ver quantos itens combinam.');
});

teste('horários inválidos: "25:00" (o campo time o descarta) e duplicados são recusados, e "24:00" também', async () => {
  E.numeros.push(numeroFalso());
  await abrir('#disparo/nova'); preencherRegra();
  const h = q('input[name="horario"]');
  h.value = '25:00'; h.dispatchEvent(new W.Event('input', { bubbles: true }));
  igual(h.value, '', 'o campo time não guarda 25:00');
  clicar('#btnSalvar');
  igual(txt(q('#e-horarios')), 'Preencha todos os horários (hora e minuto).');
  h.value = '24:00'; h.dispatchEvent(new W.Event('input', { bubbles: true }));
  clicar('#btnSalvar');
  afirma(txt(q('#e-horarios')) !== '', '24:00 não vale: ' + h.value);
  h.value = '09:00'; h.dispatchEvent(new W.Event('input', { bubbles: true }));
  clicar(acao('add-horario'));
  const segundo = qa('input[name="horario"]')[1];
  segundo.value = '09:00'; segundo.dispatchEvent(new W.Event('input', { bubbles: true }));
  clicar('#btnSalvar');
  igual(txt(q('#e-horarios')), 'Há horários repetidos. Cada horário só pode aparecer uma vez.');
  igual(nSemantico(/regras$/, 'POST'), 0);
  segundo.value = '09:01'; segundo.dispatchEvent(new W.Event('input', { bubbles: true }));
  clicar('#btnSalvar');
  await esperar(() => nSemantico(/regras$/, 'POST') === 1, 'POST com horários distintos');
  igual(reqs('POST', /regras$/)[0].corpo.horarios, ['09:00', '09:01']);
});

teste('repetir_apos_dias: 0 e 366 são recusados; 1 e 365 passam; "Nunca repetir" manda null e guarda o valor ao desmarcar', async () => {
  E.numeros.push(numeroFalso());
  await abrir('#disparo/nova'); preencherRegra();
  for (const ruim of ['0', '366', '-1', '2,5', '', '1e2x']) {
    digitar('#f-rep', ruim); clicar('#btnSalvar');
    igual(txt(q('#e-rep')), 'Informe de 1 a 365 dias, ou marque "Nunca repetir".', 'valor ' + JSON.stringify(ruim));
    igual(nSemantico(/regras$/, 'POST'), 0, 'valor ' + JSON.stringify(ruim));
  }
  for (const bom of [1, 365]) {
    digitar('#f-rep', String(bom)); clicar('#btnSalvar');
    await esperar(() => nSemantico(/regras$/, 'POST') === (bom === 1 ? 1 : 2), 'POST com ' + bom);
    igual(reqs('POST', /regras$/).pop().corpo.repetir_apos_dias, bom);
    await esperar(() => W.location.hash === '#disparo' && acao('nova-regra'), 'voltar à lista depois de salvar');
    await abrir('#disparo/nova'); preencherRegra();
  }
});

teste('max_por_dia menor que por_disparo: o formulário aceita e envia os dois (o servidor é quem limita), com o resumo coerente', async () => {
  E.numeros.push(numeroFalso());
  await abrir('#disparo/nova'); preencherRegra();
  digitar('#f-por', '5'); digitar('#f-max', '2');

  const lido = () => { const t = txt(q('#f-contador')); const m = /Cerca de ([\d.]+)/.exec(t); return m ? +m[1].replace(/\./g, '') : (/Nenhum item combina/.test(t) ? 0 : NaN); };

  marcarChip('#f-lojas', 'amazon');

});

teste('beforeunload: liga ao digitar, o evento pede confirmação, e desliga ao salvar, descartar ou sair', async () => {
  E.numeros.push(numeroFalso());
  await abrir('#disparo/nova');
  igual(W.onbeforeunload, null, 'formulário limpo não segura a saída');
  digitar('#f-nome', 'sujo');
  const ev = new W.Event('beforeunload', { cancelable: true });
  W.dispatchEvent(ev);
  igual(ev.defaultPrevented, true, 'o evento é cancelado enquanto há alteração');
  preencherRegra({ nome: 'sujo' });
  clicar('#btnSalvar');
  await esperar(() => W.location.hash === '#disparo', 'salvou');
  igual(W.onbeforeunload, null, 'desligado depois de salvar');
  const ev2 = new W.Event('beforeunload', { cancelable: true }); W.dispatchEvent(ev2);
  igual(ev2.defaultPrevented, false);
  await abrir('#numeros/novo'); digitar('#f-nome', 'x');
  afirma(typeof W.onbeforeunload === 'function', 'formulário de número também segura a saída');
  clicar('[data-acao="cancelar"]'); await esperar(dialogoAberto, 'confirmação ao cancelar com alteração');
  clicar(botaoDialogo(1)); await esperar(() => !dialogoAberto() && W.location.hash === '#numeros', 'descartou');
  igual(W.onbeforeunload, null, 'desligado depois de descartar');
});

// ================================================================ execução
(async () => {
  let falhas = 0, total = 0;
  try {
    API_ANTES = await (await fetch('/api/items')).text();
    await carregarApp();
  } catch (e) {
    log(PREF_F + 'preparação — ' + (e && e.message || e));
    linhas.shift();
    log(PREF_R + 'FALH' + 'OU (preparação)');
    return;
  }
  for (const t of testes) {
    total++; testeAtual = t.nome;
    const antesErros = erros.length;
    try {
      await restaurar();
      await t.fn();
      await dormir(30);
      if (erros.length > antesErros) throw new Falha(erros.slice(antesErros).join(' | '));
      log('ok    ' + t.nome);
    } catch (e) {
      falhas++;
      log(PREF_F + t.nome + ' — ' + (e && e.message || e));
    } finally {
      try { await restaurar(); } catch (e) { /* ignora */ }
    }
  }
  linhas.shift();
  log('');
  log(total + ' testes, ' + (total - falhas) + ' passaram, ' + falhas + ' falharam');
  log(falhas === 0 && total > 0 ? PREF_R + 'OK' : PREF_R + 'FALH' + 'OU (' + falhas + ' de ' + total + ')');
})();
</script>
