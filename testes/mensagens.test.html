<!--

  Os casos ficam no bloco <script type="application/json" id="casos"> abaixo e valem para os dois lados:
  - esta página roda o buildMsg do /index.html real (via W.eval, trocando templates e current);
  - testes/test_disparo.py lê o mesmo bloco deste arquivo e roda o montar_mensagem do disparo.py.
  Os dois têm que dar o "esperado" de cada caso. Quem mudar o buildMsg ou o montar_mensagem
  ajusta o caso aqui. Os casos com "padrao" usam o texto do DEFAULT_TEMPLATES do index.html.

  Rodar com um servidor no ar (só GET; nenhum dado é gravado):
    node testes/rodar.mjs mensagens            (porta 8765)

  teste); nenhum botão do app é clicado. As palavras de resultado ficam montadas por concatenação.
-->

<script>
'use strict';
const PREF_R = 'RESULT' + 'ADO: ';
const PREF_F = 'FALH' + 'OU: ';
const SAIDA = document.getElementById('saida');
const linhas = [PREF_R + 'PENDENTE'];
const log = l => { linhas.push(l); SAIDA.textContent = linhas.join('\n'); };
SAIDA.textContent = linhas[0];

class Falha extends Error {}
const afirma = (cond, msg) => { if (!cond) throw new Falha(msg || 'asserção falhou'); };
const igual = (obtido, esperado, msg) => {
  const a = JSON.stringify(obtido), b = JSON.stringify(esperado);
  if (a !== b) throw new Falha((msg ? msg + ': ' : '') + 'esperado ' + b + ', obtido ' + a);
};
const dormir = ms => new Promise(r => setTimeout(r, ms));
async function esperar(cond, desc, tentativas = 1500, passo = 10) {
  for (let i = 0; i < tentativas; i++) {
    let ok = false;
    try { ok = cond(); } catch (e) { ok = false; }
    if (ok) return;
    await dormir(passo);
  }
  throw new Falha('tempo esgotado esperando: ' + desc);
}

const CASOS = JSON.parse(document.getElementById('casos').textContent);
const VIOL = [];   // tentativas de escrita na API (devem ficar vazias)
let W;

async function carregarApp() {
  const f = document.getElementById('app');
  await new Promise((res, rej) => { f.onload = res; f.onerror = rej; f.src = '/index.html?t=' + Date.now(); });
  W = f.contentWindow;
  const fetchOrig = W.fetch.bind(W);
  W.fetch = function (entrada, opcoes) {
    const url = typeof entrada === 'string' ? entrada : ((entrada && entrada.url) || String(entrada));
    const metodo = String((opcoes && opcoes.method) || (entrada && entrada.method) || 'GET').toUpperCase();
    if (metodo !== 'GET' && /\/api\//.test(url)) {
      VIOL.push(metodo + ' ' + url);
      return Promise.reject(new W.TypeError('bloqueado pelo teste: escrita na API'));
    }
    return fetchOrig(entrada, opcoes);
  };
  // o carregamento inicial troca `templates` pelo do servidor; só depois dele os casos podem trocá-lo
  await esperar(() => W.document.querySelectorAll('#tplSelect option').length > 0,
    'o index.html terminar de carregar (servidor no ar? PORTA=...)');
  afirma(typeof W.buildMsg === 'function', 'index.html não declara a function global buildMsg');
}

// Roda o buildMsg real com um template só, e devolve templates/current como estavam.
function buildMsgCom(template, item) {
  const antes = W.eval('[templates, current]');
  W.__tplCaso = { caso: template };
  try {
    W.eval('templates = window.__tplCaso; current = "caso"');
    return W.buildMsg(JSON.parse(JSON.stringify(item)));
  } finally {
    W.__tplCaso = antes;
    W.eval('templates = window.__tplCaso[0]; current = window.__tplCaso[1]');
    delete W.__tplCaso;
  }
}

const testes = [];
const teste = (nome, fn) => testes.push({ nome, fn });

teste('os casos cobrem os 4 templates padrão, com o texto atual do DEFAULT_TEMPLATES', () => {
  const padrao = W.eval('DEFAULT_TEMPLATES');
  const usados = CASOS.filter(c => c.padrao).map(c => c.padrao).sort();
  igual(usados, Object.keys(padrao).sort(), 'templates padrão nos casos');
  for (const c of CASOS.filter(c => c.padrao)) igual(c.template, padrao[c.padrao], 'texto de ' + c.padrao);
});

for (const c of CASOS) {
  teste('buildMsg: ' + c.nome, () => igual(buildMsgCom(c.template, c.item), c.esperado));
}

teste('o app voltou ao template dele e nada foi gravado', () => {
  afirma(W.eval('typeof templates[current]') === 'string', 'templates/current não foram restaurados');
  igual(VIOL, [], 'tentativas de escrita (o teste bloqueou)');
});

(async () => {
  let falhas = 0, total = 0;
  try {
    await carregarApp();
  } catch (e) {
    log(PREF_F + 'preparação — ' + (e && e.message || e));
    linhas.shift();
    log(PREF_R + 'FALH' + 'OU (preparação)');
    return;
  }
  for (const t of testes) {
    total++;
    try {
      await t.fn();
      log('ok    ' + t.nome);
    } catch (e) {
      falhas++;
      log(PREF_F + t.nome + ' — ' + (e && e.message || e));
    }
  }
  linhas.shift();
  log('');
  log(total + ' testes, ' + (total - falhas) + ' passaram, ' + falhas + ' falharam');
  log(falhas === 0 && total > 0 ? PREF_R + 'OK' : PREF_R + 'FALH' + 'OU (' + falhas + ' de ' + total + ')');
})();
</script>
