<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>QA: Público (gênero) e melhorias de UX no front</title>
<!--
  Testes do QA para a Parte A da spec docs/produto/specs/genero-e-ux.md e para os itens M1, M3, M5, M6 e M7
  (plano docs/produto/planos/genero-nas-categorias.md, etapas 6, 7 e 9). Complementa testes/genero.test.html (do dev):
  não repete o que ele prova, cobre bordas e regressões: contagens com loja e título juntos, memória por aba com valor plantado,
  correção com corrida (render() durante o PUT), estados da lista, foco, 320 a 1280 px sem rolagem horizontal, contraste dos
  tokens (claro e escuro), cabeçalho (M1), abas e caixa de mensagem (M6), cabeçalho do disparo (M7) e textos hostis.

  Roda contra qualquer servidor (só GET sai para a API). Escritas (PUT do público, PATCH de "Mover para", DELETE de item
  e PUT de config) passam por uma guarda que as intercepta e responde com um Response falso; qualquer outra escrita
  vira violação e nunca sai. Quase tudo roda com itens FALSOS montados em `items` e desenhados por render()/renderCard.
  A integração real (grava de verdade) fica em testes/genero-integracao.test.html.

    ACHADINHOS_DB=<copia> ACHADINHOS_PORTA=8766 ACHADINHOS_DISPARO=0 python3 servidor.py
    PORTA=8766 node testes/rodar.mjs genero-qa

  Obs.: as palavras de resultado ficam montadas por concatenação no script, para um grep no texto da página
  não casar com o código-fonte.
-->
<style>
  body{font:13px/1.45 ui-monospace,monospace;padding:12px;color:#111}
  pre{white-space:pre-wrap;margin:0}
  iframe{position:absolute;left:-9999px;top:0;width:1100px;height:900px;border:0}
</style>
</head>
<body>
<h1 style="font:600 16px sans-serif">QA: Público (gênero) e melhorias de UX no front</h1>
<pre id="saida"></pre>
<iframe id="app" title="app sob teste"></iframe>

<script>
'use strict';
// ---------------------------------------------------------------- mini-harness
const PREF_R = 'RESULT' + 'ADO: ';
const PREF_F = 'FALH' + 'OU: ';
const SAIDA = document.getElementById('saida');
const linhas = [PREF_R + 'PENDENTE'];
const log = l => { linhas.push(l); SAIDA.textContent = linhas.join('\n'); };
SAIDA.textContent = linhas[0];

class Falha extends Error {}
const afirma = (cond, msg) => { if (!cond) throw new Falha(msg || 'asserção falhou'); };
const igual = (obtido, esperado, msg) => {
  const a = JSON.stringify(obtido), b = JSON.stringify(esperado);
  if (a !== b) throw new Falha((msg ? msg + ': ' : '') + 'esperado ' + b + ', obtido ' + a);
};
const mesmo = (obtido, esperado, msg) => { if (obtido !== esperado) throw new Falha((msg ? msg + ': ' : '') + 'não é o mesmo nó do DOM'); };
const testes = [];
const teste = (nome, fn) => testes.push({ nome, fn });
const dormir = ms => new Promise(r => setTimeout(r, ms));
async function esperar(cond, desc = 'condição', tentativas = 1500, passo = 10) {
  for (let i = 0; i < tentativas; i++) {
    let ok = false;
    try { ok = cond(); } catch (e) { ok = false; }
    if (ok) return;
    await dormir(passo);
  }
  throw new Falha('tempo esgotado esperando: ' + desc);
}

let testeAtual = '(início)';
const erros = [];
function ouvirErros(janela, origem) {
  janela.addEventListener('unhandledrejection', e => {
    erros.push('rejeição não tratada (' + origem + ') durante "' + testeAtual + '": ' + (e.reason && e.reason.message || e.reason));
  });
  janela.addEventListener('error', e => { erros.push('erro não capturado (' + origem + ') durante "' + testeAtual + '": ' + e.message); });
}
ouvirErros(window, 'página de teste');

// ---------------------------------------------------------------- ambiente
const PERF = 'Perfumes e Perfumaria';
const CASA = 'Casa e Decoração';
const ELETRO = 'Eletrodomésticos';
const PAGINA = 24;
const GIF = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';

let W, FETCH_ORIG, API_ANTES = null;
const VIOL = [];      // escrita não prevista na API (deve ficar vazia)
const PUTS = [];      // PUT de /api/items/<id>/genero
const PATCHES = [];   // PATCH de /api/items/<id>
const DELETES = [];   // DELETE de /api/items/<id>
const CONFIGS = [];   // PUT de /api/config/<chave>
const COPIADO = [];   // textos que o app mandou para a área de transferência
let RESP_PUT = null, RESP_PATCH = null;

const json = (corpo, status = 200) => new W.Response(JSON.stringify(corpo), { status, headers: { 'Content-Type': 'application/json' } });

async function abrirApp(activeCat) {
  localStorage.removeItem('activeCat');
  if (activeCat !== undefined) localStorage.setItem('activeCat', activeCat);
  const antes = erros.length;
  const f = document.getElementById('app');
  f.style.width = '';
  await new Promise((res, rej) => { f.onload = res; f.onerror = rej; f.src = '/index.html?t=' + Date.now(); });
  W = f.contentWindow;
  ouvirErros(W, 'app');
  FETCH_ORIG = W.fetch.bind(W);
  PUTS.length = 0; PATCHES.length = 0; DELETES.length = 0; CONFIGS.length = 0; COPIADO.length = 0; RESP_PUT = null; RESP_PATCH = null;
  W.fetch = function (entrada, opcoes) {
    const url = typeof entrada === 'string' ? entrada : ((entrada && entrada.url) || String(entrada));
    const metodo = String((opcoes && opcoes.method) || (entrada && entrada.method) || 'GET').toUpperCase();
    if (metodo === 'PUT' && /^\/api\/items\/\d+\/genero$/.test(url)) {
      const pedido = { url, corpoTexto: opcoes.body, cabecalhos: opcoes.headers };
      PUTS.push(pedido);
      return RESP_PUT ? RESP_PUT(pedido) : Promise.reject(new W.TypeError('sem resposta definida'));
    }
    if (metodo === 'PATCH' && /^\/api\/items\/\d+$/.test(url)) {
      const pedido = { url, corpo: JSON.parse(opcoes.body) };
      PATCHES.push(pedido);
      return Promise.resolve(RESP_PATCH ? RESP_PATCH(pedido) : json({}));
    }
    if (metodo === 'DELETE' && /^\/api\/items\/\d+$/.test(url)) { DELETES.push(url); return Promise.resolve(json({ ok: true })); }
    if (metodo === 'PUT' && /^\/api\/config\/[A-Za-z]+$/.test(url)) { CONFIGS.push({ url, corpo: opcoes.body }); return Promise.resolve(json({ ok: true })); }
    if (metodo !== 'GET' && /\/api\//.test(url)) {
      VIOL.push(metodo + ' ' + url);
      return Promise.reject(new W.TypeError('bloqueado pelo teste: escrita na API real'));
    }
    return FETCH_ORIG(entrada, opcoes);
  };
  W.open = (...a) => { VIOL.push('window.open ' + a[0]); return null; };
  W.prompt = () => { VIOL.push('prompt'); return null; };
  Object.defineProperty(W.navigator, 'clipboard', { value: { writeText: async t => { COPIADO.push(t); } }, configurable: true });
  await esperar(() => W.eval('items.length') > 0 && W.document.querySelectorAll('#grid .card').length > 0, 'o index.html carregar os itens (servidor no ar? PORTA=...)');
  await dormir(30);
  if (erros.length > antes) throw new Falha('erro ao abrir o app: ' + erros.slice(antes).join(' | '));
}
async function largura(px) {
  document.getElementById('app').style.width = px + 'px';
  await dormir(120);
}

const q = s => W.document.querySelector(s);
const qa = s => [...W.document.querySelectorAll(s)];
const txt = el => el.textContent.replace(/\s+/g, ' ').trim();
const cartoes = () => qa('#grid .card');
const radios = () => qa('#publicoBox input[name="publico"]');
const valoresPublico = () => radios().map(i => i.value);
const contagens = () => radios().map(i => +i.nextElementSibling.querySelector('.num').textContent.replace(/\./g, ''));
const marcado = () => (radios().find(i => i.checked) || {}).value;
function escolherPublico(v) {
  const r = radios().find(i => i.value === v);
  afirma(r, 'não existe a opção "' + v + '" (opções: ' + valoresPublico() + ')');
  r.click();
}
function escolher(select, valor) {
  select.value = valor;
  select.dispatchEvent(new W.Event('change', { bubbles: true }));
}
const aba = nome => qa('#tabs .tab').find(b => b.dataset.c === nome);
const toastTxt = () => txt(q('#toast'));
const digitarTitulo = t => { q('#fTexto').value = t; q('#fTexto').dispatchEvent(new W.Event('input', { bubbles: true })); };
const visivel = el => !!el && W.getComputedStyle(el).display !== 'none' && W.getComputedStyle(el).visibility !== 'hidden' && el.getClientRects().length > 0;
const selos = c => [...c.querySelectorAll('.selo-genero')];
function adiado() { let ok, nao; const p = new Promise((a, b) => { ok = a; nao = b; }); return { p, ok, nao }; }
const resposta = (it, genero, origem, auto) => ({ ...JSON.parse(JSON.stringify(it)), genero, genero_origem: origem, genero_auto: auto });

// ---------------------------------------------------------------- itens falsos
let seq = 5000;
function item(cat, genero, o = {}) {
  const id = ++seq;
  return {
    id, loja: o.loja || 'amazon', item_id: 'FALSO' + id, cat, busca: o.busca || 'Busca A', url: 'https://meli.la/F' + id,
    data: o.data === null ? null : { titulo: o.titulo || 'Produto ' + genero + ' ' + id, preco: 'R$ 10,00', desconto: '-10%', ...(o.data || {}) },
    genero, genero_origem: o.origem === undefined ? (cat === PERF && genero !== 'sem' ? 'titulo' : '') : o.origem,
    genero_auto: o.auto || genero,
  };
}
// Perfumes: F 30 (20 amazon "Busca F" + 10 ml "Busca Mista"), M 20 (15 amazon "Busca M" + 5 ml "Busca Mista"), U 5, sem 7 (3 amazon + 4 ml "Busca S").
// Casa e Eletrodomésticos: tudo "sem" (a aba não separa por público).
function cenario() {
  seq = 5000;
  const L = [];
  for (let i = 0; i < 20; i++) L.push(item(PERF, 'feminino', { busca: 'Busca F' }));
  for (let i = 0; i < 10; i++) L.push(item(PERF, 'feminino', { busca: 'Busca Mista', loja: 'ml' }));
  for (let i = 0; i < 15; i++) L.push(item(PERF, 'masculino', { busca: 'Busca M' }));
  for (let i = 0; i < 5; i++) L.push(item(PERF, 'masculino', { busca: 'Busca Mista', loja: 'ml' }));
  for (let i = 0; i < 5; i++) L.push(item(PERF, 'unissex', { busca: 'Busca Mista' }));
  for (let i = 0; i < 3; i++) L.push(item(PERF, 'sem', { busca: 'Busca Mista' }));
  for (let i = 0; i < 4; i++) L.push(item(PERF, 'sem', { busca: 'Busca S', loja: 'ml' }));
  for (let i = 0; i < 10; i++) L.push(item(CASA, 'sem', { busca: 'Casa A' }));
  for (let i = 0; i < 5; i++) L.push(item(ELETRO, 'sem', { busca: 'Eletro A' }));
  return L;
}
function montar(lista, cat = PERF) {
  for (const k of Object.keys(localStorage)) if (k.startsWith('genero:')) localStorage.removeItem(k);
  PUTS.length = 0; PATCHES.length = 0; DELETES.length = 0; CONFIGS.length = 0; COPIADO.length = 0; RESP_PUT = null; RESP_PATCH = null;
  W.eval('items = ' + JSON.stringify(lista) + '; activeCat = ' + JSON.stringify(cat) + '; page = 1;');
  for (const id of ['fLoja', 'fBusca', 'fOrdem']) q('#' + id).value = '';
  q('#fTexto').value = '';
  W.render();
}
function cartaoFalso(it) {
  const c = W.document.createElement('div'); c.className = 'card';
  W.document.body.appendChild(c);
  W.renderCard(c, it);
  return c;
}

// ================================================================ CA-V4: contagens com loja e título combinados
teste('CA-V4: as contagens respeitam loja e título ao mesmo tempo (nem a busca nem o próprio público entram)', async () => {
  montar(cenario());
  escolher(q('#fLoja'), 'ml');
  digitarTitulo('produto sem');   // ml: F 10, M 5, sem 4 ("Produto sem 50xx"); só os "sem" casam
  igual(valoresPublico(), ['todos', 'feminino', 'masculino', 'unissex', 'sem']);
  igual(contagens(), [4, 0, 0, 0, 4]);
  escolher(q('#fLoja'), 'amazon');
  igual(contagens(), [3, 0, 0, 0, 3], 'amazon + título');
  digitarTitulo('  PRODUTO FEMININO  ');   // sem diferenciar maiúsculas e ignorando espaços nas pontas; só a amazon (20 F)
  igual(contagens(), [20, 20, 0, 0], 'amazon + título em maiúsculas: "Sem gênero" some');
  escolher(q('#fLoja'), 'ml');
  igual(contagens(), [10, 10, 0, 0], 'ml + título feminino');
  escolherPublico('masculino');
  igual(W.eval('filtrada().length'), 0, 'masculino + ml + "produto feminino": vazio');
  igual(contagens(), [10, 10, 0, 0], 'escolher o público não mexe nas contagens');
  digitarTitulo('');
  igual(contagens(), [19, 10, 5, 0, 4]);
  igual(W.eval('filtrada().length'), 5);
});

teste('CA-V4: item sem "data" (nunca coletado) conta em "Todos" e em "Sem gênero" e não casa com título digitado', async () => {
  const L = cenario();
  L.push(item(PERF, 'sem', { data: null }), item(PERF, 'sem', { data: null }));
  montar(L);
  igual(contagens(), [64, 30, 20, 5, 9]);
  digitarTitulo('qualquer coisa');
  igual(contagens(), [0, 0, 0, 0], 'com título digitado, item sem data não casa');
  digitarTitulo('');
  escolherPublico('sem');
  igual(W.eval('filtrada().length'), 9);
  igual(cartoes().length, 9);
  igual(qa('#grid .card .name').length, 7, 'dois cartões sem título (sem a marcação de nome)');
});

teste('CA-V1: contagens de 5 dígitos aparecem com ponto de milhar e cabem no controle', async () => {
  const grande = [];
  for (let i = 0; i < 12345; i++) grande.push({ id: 900000 + i, loja: 'amazon', item_id: 'G' + i, cat: PERF, busca: 'Busca G', url: 'https://meli.la/G' + i,
    data: { titulo: 'Grande ' + i, preco: 'R$ 1,00', desconto: '-5%' }, genero: i % 2 ? 'feminino' : 'masculino', genero_origem: 'titulo', genero_auto: i % 2 ? 'feminino' : 'masculino' });
  montar(grande);
  igual(radios().map(i => txt(i.closest('label'))), ['Todos 12.345', 'Feminino 6.172', 'Masculino 6.173', 'Unissex 0']);
  const pager = txt(q('.pager'));
  afirma(pager.includes('Página 1 de 515'), 'pager: ' + pager);
});

// ================================================================ CA-V3: memória por aba
teste('CA-V3: valor plantado inválido ou de outra grafia no localStorage cai em "Todos" sem quebrar a tela', async () => {
  montar(cenario());
  for (const v of ['todos', '', 'Feminino', ' feminino', 'FEMININO', 'constructor', '__proto__', 'toString', 'null', 'undefined', '0', '["feminino"]', 'feminino,masculino', '<img src=x onerror=window.__xss=9>']) {
    localStorage.setItem('genero:' + PERF, v);
    W.render();
    igual(marcado(), 'todos', 'valor plantado ' + JSON.stringify(v));
    igual(W.eval('filtrada().length'), 62, 'lista com ' + JSON.stringify(v));
    igual(cartoes().length, PAGINA);
  }
  localStorage.removeItem('genero:' + PERF);
});

teste('CA-V3: a escolha grava só "genero:<aba>" da aba de Perfumes e a chave de outra grafia da aba não vale', async () => {
  montar(cenario());
  const antes = Object.keys(localStorage).filter(k => k.startsWith('genero')).sort();
  igual(antes, []);
  escolherPublico('unissex');
  igual(Object.keys(localStorage).filter(k => k.startsWith('genero')).sort(), ['genero:' + PERF]);
  localStorage.removeItem('genero:' + PERF);
  localStorage.setItem('genero:perfumes e perfumaria', 'feminino'); localStorage.setItem('genero:Perfumes e Perfumaria ', 'feminino');
  W.render();
  igual(marcado(), 'todos', 'só a chave exata vale');
  localStorage.removeItem('genero:perfumes e perfumaria'); localStorage.removeItem('genero:Perfumes e Perfumaria ');
});

teste('CA-V3: a escolha lembrada vale depois de recarregar a página, inclusive o selo (some) e o filtro da lista', async () => {
  localStorage.setItem('genero:' + PERF, 'masculino');
  await abrirApp(PERF);
  igual(marcado(), 'masculino');
  const itens = W.eval('items').filter(i => i.cat === PERF);
  igual(W.eval('filtrada().every(i => i.genero === "masculino")'), true);
  igual(qa('#grid .selo-genero').length, 0, 'com público escolhido o selo some');
  igual(contagens()[0], itens.length);
  localStorage.removeItem('genero:' + PERF);
  await abrirApp(PERF);
  igual(marcado(), 'todos', 'sem chave, abre em Todos');
});

// ================================================================ CA-V7 / CA-V26: selo em texto de verdade
teste('CA-V7/V26: o selo aparece em caixa-alta na tela ("FEMININO · CORRIGIDO", "CORRIGIDO"), em Mudo e sem cor de acento', async () => {
  montar(cenario());
  let c = cartaoFalso(item(PERF, 'feminino', { origem: 'manual', auto: 'masculino' }));
  const s = selos(c)[0];
  igual(W.getComputedStyle(s).textTransform, 'uppercase');
  igual(s.innerText.trim(), 'FEMININO · CORRIGIDO');
  igual(W.getComputedStyle(s).color, W.getComputedStyle(c.querySelector('.badge')).color, 'cor Mudo igual à da loja');
  const rgbMudo = W.getComputedStyle(W.document.body).getPropertyValue('--mudo').trim();
  afirma(rgbMudo !== '', 'token --mudo');
  c.remove();
  c = cartaoFalso(item(PERF, 'sem', { origem: 'manual', auto: 'feminino' }));
  igual(selos(c)[0].innerText.trim(), 'CORRIGIDO');
  igual(selos(c)[0].getAttribute('title'), 'Público corrigido à mão');
  c.remove();
  c = cartaoFalso(item(PERF, 'unissex'));
  igual(selos(c)[0].innerText.trim(), 'UNISSEX');
  c.remove();
});

teste('CA-V7: o selo de gênero entra entre a loja e a busca e a busca longa continua truncando com reticências (320 px)', async () => {
  montar(cenario());
  await largura(320);
  const c = cartaoFalso(item(PERF, 'masculino', { busca: 'Perfume masculino importado de longa duração e grande fixação árabe' }));
  c.style.width = '280px';
  const top = c.querySelector('.top'), b = c.querySelector('.busca');
  afirma(top.scrollWidth <= top.clientWidth + 1, 'a linha do topo estoura: ' + top.scrollWidth + ' > ' + top.clientWidth);
  igual(W.getComputedStyle(b).textOverflow, 'ellipsis');
  afirma(b.scrollWidth > b.clientWidth, 'a busca longa tem de ser cortada, não quebrar a linha');
  igual(selos(c)[0].getBoundingClientRect().height < 24, true, 'o selo não quebra em duas linhas');
  c.remove();
});

// ================================================================ CA-V2: Copiar da página
teste('CA-V2: o botão "Copiar todas da página" copia só as mensagens do público escolhido e da página aberta', async () => {
  montar(cenario());
  escolherPublico('feminino');
  q('#btnCopyAll').click();
  await esperar(() => COPIADO.length === 1, 'a cópia');
  let partes = COPIADO[0].split('\n\n----------\n\n');
  igual(partes.length, PAGINA);
  afirma(partes.every(p => p.includes('Produto feminino')) && !COPIADO[0].includes('masculino'), 'só femininos');
  q('.pager .pg[data-p="2"]').click();
  q('#btnCopyAll').click();
  await esperar(() => COPIADO.length === 2, 'a 2ª cópia');
  partes = COPIADO[1].split('\n\n----------\n\n');
  igual(partes.length, 6, 'página 2: 30 - 24');
  afirma(partes.every(p => p.includes('Produto feminino')), 'página 2 só femininos');
  escolherPublico('sem');
  q('#btnCopyAll').click();
  await esperar(() => COPIADO.length === 3, 'a 3ª cópia');
  partes = COPIADO[2].split('\n\n----------\n\n');
  igual(partes.length, 7);
  afirma(partes.every(p => p.includes('Produto sem')), 'só os sem gênero');
});

// ================================================================ CA-V24..V28: correção, bordas
teste('CA-V24: render() durante o PUT (trocar de aba e voltar) não deixa o cartão novo mostrando o público antigo', async () => {
  montar(cenario());
  const c = cartoes()[0], it = W.eval('filtrada()[0]'), sel = c.querySelector('select.gen');
  const d = adiado();
  RESP_PUT = () => d.p;
  escolher(sel, 'masculino');
  await esperar(() => PUTS.length === 1, 'o PUT sair');
  aba(CASA).click(); aba(PERF).click();   // render() recria os cartões enquanto o servidor ainda não respondeu
  const novo = cartoes()[0];
  afirma(novo !== c, 'precondição: o cartão foi recriado');
  d.ok(json(resposta(it, 'masculino', 'manual', 'feminino')));
  await esperar(() => W.eval('filtrada()[0]').genero === 'masculino', 'o item receber a resposta');
  await dormir(60);
  igual(selos(novo).map(txt), ['Masculino · corrigido'], 'o selo do cartão que está na tela');
  igual(novo.querySelector('select.gen').value, 'masculino', 'o campo do cartão que está na tela');
  igual(novo.querySelector('select.gen').disabled, false);
});

teste('CA-V24: com um PUT em andamento o campo do mesmo cartão não aceita um segundo envio (um PUT só por escolha)', async () => {
  montar(cenario());
  const c = cartoes()[0], it = W.eval('filtrada()[0]'), sel = c.querySelector('select.gen');
  const d = adiado();
  RESP_PUT = () => d.p;
  escolher(sel, 'masculino');
  await esperar(() => PUTS.length === 1);
  igual(sel.disabled, true);
  // um clique em "Excluir" ou "Mover para" não deve disparar PUT de gênero
  escolher(c.querySelector('select.mv'), CASA);
  await dormir(30);
  igual(PUTS.length, 1);
  d.ok(json(resposta(it, 'masculino', 'manual', 'feminino')));
  await esperar(() => !sel.disabled);
  igual(PUTS.length, 1);
});

teste('CA-V25: corrigir para o mesmo valor que o automático dá ainda assim "corrigido" e "Automático" volta a desfazer', async () => {

// ================================================================ CA-V8, CA-V22: 320 a 1280 px
// Elementos que passam da borda direita da janela (ignora os de leitor de tela)
function estouros(todos = false) {
  const vw = W.document.documentElement.clientWidth;
  return qa('body *').filter(e => (todos || (!e.closest('.sr') && visivel(e))) && e.getBoundingClientRect().right > vw + 1)
    .slice(0, 6).map(e => e.tagName.toLowerCase() + '.' + e.className + (e.id ? '#' + e.id : '') + ' right=' + Math.round(e.getBoundingClientRect().right) + ' vw=' + vw);
}
// Elementos cujo conteúdo é mais largo que a janela (texto que vaza sem a caixa passar da borda)
function conteudoLargo() {
  const vw = W.document.documentElement.clientWidth;
  return qa('body *').filter(e => e.scrollWidth > vw + 1).slice(0, 6).map(e => e.tagName.toLowerCase() + '.' + e.className + (e.id ? '#' + e.id : '') + ' sw=' + e.scrollWidth + ' cw=' + e.clientWidth);
}
function semRolagem(onde) {
  const d = W.document.documentElement;
  afirma(d.scrollWidth <= d.clientWidth + 1, onde + ': rolagem horizontal ' + d.scrollWidth + ' > ' + d.clientWidth + ' (' + estouros().join(' | ') + ' | todos: ' + estouros(true).join(' | ') + ' | conteúdo largo: ' + conteudoLargo().join(' | ') + ')');
  afirma(W.document.body.scrollWidth <= d.clientWidth + 1, onde + ': body mais largo que a janela (' + W.document.body.scrollWidth + ')');
  igual(estouros(), [], onde + ': elementos passando da borda');
}
const LONGO = 'Perfume' + 'Superlongosemespacosqueempurrariaacaixa'.repeat(8);
function cenarioLongo() {
  const L = cenario();
  L.unshift(item(PERF, 'feminino', { titulo: LONGO, busca: 'B' + 'x'.repeat(120), data: { preco: 'R$ 1.234.567,89', preco_antigo: 'R$ 2.345.678,90', desconto: '-47%', vendas: '99 mil vendidos no mês', avaliacao: '4,5 de 5 estrelas' } }));
  L.unshift(item(PERF, 'sem', { origem: 'manual', auto: 'feminino', titulo: 'Corrigido para sem gênero ' + LONGO }));
  return L;
}

// ================================================================ CA-V22 / CA-V9 / CA-V12: contraste dos tokens e movimento
// As folhas de estilo de outra origem (Google Fonts, sem internet ou não) não deixam ler as regras: ficam de fora
function regrasLegiveis() {
  const out = [];
  for (const s of W.document.styleSheets) { try { out.push([...s.cssRules]); } catch (e) { /* folha de outra origem */ } }
  return out;
}
function lerTokens() {
  const claro = {}, escuro = {}; let reduz = false;
  for (const s of regrasLegiveis()) for (const r of s) {
    if (r.selectorText === ':root') for (const p of r.style) if (p.startsWith('--')) claro[p] = r.style.getPropertyValue(p).trim();
    if (r.conditionText && /prefers-color-scheme\s*:\s*dark/.test(r.conditionText)) for (const rr of r.cssRules) if (rr.selectorText === ':root') for (const p of rr.style) if (p.startsWith('--')) escuro[p] = rr.style.getPropertyValue(p).trim();
    if (r.conditionText && /prefers-reduced-motion\s*:\s*reduce/.test(r.conditionText)) reduz = /transition\s*:\s*none/.test(r.cssText) && /scroll-behavior\s*:\s*auto/.test(r.cssText);
  }
  return { claro, escuro: { ...claro, ...escuro }, reduz };
}
const lum = hex => {
  const n = parseInt(hex.replace('#', ''), 16), c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; });
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
};
const contraste = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, r) => r - p); return (x + 0.05) / (y + 0.05); };

teste('CA-V9/CA-V22: contraste dos tokens do controle, do selo, da contagem e do erro, em claro e escuro (texto ≥ 4,5:1; opção marcada ≥ 12:1; bordas e foco ≥ 3:1)', async () => {
  montar(cenario());
  const t = lerTokens();
  afirma(Object.keys(t.escuro).length >= Object.keys(t.claro).length && t.escuro['--papel'] !== t.claro['--papel'], 'não achei o bloco escuro dos tokens');
  const pares = [
    ['--sobre-tinta', '--tinta', 12, 'opção marcada (texto sobre Tinta)'],
    ['--tinta', '--superficie', 4.5, 'opção inativa e texto do cartão'],
    ['--mudo', '--superficie', 4.5, 'contagem inativa, selo e busca no cartão'],
    ['--mudo', '--papel', 4.5, 'legenda "Público" e contador de totais'],
    ['--falhou', '--superficie', 4.5, 'status de erro do cartão'],
    ['--linha-campo', '--superficie', 3, 'borda do segmento'],
    ['--foco', '--papel', 3, 'anel de foco'],
    ['--foco', '--superficie', 3, 'anel de foco no cartão'],
  ];
  for (const [esq, nome] of [[t.claro, 'claro'], [t.escuro, 'escuro']]) {
    for (const [a, b, min, onde] of pares) {
      const r = contraste(esq[a], esq[b]);
      afirma(r >= min, nome + ': ' + a + ' sobre ' + b + ' (' + onde + ') = ' + r.toFixed(2) + ':1, mínimo ' + min);
    }
  }
  igual(t.reduz, true, 'prefers-reduced-motion sem transition:none e scroll-behavior:auto');
});

// ================================================================ execução
(async () => {
  let falhas = 0, total = 0;
  try {
    API_ANTES = await (await fetch('/api/items')).text();
    const API = JSON.parse(API_ANTES);
    afirma(Array.isArray(API) && API.length > 0, '/api/items vazio');
    afirma(API.every(i => ['feminino', 'masculino', 'unissex', 'sem'].includes(i.genero)), 'o servidor não devolve "genero" em todo item (servidor antigo?)');
  } catch (e) {
    linhas.shift();
    log(PREF_F + 'preparação — ' + (e && e.message || e));
    log(PREF_R + 'FALH' + 'OU (preparação)');
    return;
  }
  const guardado = localStorage.getItem('activeCat');
  for (const t of testes) {
    total++; testeAtual = t.nome;
    const antesErros = erros.length;
    try {
      if (!W) await abrirApp();
      await t.fn();
      await dormir(30);
      if (erros.length > antesErros) throw new Falha(erros.slice(antesErros).join(' | '));
      log('ok    ' + t.nome);
    } catch (e) {
      falhas++;
      log(PREF_F + t.nome + ' — ' + (e && e.message || e));
    }
    document.getElementById('app').style.width = '';
    try { W.scrollTo(0, 0); if (W.location.hash) { W.location.hash = ''; } } catch (e) { /* janela fora */ }
  }
  for (const k of Object.keys(localStorage)) if (k.startsWith('genero:')) localStorage.removeItem(k);
  if (guardado === null) localStorage.removeItem('activeCat'); else localStorage.setItem('activeCat', guardado);
  linhas.shift();
  log('');
  log(total + ' testes, ' + (total - falhas) + ' passaram, ' + falhas + ' falharam');
  log(falhas === 0 && total > 0 ? PREF_R + 'OK' : PREF_R + 'FALH' + 'OU (' + falhas + ' de ' + total + ')');
})();
