<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etiqueta</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='894 247 92 92'%3E%3Cpath fill='%23FF5B14' fill-rule='evenodd' d='M978 263a4 4 0 0 1 4 4V320a4 4 0 0 1-4 4H923L900 296a3 3 0 0 1 0-5L922 263.5Q923 263 925 263ZM921 287.5a5.5 5.5 0 1 0 .01 0Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Tokens da identidade visual (Papel, Superfície, Linha, Mudo, Tinta, Etiqueta) */
  :root{
    color-scheme:light dark;
    --papel:#F7F7F5;--superficie:#FFFFFF;--linha:#E4E4E0;--linha-campo:#6B6B66;--sobre-etiqueta:#111110;--fundo-imagem:#FFFFFF;--mudo:#6B6B66;--tinta:#111110;
    --etiqueta:#FF5B14;--etiqueta-escura:#C2410C;--etiqueta-clara:#FFEDE3;
    --enviado:#15803D;--falhou:#B91C1C;
    --sobre-tinta:#F7F7F5;      /* texto sobre botão Tinta */
    --foco:#C2410C;             /* anel de foco (Etiqueta escura: 4,8:1 sobre Papel) */
    --sombra:0 8px 24px rgba(17,17,16,.18);
    --font:'Geist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    /* escala tipográfica */
    --t-titulo:600 24px/32px var(--font);
    --t-subtitulo:500 17px/24px var(--font);
    --t-corpo:400 15px/22px var(--font);
    --t-legenda:400 13px/18px var(--font);
    --t-rotulo:500 12px/16px var(--font);
    --t-valor:500 28px/32px var(--mono);--t-valor-letra:-.02em;--t-mono-p:400 13px/18px var(--mono);--t-mono-m:500 14px/20px var(--mono);
    /* escala de espaçamento */
    --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
    --r-sm:6px;--r:10px;--r-lg:14px;--r-pill:999px;
    --alvo:36px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --papel:#121211;--superficie:#1B1B19;--linha:#2C2C29;--linha-campo:#9A9A94;--mudo:#9A9A94;--tinta:#EDEDEA;
      --etiqueta:#FF6A2B;--etiqueta-escura:#FF6A2B;--etiqueta-clara:#3A2216;
      --enviado:#3FB86A;--falhou:#F0625F;
      --sobre-tinta:#121211;--foco:#FF6A2B;--sombra:0 8px 24px rgba(0,0,0,.5);
    }
  }
  @media (pointer:coarse){:root{--alvo:44px}}
  *{box-sizing:border-box}
  body{margin:0;font:var(--t-corpo);background:var(--papel);color:var(--tinta);-webkit-font-smoothing:antialiased}
  :focus-visible{outline:2px solid var(--foco);outline-offset:2px}
  header{position:sticky;top:0;background:var(--papel);border-bottom:1px solid var(--linha);padding:var(--s3) var(--s4);z-index:5;max-height:100dvh;overflow:auto}
  .row{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center;max-width:1200px;margin:0 auto}
  .bar{justify-content:space-between}
  .bar .grp{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
  h1{font:var(--t-subtitulo);font-weight:600;margin:0}
  h1 .logo{display:block;height:28px;width:auto;overflow:visible}
  h1 .logo .tag{fill:var(--etiqueta)}
  .muted{color:var(--mudo);font:var(--t-legenda)}
  select,input,button,textarea{font:inherit}
  select,input[type=text],input[type=search]{background:var(--superficie);color:var(--tinta);border:1px solid var(--linha-campo);border-radius:var(--r);padding:0 var(--s3);min-height:var(--alvo)}
  select{max-width:100%}
  input::placeholder,textarea::placeholder{color:var(--mudo);opacity:1}
  .lbl{display:flex;align-items:center;gap:var(--s2);font:var(--t-rotulo);letter-spacing:.06em;text-transform:uppercase;color:var(--mudo)}
  .lbl select{font:var(--t-corpo);letter-spacing:0;text-transform:none;color:var(--tinta)}
  /* Botões: padrão = Tinta; .cta = Etiqueta (única ação principal); .secondary = contorno; .ghost = discreto */
  button{background:var(--tinta);color:var(--sobre-tinta);border:1px solid transparent;border-radius:var(--r);padding:0 var(--s4);min-height:var(--alvo);font-weight:500;cursor:pointer;transition:background .15s,border-color .15s}
  button:hover:not(:disabled):not([aria-disabled="true"]){opacity:.88}
  button.cta{background:var(--etiqueta);color:var(--sobre-etiqueta);font-weight:600}
  button.secondary{background:transparent;color:var(--tinta);border-color:var(--linha)}
  button.secondary:hover:not(:disabled):not([aria-disabled="true"]){opacity:1;border-color:var(--mudo)}
  button.ghost{background:transparent;color:var(--tinta)}
  button.ghost:hover:not(:disabled){opacity:1;background:var(--linha)}
  button.danger{background:transparent;color:var(--falhou)}
  button.danger:hover:not(:disabled){opacity:1;background:var(--linha)}
  button:disabled{opacity:.45;cursor:not-allowed}
  main{max-width:1200px;margin:0 auto;padding:var(--s5) var(--s4) var(--s7)}
  .tabs{display:flex;flex-wrap:wrap;gap:var(--s2);margin-bottom:var(--s4)}
  .tab{display:inline-flex;align-items:center;gap:var(--s2);min-height:var(--alvo);padding:0 var(--s4);border-radius:var(--r-pill);border:1px solid var(--linha);background:var(--superficie);color:var(--tinta);font-weight:400}
  .tab:hover:not(:disabled){opacity:1;border-color:var(--mudo)}
  .tab .muted{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .tab.active{background:var(--etiqueta-clara);border-color:var(--etiqueta-escura);font-weight:600}
  .tab.active .muted{color:var(--tinta)}
  .filters{margin-bottom:var(--s4);gap:var(--s2)}
  .filters input{flex:1;min-width:180px}
  .pager{gap:var(--s2);margin-bottom:var(--s4)}
  .pager.bottom{margin:var(--s5) auto 0}
  .pager button{min-height:32px;padding:0 var(--s3);font:var(--t-legenda);font-weight:500}
  .pager .muted{padding:0 var(--s2);font-variant-numeric:tabular-nums}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:var(--s4)}
  .card{background:var(--superficie);border:1px solid var(--linha);border-radius:var(--r-lg);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3);min-width:0}
  .card.done{border-color:var(--enviado)}
  .top{display:flex;align-items:center;gap:var(--s2);min-width:0}
  .badge{font:var(--t-rotulo);letter-spacing:.06em;text-transform:uppercase;color:var(--mudo);white-space:nowrap}
  .busca{font:var(--t-legenda);color:var(--mudo);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .feito{display:none;margin-left:auto;font:var(--t-rotulo);letter-spacing:.06em;text-transform:uppercase;color:var(--enviado);white-space:nowrap}
  .card.done .feito{display:inline}
  .info{display:flex;gap:var(--s3);align-items:flex-start}
  .info img{width:72px;height:72px;flex:none;object-fit:contain;background:var(--fundo-imagem);border:1px solid var(--linha);border-radius:var(--r-sm)}
  .info .t{flex:1;min-width:0}
  .name{font:var(--t-subtitulo);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
  .price{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--s1) var(--s2);margin-top:var(--s1);font-family:var(--mono);font-variant-numeric:tabular-nums}
  .price .now{font:var(--t-valor);letter-spacing:var(--t-valor-letra);font-variant-numeric:tabular-nums}
  .price .old{color:var(--mudo);font:var(--t-mono-p)}
  .price .off{color:var(--etiqueta-escura);font:var(--t-mono-m)}
  .meta{font:var(--t-legenda);color:var(--mudo);margin-top:var(--s1)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  textarea{width:100%;min-height:200px;resize:vertical;background:var(--papel);color:var(--tinta);border:1px solid var(--linha-campo);border-radius:var(--r);padding:var(--s3);white-space:pre-wrap;line-height:22px}
  .card textarea{flex:1 0 auto}
  textarea:focus-visible,input:focus-visible,select:focus-visible{outline-offset:0;border-color:var(--foco)}
  .actions{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}
  .card .actions .copy{flex:1 1 96px}
  .copyimg{white-space:nowrap;min-width:calc(14ch + 2*var(--s4))}
  .copyimg[data-estado="copiada"]{color:var(--enviado)}
  .copyimg[aria-disabled="true"]:not([aria-busy="true"]){opacity:.45;cursor:not-allowed}
  .copyimg[aria-busy="true"]{cursor:progress}
  .more{margin-left:auto}
  .more[open]{flex-basis:100%;margin-left:0}
  .more summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:var(--s1);min-height:var(--alvo);padding:0 var(--s3);border-radius:var(--r);font:var(--t-legenda);font-weight:500;color:var(--mudo)}
  .more summary::-webkit-details-marker{display:none}
  .more summary::after{content:"▾" / "";font-size:11px}
  .more[open] summary::after{content:"▴" / ""}
  .more summary:hover{background:var(--linha);color:var(--tinta)}
  .more .rare{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2);padding-top:var(--s2);border-top:1px solid var(--linha);margin-top:var(--s1)}
  .more .rare .lbl{margin-left:auto}
  .box{display:none;max-width:1200px;margin:var(--s3) auto 0;background:var(--superficie);border:1px solid var(--linha);border-radius:var(--r-lg);padding:var(--s4)}
  .box.open{display:block}
  .box textarea{min-height:140px}
  .box .stack{display:flex;flex-direction:column;gap:var(--s3)}
  .box .help{font:var(--t-legenda);color:var(--mudo);font-family:var(--mono);overflow-wrap:anywhere}
  .status{font:var(--t-legenda);color:var(--mudo)}
  .status:empty{position:absolute}
  .status.err{color:var(--falhou)}
  .toast{position:fixed;bottom:var(--s5);left:50%;transform:translateX(-50%);background:var(--tinta);color:var(--sobre-tinta);padding:var(--s3) var(--s5);border-radius:var(--r-pill);font-weight:500;box-shadow:var(--sombra);opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:calc(100vw - 32px)}
  .toast.show{opacity:1}
  @media (max-width:600px){
    header{padding:var(--s3)}
    main{padding:var(--s4) var(--s3) var(--s6)}
    .bar .grp{width:100%}
    .bar .grp .lbl{width:100%}
    .bar .grp .lbl select{flex:1}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <div class="row bar">
    <div class="grp">
      <h1><svg class="logo" role="img" aria-label="Etiqueta" viewBox="524 259 1512 364" focusable="false"><path fill="currentColor" d="M629.2 566.7Q598 566.7 575 553.2Q552 539.8 539.5 515.2Q527 490.6 527 457.9Q527 425.1 539.5 400.7Q552 376.4 574.8 362.7Q597.6 349.1 628 349.1Q657.7 349.1 680.1 362.3Q702.5 375.6 714.6 400.5Q726.7 425.5 726.7 460.6V471.9H578.9Q580.4 499.2 593.9 513.1Q607.3 526.9 629.6 526.9Q646.3 526.9 657.5 519.3Q668.6 511.7 672.9 498L724 501.2Q715.4 531.6 690.2 549.1Q665.1 566.7 629.2 566.7ZM578.9 438.4H675.2Q673.6 413 660.8 400.7Q647.9 388.4 628 388.4Q608.1 388.4 595.1 401.3Q582 414.2 578.9 438.4ZM842.2 562Q811 562 796.4 547.6Q781.8 533.1 781.8 502.3V305H831.7V497.6Q831.7 512.1 837.9 517.7Q844.2 523.4 857.4 523.4H886.7V562ZM749 392.4V353.7H886.7V392.4ZM916 562V353.7H965.9V562ZM1199.7 620.5H1149.8V517.9L1154.4 521.8Q1150.5 535.5 1141 545.6Q1131.4 555.8 1118 561.2Q1104.5 566.7 1088.9 566.7Q1059.3 566.7 1039.6 551.9Q1019.9 537 1009.9 512.5Q1000 487.9 1000 457.9Q1000 427.8 1009.8 403.3Q1019.5 378.7 1039.2 363.9Q1058.9 349.1 1088.5 349.1Q1112.3 349.1 1130.3 361Q1148.2 372.9 1155.6 395.9L1150.5 398.2L1151.7 353.7H1199.7ZM1100.6 526.1Q1116.2 526.1 1127.1 518.5Q1138.1 510.9 1143.9 495.7Q1149.8 480.5 1149.8 457.9Q1149.8 435.2 1143.7 420Q1137.7 404.8 1126.8 397.2Q1115.8 389.6 1100.6 389.6Q1078 389.6 1064.9 407.8Q1051.9 425.9 1051.9 457.9Q1051.9 489.9 1064.9 508Q1078 526.1 1100.6 526.1ZM1310.6 566.7Q1279 566.7 1260.5 545.8Q1242 525 1242 487.9V353.7H1291.9V475.4Q1291.9 501.6 1300.7 513.8Q1309.5 526.1 1327.4 526.1Q1347.7 526.1 1358.8 512.7Q1369.9 499.2 1369.9 473.5V353.7H1419.8V562H1374.2L1373 504.7L1379.3 506.6Q1374.6 536.3 1357.1 551.5Q1339.5 566.7 1310.6 566.7ZM1554.2 566.7Q1523 566.7 1500 553.2Q1477 539.8 1464.5 515.2Q1452 490.6 1452 457.9Q1452 425.1 1464.5 400.7Q1477 376.4 1499.8 362.7Q1522.6 349.1 1553 349.1Q1582.7 349.1 1605.1 362.3Q1627.5 375.6 1639.6 400.5Q1651.7 425.5 1651.7 460.6V471.9H1503.9Q1505.4 499.2 1518.9 513.1Q1532.3 526.9 1554.6 526.9Q1571.3       <span class="muted" id="count"></span>
    </div>
    <div class="grp">
      <label class="lbl">Template <select id="tplSelect"></select></label>
      <button class="ghost" id="btnTpl">Editar templates</button>
      <button class="ghost" id="btnAdd">Adicionar links</button>
      <button class="secondary" id="btnCopyAll">Copiar todas da página</button>
    </div>
  </div>

  <div class="box" id="addBox">
    <div class="stack">
      <div class="row">
        <label class="lbl">Categoria <select id="addCat"></select></label>
        <input type="text" id="addCatNew" placeholder="ou nova categoria" aria-label="Nova categoria">
      </div>
      <textarea id="addLinks" aria-label="Links de afiliado" placeholder="Cole links de afiliado aqui, um por linha (Amazon ou Mercado Livre)"></textarea>
      <div class="actions"><button id="saveLinks">Adicionar</button></div>
    </div>
  </div>

  <div class="box" id="tplBox">
    <div class="stack">
      <input type="text" id="tplName" placeholder="Nome do template" aria-label="Nome do template">
      <textarea id="tplText" aria-label="Texto do template"></textarea>
      <div class="muted help">Campos: {TITULO_PRODUTO} {PRECO_PRODUTO} {PRECO_ANTIGO} {DESCONTO_PRODUTO} {NUMERO_VENDAS} {FRETE} {CUPOM} {LINK} {LOJA}</div>
      <div class="actions">
        <button id="saveTpl">Salvar template</button>
        <button class="danger" id="delTpl">Excluir template</button>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="tabs" id="tabs" role="group" aria-label="Categorias"></div>
  <div class="row filters">
    <select id="fLoja" aria-label="Filtrar por loja"><option value="">Todas as lojas</option><option value="amazon">Amazon</option><option value="ml">Mercado Livre</option></select>
    <select id="fBusca" aria-label="Filtrar por busca"><option value="">Todas as buscas</option></select>
    <select id="fOrdem" aria-label="Ordenar por"><option value="">Ordem de coleta</option><option value="desc">Maior desconto</option><option value="preco">Menor preço</option></select>
    <input type="search" id="fTexto" aria-label="Filtrar pelo título" placeholder="Filtrar pelo título">
  </div>
  <div class="pager row"></div>
  <div class="grid" id="grid"></div>
  <div class="pager row bottom"></div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite">Copiado!</div>

<script>
const DEFAULT_TEMPLATES = {"Template 1": "*{TITULO_PRODUTO}*\n\n😱 De ~{PRECO_ANTIGO}~\n🔥 Por *{PRECO_PRODUTO}*\n({DESCONTO_PRODUTO} OFF)\n⭐ {NUMERO_VENDAS}\n🚚 {FRETE}\n🎫 Cupom: *{CUPOM}*\n\n🛒 Compre aqui: {LINK}", "Template 2": "⚡ *OFERTA RELÂMPAGO* ⚡\n\n*{TITULO_PRODUTO}*\n🔥 *{PRECO_PRODUTO}*\n💥 {DESCONTO_PRODUTO} OFF\n\n🛒 {LINK}", "Template 3": "🎫 *USE O CUPOM: {CUPOM}*\n\n*{TITULO_PRODUTO}*\n😱 De ~{PRECO_ANTIGO}~\n🔥 Por *{PRECO_PRODUTO}*\n💥 {DESCONTO_PRODUTO} OFF\n\n🛒 Compre aqui: {LINK}", "Template 4": "*{TITULO_PRODUTO}*\n\n😱 De ~{PRECO_ANTIGO}~\n🔥 Por *{PRECO_PRODUTO}*\n💥 {DESCONTO_PRODUTO} OFF\n⭐ {NUMERO_VENDAS}\n🚚 {FRETE}\n🎫 Cupom: *{CUPOM}*\n\n🛒 Compre aqui: {LINK}\n\n⏳ Preço e estoque podem mudar a qualquer momento"};
const LOJA = {amazon:'Amazon', ml:'Mercado Livre'};
// Textos do botão "Copiar imagem" (usados em copiarImagem)
const TXT_IMG = {
  botao:'Copiar imagem',
  carregando:'Copiando…',
  ok:'✓ Imagem copiada',
  toastOk:'Imagem copiada! Cole no WhatsApp e volte para copiar a mensagem.',
  toastLegenda:'Mensagem copiada! Cole como legenda da imagem.',
  semFoto:'Este produto não tem foto. Abra na loja e copie a imagem de lá, se quiser enviar com foto.',
  rede:'Não consegui baixar a foto. Confira a internet e tente de novo; se repetir, abra na loja e copie a imagem de lá.',
  indisponivel:'Esta foto não está mais disponível na loja. Abra na loja e copie a imagem de lá.',
  bloqueado:'O Chrome não deixou copiar a imagem. Clique na página e tente de novo; se repetir, clique no cadeado ao lado do endereço e permita a área de transferência.',
  semSuporte:'Este navegador não copia imagens. Use o Chrome.'
};
const $ = s=>document.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// O tempo na tela acompanha o tamanho do texto; um aviso novo cancela o timer do anterior, para não ser apagado por ele
let toastTimer;
const toast = m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),Math.max(1300,String(m).length*50));};
const api = async(path, method='GET', body)=>{ const r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined}); return r.json(); };

let items=[], templates=DEFAULT_TEMPLATES, current='Template 1';
let activeCat = localStorage.getItem('activeCat') || '';
let page=1;
const cats = ()=>[...new Set(items.map(i=>i.cat))];
const num = p=>parseFloat(String(p||'').replace(/[^\d,]/g,'').replace(',','.'))||0;
const pct = d=>parseInt(String(d||'').replace(/\D/g,''))||0;

function buildMsg(it){
  const d = it.data || {};
  const map = {
    '{LINK}': it.url, '{LOJA}': LOJA[it.loja]||'',
    '{TITULO_PRODUTO}': d.titulo || '',
    '{PRECO_PRODUTO}': d.preco || '',
    '{PRECO_ANTIGO}': d.preco_antigo || '',
    '{DESCONTO_PRODUTO}': d.desconto ? d.desconto.replace('-','') : '',
    '{NUMERO_VENDAS}': d.vendas || (d.num_avaliacoes ? d.num_avaliacoes+' avaliações' : '') || d.avaliacao || '',
    '{FRETE}': d.frete || '',
    '{CUPOM}': d.cupom || '',
  };
  // linhas cujo campo está vazio somem da mensagem
  const linhas = templates[current].split('\n').filter(l=>!Object.entries(map).some(([k,v])=>l.includes(k) && !v));
  let s = linhas.join('\n').replace(/\n{3,}/g,'\n\n');
  for (const [k,v] of Object.entries(map)) s = s.replaceAll(k, v);
  return s.trim();
}

async function fetchItem(it, card){
  const st = card.querySelector('.status'); const btn = card.querySelector('.fetch');
  btn.disabled = true; st.className='status'; st.textContent='Buscando na Amazon...';
  try{
    const d = await api('fetch?url='+encodeURIComponent(it.url));
    if (d.error) throw new Error(d.error);
    if (d.captcha || !d.titulo) throw new Error('Amazon bloqueou (captcha) ou não achou o título. Tente mais tarde.');
    Object.assign(it, await api('items/'+it.id,'PATCH',{data:d}));
    renderCard(card, it); toast('Dados atualizados');
  }catch(e){ st.className='status err'; st.textContent='Erro: '+e.message; btn.disabled=false; }
}

// "Copiar imagem": baixa a foto do CDN da loja (CORS, sem cookies), converte para PNG e põe na área de transferência.
// Só aceita os hosts abaixo, para uma URL forjada no banco não virar requisição a outro lugar.
const HOSTS_FOTO = ['m.media-amazon.com', 'http2.mlstatic.com'];
const falhaFoto = motivo=>Object.assign(new Error(motivo), {motivo});

// Amazon: pede a versão de até 1000 px trocando o sufixo `._<mods>_.<ext>`. Outros hosts ficam como estão.
function urlFotoParaCopiar(url){
  const s = String(url ?? '');
  let host;
  try{ host = new URL(s).hostname; }catch{ return s; }
  if (host !== 'm.media-amazon.com') return s;
  return s.replace(/\._[^/]*_\.(jpe?g|png|webp)$/i, '._AC_SL1000_.$1');
}

async function baixarComoPng(u){
  let p;
  try{ p = new URL(u); }catch{ throw falhaFoto('indisponivel'); }
  if (p.protocol !== 'https:' || !HOSTS_FOTO.includes(p.hostname)) throw falhaFoto('indisponivel');
  let r, blob;
  try{
    r = await fetch(p.href, {mode:'cors', credentials:'omit', signal: AbortSignal.timeout(15000)});
  }catch{ throw falhaFoto('rede'); }   // TypeError (rede/CORS), AbortError ou TimeoutError
  // A lista de hosts vale também para o destino final, depois de redirecionamentos.
  // r.url só vem vazio em Response montada no próprio JS (stub de teste); resposta de rede sempre traz a URL.
  const destino = String(r.url || '');
  if (destino){
    let f;
    try{ f = new URL(destino); }catch{ throw falhaFoto('indisponivel'); }
    if (f.protocol !== 'https:' || !HOSTS_FOTO.includes(f.hostname)) throw falhaFoto('indisponivel');
  }
  // O ML redireciona foto inexistente para um gif "não disponível" que responde 200
  if (!r.ok || destino.includes('/img-not-available/')) throw falhaFoto('indisponivel');
  if (!/^image\//i.test(r.headers.get('content-type')||'')) throw falhaFoto('indisponivel');
  try{ blob = await r.blob(); }catch{ throw falhaFoto('rede'); }
  let bmp;
  try{ bmp = await createImageBitmap(blob); }catch{ throw falhaFoto('indisponivel'); }
  const cv = document.createElement('canvas');
  cv.width = bmp.width; cv.height = bmp.height;
  const ctx = cv.getContext('2d');
  // Fundo branco (o mesmo de --fundo-imagem): sem ele, a transparência vira preto quando o WhatsApp converte para JPEG
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(bmp, 0, 0); bmp.close();
  const png = await new Promise(ok=>cv.toBlob(ok, 'image/png'));
  if (!png) throw falhaFoto('indisponivel');
  return png;
}

// Promise<Blob image/png>; em erro, e.motivo é 'rede' ou 'indisponivel'
async function fotoComoPng(url){
  const maior = urlFotoParaCopiar(url);
  try{ return await baixarComoPng(maior); }
  catch(e){
    if (e.motivo === 'indisponivel' && maior !== url) return baixarComoPng(url);
    throw e;
  }
}

async function copiarImagem(it, card, btn){
  const st = card.querySelector('.status');
  const erro = texto=>{ st.className='status err'; st.textContent=texto; };
  if (!it.data?.imagem){ erro(TXT_IMG.semFoto); return; }
  if (btn.getAttribute('aria-busy') === 'true') return;   // evita o clique duplo
  if (!navigator.clipboard?.write || typeof window.ClipboardItem !== 'function'){ erro('Erro: '+TXT_IMG.semSuporte); return; }
  // O nome acessível começa pelo texto visível em cada estado (WCAG 2.5.3); sem título, o botão não tem aria-label
  const titulo = it.data.titulo;
  const rotulo = (texto, ligacao)=>{ if (titulo) btn.setAttribute('aria-label', texto+ligacao+titulo); };
  btn.setAttribute('aria-busy','true'); btn.setAttribute('aria-disabled','true');
  btn.removeAttribute('data-estado'); btn.textContent = TXT_IMG.carregando; rotulo(TXT_IMG.carregando, ': ');
  st.className='status'; st.textContent='';
  // O write é chamado já no clique, com a Promise dentro do ClipboardItem, para o Chrome não perder o gesto do usuário
  const png = fotoComoPng(it.data.imagem);
  png.catch(()=>{});   // o motivo é lido no catch abaixo; isto só evita o aviso de rejeição não tratada
  try{
    await navigator.clipboard.write([new ClipboardItem({'image/png': png})]);
    btn.setAttribute('data-estado','copiada'); btn.textContent = TXT_IMG.ok; rotulo(TXT_IMG.ok, ': ');
    card.classList.add('img-done'); toast(TXT_IMG.toastOk);
  }catch(e){
    // Vale o motivo da nossa Promise; o write devolve um erro genérico quando ela falha
    const motivo = (await png.then(()=>null, er=>er?.motivo || 'rede')) ?? (e?.name === 'NotAllowedError' ? 'bloqueado' : 'rede');
    btn.textContent = TXT_IMG.botao; rotulo(TXT_IMG.botao, ' de ');
    erro('Erro: '+(TXT_IMG[motivo] || TXT_IMG.rede));
  }finally{
    btn.removeAttribute('aria-busy'); btn.removeAttribute('aria-disabled');
  }
}

function renderCard(card, it){
  const d = it.data;
  const meta = d ? [d.avaliacao, d.num_avaliacoes, d.vendas].filter(Boolean).map(esc).join(' · ') : '';
  const rotImg = d&&d.titulo ? ` aria-label="Copiar imagem de ${esc(d.titulo)}"` : '';
  card.innerHTML = `
    <div class="top"><span class="badge ${esc(it.loja)}">${esc(LOJA[it.loja]||it.loja)}</span><span class="busca" title="${esc(it.busca)}">${esc(it.busca)}</span><span class="feito" aria-hidden="true">✓ Mensagem copiada</span></div>
    ${d ? `<div class="info">${d.imagem?`<img loading="lazy" alt="" src="${esc(d.imagem)}">`:''}<div class="t"><h2 class="name" title="${esc(d.titulo)}">${esc(d.titulo)}</h2><div class="price"><span class="now">${esc(d.preco)}</span>${d.preco_antigo?'<s class="old"><span class="sr">Preço antigo </span>'+esc(d.preco_antigo)+'</s>':''}${d.desconto?'<span class="off">'+esc(d.desconto)+'</span>':''}</div>${meta?'<div class="meta">'+meta+'</div>':''}</div></div>` : ''}
    <textarea aria-label="Mensagem para copiar"></textarea>
    <div class="status" role="status"></div>
    <div class="actions">
      <button class="cta copy">Copiar</button>
      ${d&&d.imagem
        ? `<button type="button" class="secondary copyimg"${rotImg}>${TXT_IMG.botao}</button>`
        : `<button type="button" class="secondary copyimg" aria-disabled="true" aria-describedby="semfoto-${esc(it.id)}"${rotImg}>${TXT_IMG.botao}</button><span class="sr" id="semfoto-${esc(it.id)}">${TXT_IMG.semFoto}</span>`}
      <button class="ghost open">Abrir na loja</button>
      <details class="more">
        <summary>Mais ações</summary>
        <div class="rare">
          ${it.loja==='amazon'?'<button class="secondary fetch">Atualizar preço</button>':''}
          <button class="secondary reset">Recarregar</button>
          <label class="lbl">Mover para <select class="mv">${cats().map(c=>`<option ${c===it.cat?'selected':''}>${esc(c)}</option>`).join('')}<option value="__new">+ nova...</option></select></label>
          <button class="danger del">Excluir</button>
        </div>
      </details>
    </div>`;
  const ta = card.querySelector('textarea'); ta.value = buildMsg(it);
  card.querySelector('.copy').onclick = async()=>{ await navigator.clipboard.writeText(ta.value); card.classList.add('done'); toast(card.classList.contains('img-done') ? TXT_IMG.toastLegenda : 'Mensagem copiada!'); };
  const ci = card.querySelector('.copyimg'); ci.onclick = ()=>copiarImagem(it, card, ci);
  const f = card.querySelector('.fetch'); if(f) f.onclick = ()=>fetchItem(it, card);
  card.querySelector('.open').onclick = ()=>window.open(it.url, '_blank');
  card.querySelector('.reset').onclick = ()=>{ ta.value = buildMsg(it); };
  card.querySelector('.del').onclick = async()=>{ await api('items/'+it.id,'DELETE'); items.splice(items.indexOf(it),1); render(); };
  card.querySelector('.mv').onchange = async e=>{ let c=e.target.value; if(c==='__new'){ c=prompt('Nome da nova categoria:'); if(!c){render();return;} } c=c.trim(); await api('items/'+it.id,'PATCH',{cat:c}); it.cat=c; render(); };
}

function filtrada(){
  const loja=$('#fLoja').value, busca=$('#fBusca').value, txt=$('#fTexto').value.trim().toLowerCase(), ordem=$('#fOrdem').value;
  let l = items.filter(i=>i.cat===activeCat && (!loja||i.loja===loja) && (!busca||i.busca===busca) && (!txt||(i.data&&i.data.titulo||'').toLowerCase().includes(txt)));
  if(ordem==='desc') l=[...l].sort((a,b)=>pct(b.data&&b.data.desconto)-pct(a.data&&a.data.desconto));
  if(ordem==='preco') l=[...l].sort((a,b)=>(num(a.data&&a.data.preco)||1e12)-(num(b.data&&b.data.preco)||1e12));
  return l;
}

function render(){
  const cs = cats(); if(!cs.includes(activeCat)) activeCat = cs[0] || '';
  localStorage.setItem('activeCat', activeCat);
  $('#tabs').innerHTML = cs.map(c=>`<button type="button" class="tab ${c===activeCat?'active':''}" data-c="${esc(c)}" aria-pressed="${c===activeCat}">${esc(c)} <span class="muted">${items.filter(i=>i.cat===c).length}</span></button>`).join('');
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{activeCat=t.dataset.c; page=1; $('#fBusca').value=''; render();});
  const buscas=[...new Set(items.filter(i=>i.cat===activeCat).map(i=>i.busca).filter(Boolean))];
  const bsel=$('#fBusca'), bval=bsel.value;
  bsel.innerHTML='<option value="">Todas as buscas ('+buscas.length+')</option>'+buscas.map(b=>`<option ${b===bval?'selected':''}>${esc(b)}</option>`).join('');
  const list = filtrada();
  $('#count').textContent = items.length+' itens no total · '+items.filter(i=>i.loja==='amazon').length+' Amazon · '+items.filter(i=>i.loja==='ml').length+' Mercado Livre';
  const PAGE=24, pages=Math.max(1,Math.ceil(list.length/PAGE));
  if(page>pages) page=pages; if(page<1) page=1;
  const pagerHtml = pages>1 ? `<button class="secondary pg" data-p="1" ${page===1?'disabled':''}>« Primeira</button><button class="secondary pg" data-p="${page-1}" ${page===1?'disabled':''}>‹ Anterior</button><span class="muted">Página ${page} de ${pages} · ${list.length} itens</span><button class="secondary pg" data-p="${page+1}" ${page===pages?'disabled':''}>Próxima ›</button><button class="secondary pg" data-p="${pages}" ${page===pages?'disabled':''}>Última »</button>` : `<span class="muted">${list.length} itens</span>`;
  document.querySelectorAll('.pager').forEach(el=>{ el.innerHTML=pagerHtml; el.querySelectorAll('.pg').forEach(b=>b.onclick=()=>{page=+b.dataset.p; render(); window.scrollTo({top:0,behavior:'smooth'});}); });
  const grid=$('#grid'); grid.innerHTML='';
  list.slice((page-1)*PAGE, page*PAGE).forEach(it=>{ const c=document.createElement('div'); c.className='card'; renderCard(c,it); grid.appendChild(c); });
  $('#addCat').innerHTML = cs.map(c=>`<option ${c===activeCat?'selected':''}>${esc(c)}</option>`).join('');
}
['#fLoja','#fBusca','#fOrdem'].forEach(s=>$(s).onchange=()=>{page=1;render();});
$('#fTexto').oninput=()=>{page=1;render();};

function fillSelect(){
  const sel=$('#tplSelect'); sel.innerHTML='';
  for(const n of Object.keys(templates)){const o=document.createElement('option');o.value=o.textContent=n;sel.appendChild(o);}
  if(!templates[current]) current=Object.keys(templates)[0]; sel.value=current;
}
const saveTemplates=()=>Promise.all([api('config/templates','PUT',templates), api('config/currentTpl','PUT',current)]);
$('#tplSelect').onchange=e=>{current=e.target.value;api('config/currentTpl','PUT',current);render();};
$('#btnTpl').onclick=()=>{$('#addBox').classList.remove('open');$('#tplBox').classList.toggle('open');$('#tplName').value=current;$('#tplText').value=templates[current];};
$('#btnAdd').onclick=()=>{$('#tplBox').classList.remove('open');$('#addBox').classList.toggle('open');};
$('#saveTpl').onclick=async()=>{const n=$('#tplName').value.trim();if(!n)return;templates[n]=$('#tplText').value;current=n;await saveTemplates();fillSelect();render();toast('Template salvo');};
$('#delTpl').onclick=async()=>{const n=$('#tplName').value.trim();if(Object.keys(templates).length<=1)return;delete templates[n];current=Object.keys(templates)[0];await saveTemplates();fillSelect();render();$('#tplBox').classList.remove('open');};

$('#saveLinks').onclick=async()=>{
  const cat = ($('#addCatNew').value.trim() || $('#addCat').value || 'Geral');
  const found=[...$('#addLinks').value.matchAll(/https?:\/\/\S+/g)].map(m=>m[0].replace(/[.,);]+$/,''));
  const novos=found.map(u=>({url:u, cat, loja:/mercadoli|meli\.la/.test(u)?'ml':'amazon', item_id:u}));
  const r=await api('items','POST',{items:novos});
  items=await api('items'); activeCat=cat; $('#addLinks').value=''; $('#addCatNew').value=''; render(); toast(r.inserido+' links adicionados em "'+cat+'"');
};
$('#btnCopyAll').onclick=async()=>{const all=[...document.querySelectorAll('.card textarea')].map(t=>t.value).join('\n\n----------\n\n');await navigator.clipboard.writeText(all);toast('Copiadas!');};

(async()=>{
  const [it, tp, cur] = await Promise.all([api('items'), api('config/templates'), api('config/currentTpl')]);
  items = it; if(tp) templates = tp; if(cur && templates[cur]) current = cur;
  fillSelect(); render();
})();
</script>
</body>
