<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etiqueta</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='894 247 92 92'%3E%3Cpath fill='%23FF5B14' fill-rule='evenodd' d='M978 263a4 4 0 0 1 4 4V320a4 4 0 0 1-4 4H923L900 296a3 3 0 0 1 0-5L922 263.5Q923 263 925 263ZM921 287.5a5.5 5.5 0 1 0 .01 0Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Tokens da identidade visual (Papel, Superfície, Linha, Mudo, Tinta, Etiqueta) */
  :root{
    color-scheme:light dark;
    --papel:#F7F7F5;--superficie:#FFFFFF;--linha:#E4E4E0;--linha-campo:#6B6B66;--sobre-etiqueta:#111110;--fundo-imagem:#FFFFFF;--mudo:#6B6B66;--tinta:#111110;
    --etiqueta:#FF5B14;--etiqueta-escura:#C2410C;--etiqueta-clara:#FFEDE3;
    --enviado:#15803D;--falhou:#B91C1C;
    --sobre-tinta:#F7F7F5;      /* texto sobre botão Tinta */
    --foco:#C2410C;             /* anel de foco (Etiqueta escura: 4,8:1 sobre Papel) */
    --sombra:0 8px 24px rgba(17,17,16,.18);
    --veu:rgba(17,17,16,.55);   /* fundo atrás de diálogos */
    --font:'Geist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    /* escala tipográfica */
    --t-titulo:600 24px/32px var(--font);
    --t-subtitulo:500 17px/24px var(--font);
    --t-corpo:400 15px/22px var(--font);
    --t-legenda:400 13px/18px var(--font);
    --t-rotulo:500 12px/16px var(--font);
    --t-valor:500 28px/32px var(--mono);--t-valor-letra:-.02em;--t-mono-p:400 13px/18px var(--mono);--t-mono-m:500 14px/20px var(--mono);
    /* escala de espaçamento */
    --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
    --r-sm:6px;--r:10px;--r-lg:14px;--r-pill:999px;
    --alvo:36px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --papel:#121211;--superficie:#1B1B19;--linha:#2C2C29;--linha-campo:#9A9A94;--mudo:#9A9A94;--tinta:#EDEDEA;
      --etiqueta:#FF6A2B;--etiqueta-escura:#FF6A2B;--etiqueta-clara:#3A2216;
      --enviado:#3FB86A;--falhou:#F0625F;
      --sobre-tinta:#121211;--foco:#FF6A2B;--sombra:0 8px 24px rgba(0,0,0,.5);--veu:rgba(0,0,0,.7);
    }
  }
  @media (pointer:coarse){:root{--alvo:44px}}
  *{box-sizing:border-box}
  body{margin:0;font:var(--t-corpo);background:var(--papel);color:var(--tinta);-webkit-font-smoothing:antialiased}
  :focus-visible{outline:2px solid var(--foco);outline-offset:2px}
  header{position:sticky;top:0;background:var(--papel);border-bottom:1px solid var(--linha);padding:var(--s3) var(--s4);z-index:5;max-height:100dvh;overflow:auto}
  .row{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center;max-width:1200px;margin:0 auto}
  .bar{justify-content:space-between}
  .bar .grp{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
  #btnVoltarCab{display:none;align-items:center}
  h1{font:var(--t-subtitulo);font-weight:600;margin:0}
  h1 .logo{display:block;height:28px;width:auto;overflow:visible}
  h1 .logo .tag{fill:var(--etiqueta)}
  .muted{color:var(--mudo);font:var(--t-legenda)}
  .nb{white-space:nowrap}
  select,input,button,textarea{font:inherit}
  select,input[type=text],input[type=search]{background:var(--superficie);color:var(--tinta);border:1px solid var(--linha-campo);border-radius:var(--r);padding:0 var(--s3);min-height:var(--alvo)}
  select{max-width:100%}
  input::placeholder,textarea::placeholder{color:var(--mudo);opacity:1}
  .lbl{display:flex;align-items:center;gap:var(--s2);font:var(--t-rotulo);letter-spacing:.06em;text-transform:uppercase;color:var(--mudo)}
  .lbl select{font:var(--t-corpo);letter-spacing:0;text-transform:none;color:var(--tinta)}
  /* Botões: padrão = Tinta; .cta = Etiqueta (única ação principal); .secondary = contorno; .ghost = discreto */
  button{background:var(--tinta);color:var(--sobre-tinta);border:1px solid transparent;border-radius:var(--r);padding:0 var(--s4);min-height:var(--alvo);font-weight:500;cursor:pointer;transition:background .15s,border-color .15s}
  button:hover:not(:disabled):not([aria-disabled="true"]){opacity:.88}
  button.cta{background:var(--etiqueta);color:var(--sobre-etiqueta);font-weight:600}
  button.secondary{background:transparent;color:var(--tinta);border-color:var(--linha)}
  button.secondary:hover:not(:disabled):not([aria-disabled="true"]){opacity:1;border-color:var(--mudo)}
  button.ghost{background:transparent;color:var(--tinta)}
  button.ghost:hover:not(:disabled){opacity:1;background:var(--linha)}
  button.danger{background:transparent;color:var(--falhou)}
  button.danger:hover:not(:disabled){opacity:1;background:var(--linha)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button[aria-disabled="true"]:not(.copyimg){opacity:.45;cursor:not-allowed}
  main{max-width:1200px;margin:0 auto;padding:var(--s5) var(--s4) var(--s7)}
  /* Abas em faixas por grupo (desktop): rótulo do grupo à esquerda (144px) e as pílulas à direita; entre grupos s3, entre linhas de um mesmo grupo s2 (a linha que quebra não parece outro grupo). No celular o #tabs some e entra o #selCat. */
  .tabs{display:flex;flex-direction:column;gap:var(--s3);margin-bottom:var(--s3)}
  .tabs-grupo{display:grid;grid-template-columns:144px minmax(0,1fr);column-gap:var(--s2);align-items:start}
  .tabs-grupo>.lbl{min-height:var(--alvo)}
  .tabs-pilulas{display:flex;flex-wrap:wrap;gap:var(--s2);min-width:0}
  .sel-cat{display:none}
  .tab{display:inline-flex;align-items:center;gap:var(--s2);min-height:var(--alvo);max-width:100%;padding:0 var(--s4);border-radius:var(--r-pill);border:1px solid var(--linha);background:var(--superficie);color:var(--tinta);font-weight:400;text-align:left;overflow-wrap:anywhere}
  .tab:hover:not(:disabled){opacity:1;border-color:var(--mudo)}
  /* reserva a largura do nome em negrito: a aba ativa não alarga nem faz a faixa quebrar de outro jeito ao trocar de aba */
  .tab .nome{display:inline-flex;flex-direction:column}
  .tab .nome::after{content:attr(data-n);font-weight:600;height:0;overflow:hidden;visibility:hidden;pointer-events:none}
  .tab .muted{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .tab.active{background:var(--etiqueta-clara);border-color:var(--etiqueta-escura);font-weight:600}
  .tab.active .muted{color:var(--tinta)}
  .total{margin:0 0 var(--s3)}
  .dica-publico{margin:calc(-1*var(--s2)) 0 var(--s3);max-width:65ch;font:var(--t-legenda);color:var(--mudo)}
  .dica-publico[hidden]{display:none}
  @media (max-width:900px){
    .tabs-grupo{grid-template-columns:minmax(0,1fr);row-gap:var(--s1)}
    .tabs-grupo>.lbl{min-height:0}
  }
  /* Barra da lista: o que só afeta a mensagem dos cartões (Template, editar, copiar a página) */
  .barra-lista{margin-bottom:var(--s3);gap:var(--s2) var(--s3)}
  .barra-lista .lbl select{font:var(--t-corpo);letter-spacing:0;text-transform:none;color:var(--tinta)}
  .barra-lista #btnCopyAll{margin-left:auto}
  /* Controle "Público" (aba com gênero): segmentado e neutro, sem o acento Etiqueta. Só o essencial; o acabamento fino é do designer. */
  .seg-filtro{border:0;margin:0 0 var(--s3);padding:0;min-width:0}
  .seg-filtro legend{padding:0;margin-bottom:var(--s1);font:var(--t-rotulo);letter-spacing:.06em;text-transform:uppercase;color:var(--mudo)}
  .seg-filtro .opcoes{display:flex;flex-wrap:wrap}
  .seg-filtro label>span{line-height:20px}
  .seg-filtro label{position:relative;display:flex}
  .seg-filtro label>span{display:inline-flex;align-items:center;gap:var(--s2);min-height:var(--alvo);padding:0 var(--s3);margin-left:-1px;border:1px solid var(--linha-campo);background:var(--superficie);color:var(--tinta);cursor:pointer;user-select:none}
  .seg-filtro label:first-child>span{margin-left:0;border-radius:var(--r) 0 0 var(--r)}
  .seg-filtro label:last-child>span{border-radius:0 var(--r) var(--r) 0}
  .seg-filtro label>span:hover{border-color:var(--mudo);z-index:1}
  .seg-filtro .num{font:var(--t-mono-p);color:var(--mudo);font-variant-numeric:tabular-nums}
  .seg-filtro input:checked+span{background:var(--tinta);border-color:var(--tinta);color:var(--sobre-tinta);font-weight:600}
  .seg-filtro input:checked+span::before{content:"✓" / ""}
  .seg-filtro input:checked+span .num{color:inherit}
  .seg-filtro input:checked+span::before{flex:none}
  .seg-filtro input:focus-visible+span{outline:2px solid var(--foco);outline-offset:2px;z-index:2}
  .filters{margin-bottom:var(--s4);gap:var(--s2)}
  .filters input{flex:1;min-width:180px}
  .pager{gap:var(--s2);margin-bottom:var(--s4)}
  .pager.bottom{margin:var(--s5) auto 0}
  .pager button{min-height:32px;padding:0 var(--s3);font:var(--t-legenda);font-weight:500}
  .pager .muted{padding:0 var(--s2);font-variant-numeric:tabular-nums}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:var(--s4)}
  .card{background:var(--superficie);border:1px solid var(--linha);border-radius:var(--r-lg);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3);min-width:0}
  .card.done{border-color:var(--enviado)}
  .top{display:flex;align-items:center;gap:var(--s2);min-width:0}
  .badge{font:var(--t-rotulo);letter-spacing:.06em;text-transform:uppercase;color:var(--mudo);white-space:nowrap}
  .top>.selo-genero::before,.top>.busca:not(:empty)::before{content:"·" / "";margin-right:var(--s2)}
  .busca{font:var(--t-legenda);color:var(--mudo);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .feito{display:none;margin-left:auto;font:var(--t-rotulo);letter-spacing:.06em;text-transform:uppercase;color:var(--enviado);white-space:nowrap}
  .card.done .feito{display:inline}
  .info{display:flex;gap:var(--s3);align-items:flex-start}
  .info img{width:72px;height:72px;flex:none;object-fit:contain;background:var(--fundo-imagem);border:1px solid var(--linha);border-radius:var(--r-sm)}
  .info .t{flex:1;min-width:0}
  .name{font:var(--t-subtitulo);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
  .price{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--s1) var(--s2);margin-top:var(--s1);font-family:var(--mono);font-variant-numeric:tabular-nums}
  .price .now{font:var(--t-valor);letter-spacing:var(--t-valor-letra);font-variant-numeric:tabular-nums}
  .price .old{color:var(--mudo);font:var(--t-mono-p)}
  .price .off{color:var(--etiqueta-escura);font:var(--t-mono-m)}
  .meta{font:var(--t-legenda);color:var(--mudo);margin-top:var(--s1)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  textarea{width:100%;min-height:132px;resize:vertical;background:var(--papel);color:var(--tinta);border:1px solid var(--linha-campo);border-radius:var(--r);padding:var(--s3);white-space:pre-wrap;line-height:22px}
  .card textarea{flex:1 0 auto}
  textarea:focus-visible,input:focus-visible,select:focus-visible{outline-offset:0;border-color:var(--foco)}
  .actions{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}
  .card .actions .copy{flex:1 1 96px}
  .copyimg{white-space:nowrap;min-width:calc(14ch + 2*var(--s4))}
  .copyimg[data-estado="copiada"]{color:var(--enviado)}
  .copyimg[aria-disabled="true"]:not([aria-busy="true"]){opacity:.45;cursor:not-allowed}
  .copyimg[aria-busy="true"]{cursor:progress}
  .more{margin-left:auto}
  .more[open]{flex-basis:100%;margin-left:0}
  .more summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:var(--s1);min-height:var(--alvo);padding:0 var(--s3);border-radius:var(--r);font:var(--t-legenda);font-weight:500;color:var(--mudo)}
  .more summary::-webkit-details-marker{display:none}
  .more summary::after{content:"▾" / "";font-size:11px}
  .more[open] summary::after{content:"▴" / ""}
  .more summary:hover{background:var(--linha);color:var(--tinta)}
  .more .rare{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2);padding-top:var(--s2);border-top:1px solid var(--linha);margin-top:var(--s1)}
  .more .rare .lbl{display:grid;grid-template-columns:88px minmax(0,1fr);width:100%;margin-left:0}
  .more .rare select:disabled{opacity:.6;cursor:progress}
  .gen-msg{flex:1 0 100%;margin:0;font:var(--t-legenda);color:var(--mudo)}
  .gen-msg:empty{position:absolute}
  .gen-msg.err{color:var(--falhou)}
  .card .status:not(:empty){font:var(--t-corpo);overflow-wrap:anywhere}
  .box{display:none;max-width:1200px;margin:var(--s3) auto 0;background:var(--superficie);border:1px solid var(--linha);border-radius:var(--r-lg);padding:var(--s4)}
  .box.open{display:block}
  .box textarea{min-height:140px}
  .box .stack{display:flex;flex-direction:column;gap:var(--s3)}
  .box .help{font:var(--t-legenda);color:var(--mudo);font-family:var(--mono);overflow-wrap:anywhere}
  .status{font:var(--t-legenda);color:var(--mudo)}
  .status:empty{position:absolute}
  .status.err{color:var(--falhou)}
  .toast{position:fixed;bottom:var(--s5);left:50%;transform:translateX(-50%);background:var(--tinta);color:var(--sobre-tinta);padding:var(--s3) var(--s5);border-radius:var(--r-pill);font-weight:500;box-shadow:var(--sombra);opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:calc(100vw - 32px)}
  .toast.show{opacity:1}
  @media (max-width:600px){
    header{position:static;max-height:none;overflow:visible;padding:var(--s3)}
    main{padding:var(--s4) var(--s3) var(--s6)}
    .bar .grp{width:100%}
    .bar .grp button{flex:1 1 0;min-height:44px;padding:0 var(--s2)}
    /* 17 abas no celular: as faixas saem e entra o seletor "Categoria" (44px, largura total, nome do grupo no optgroup) */
    .tabs{display:none}
    .sel-cat{display:block;margin-bottom:var(--s2)}
    .sel-cat .lbl{margin-bottom:var(--s1)}
    .sel-cat select{width:100%;min-height:44px;font-size:16px;text-overflow:ellipsis}
    .more .rare .lbl{grid-template-columns:minmax(0,1fr);gap:var(--s1)}
    .barra-lista .lbl{width:100%}
    .barra-lista .lbl select{flex:1;min-height:44px}
    .barra-lista button{flex:1 1 0;min-height:44px;padding:0 var(--s2)}
    .barra-lista #btnCopyAll{margin-left:0}
    .seg-filtro .opcoes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2)}
    .seg-filtro label:last-child:nth-child(odd){grid-column:1/-1}
    .seg-filtro label>span,.seg-filtro label:first-child>span,.seg-filtro label:last-child>span{width:100%;margin-left:0;border-radius:var(--r);justify-content:flex-start;gap:var(--s1);padding:0 var(--s2);min-height:44px}
    .seg-filtro .num{margin-left:auto}
  }

  /* ---- Tela "Disparo automático" (regras, fila, histórico, números). Só tokens existentes. ---- */
  .dsp{max-width:720px;margin:0 auto}
  .dsp h2{font:var(--t-titulo);margin:0}
  .dsp h2:focus-visible,.dsp h3[tabindex]:focus-visible{outline-width:1px;outline-offset:6px;border-radius:var(--r-sm)}
  .dsp h3{font:var(--t-subtitulo);margin:0}
  .dsp p{margin:0}
  .dsp a{color:var(--tinta)}
  .dsp .voltar{display:inline-flex;align-items:center;min-height:var(--alvo);margin-bottom:var(--s3);font:var(--t-legenda);font-weight:500;color:var(--mudo)}
  .dsp .voltar:hover{color:var(--tinta)}
  .dtopo{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:flex-start;justify-content:space-between;margin-bottom:var(--s4)}
  .dtopo>div{flex:1 1 280px;display:flex;flex-direction:column;gap:var(--s1)}
  .dnav{display:flex;flex-wrap:wrap;gap:var(--s2);margin-bottom:var(--s5)}
  .dtab{display:inline-flex;align-items:center;min-height:var(--alvo);padding:0 var(--s4);border-radius:var(--r-pill);border:1px solid var(--linha);background:var(--superficie);color:var(--tinta);text-decoration:none}
  .dtab:hover{border-color:var(--mudo)}
  .dtab[aria-current="page"]{background:var(--etiqueta-clara);border-color:var(--etiqueta-escura);font-weight:600}
  .dsec{margin-bottom:var(--s6)}
  .dsec>h3{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--s2);margin-bottom:var(--s3)}
  .dsec.vazia{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--s2);margin-bottom:var(--s4)}
  .dsec.vazia>h3{margin:0}
  .dlista{display:flex;flex-direction:column;gap:var(--s3)}
  .dcard{background:var(--superficie);border:1px solid var(--linha);border-radius:var(--r-lg);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s2);min-width:0}
  .dcard.done{border-color:var(--enviado)}
  .dcard.pausada .name{color:var(--mudo)}
  .dcard .linha1{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:var(--s2)}
  .dcard .linha1 .name{flex:1 1 200px}
  .dcard .mono{font:var(--t-mono-p);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
  .dcard .meta{margin-top:0}
  .dcard .fhead{display:flex;flex-direction:column;gap:var(--s1);min-width:0}
  .dcard .fnome{white-space:normal;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0}
  .dcard .fsub{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s2);min-width:0}
  .dcard .fsub .busca{white-space:normal;overflow-wrap:anywhere;overflow:visible}
  .dcard .aviso{font:var(--t-legenda);color:var(--falhou)}
  .dcard .info img{width:72px;height:72px}
  .dcard textarea{min-height:140px}
  .estado{font:var(--t-rotulo);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;color:var(--mudo)}
  .estado.ok{color:var(--enviado)}
  .estado.ruim{color:var(--falhou)}
  .vazio{background:var(--superficie);border:1px dashed var(--linha-campo);border-radius:var(--r-lg);padding:var(--s5);display:flex;flex-direction:column;gap:var(--s3);align-items:flex-start}
  /* Estados da lista de ofertas (carregando, erro, sem resultado). Sem dados, só o bloco do estado aparece; a altura mínima evita o salto quando a lista chega. */
  #estadoLista:empty{display:none}
  #estadoLista .vazio{min-height:144px;justify-content:center}
  #telaOfertas.sem-dados>:not(#estadoLista):not(#anuncioLista):not(#quadroPrecos[open]){display:none}
  #telaOfertas.aba-vazia>:is(.filters,.barra-lista,.pager,#publicoBox,#grid){display:none}
  .dsp fieldset{border:1px solid var(--linha);border-radius:var(--r-lg);padding:var(--s4);margin:0 0 var(--s4);min-width:0;background:var(--superficie)}
  .dsp legend{font:var(--t-subtitulo);padding:0 var(--s2)}
  .dsp .ajuda{font:var(--t-legenda);color:var(--mudo);margin-bottom:var(--s3)}
  .campo{display:flex;flex-direction:column;gap:var(--s1);margin-bottom:var(--s3);min-width:0}
  .campo>label,.campo .rot{font:var(--t-legenda);font-weight:500}
  .campo .ajuda{margin:0}
  .dsp input[type=number],.dsp input[type=time]{background:var(--superficie);color:var(--tinta);border:1px solid var(--linha-campo);border-radius:var(--r);padding:0 var(--s3);min-height:var(--alvo);max-width:100%}
  .dsp input[type=number]{width:8em}
  .dsp select{min-width:0}
  .dsp [aria-invalid="true"]{border-color:var(--falhou)}
  .erro-campo{font:var(--t-legenda);color:var(--falhou)}
  .erro-campo:empty{display:none}
  .resumo-erros{border:1px solid var(--falhou);border-radius:var(--r-lg);padding:var(--s4);margin-bottom:var(--s4);display:flex;flex-direction:column;gap:var(--s2);background:var(--superficie)}
  .resumo-erros:empty{display:none}
  .resumo-erros ul{margin:0;padding-left:var(--s5)}
  button.linklike{background:none;border:0;padding:0;min-height:var(--alvo);color:var(--tinta);text-decoration:underline;font:inherit;font-weight:400;text-align:left}
  button.linklike:hover:not(:disabled){opacity:1;background:none;text-decoration-thickness:2px}
  .chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
  .chips.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}   /* 3 colunas na regra (720px): nome inteiro, sem quebrar palavra no meio */
  .chip{position:relative;display:inline-flex;min-width:0}
  .chip>span{display:inline-flex;align-items:center;gap:var(--s1);min-height:var(--alvo);padding:0 var(--s3);border:1px solid var(--linha-campo);border-radius:var(--r-pill);background:var(--superficie);color:var(--tinta);cursor:pointer;user-select:none;overflow-wrap:anywhere}
  .chip>span .num{font:var(--t-mono-p);color:var(--mudo);white-space:nowrap;flex:none}
  .chip input:checked+span{background:var(--etiqueta-clara);border-color:var(--etiqueta-escura);font-weight:600}
  .chip input:checked+span::before{content:"✓" / ""}
  .chip input:checked+span .num{color:var(--tinta)}
  .chip input:focus-visible+span{outline:2px solid var(--foco);outline-offset:2px}
  .chip input[aria-invalid="true"]+span{border-color:var(--falhou)}
  .chips.cats .chip{display:flex}
  .chips.cats .chip>span{width:100%;border-radius:var(--r);padding:var(--s2) var(--s3);justify-content:flex-start;overflow-wrap:anywhere;min-width:0}
  .chips.cats .chip>span .num{margin-left:auto}
  .atalhos{display:flex;flex-wrap:wrap;gap:var(--s4);margin-top:var(--s2)}
  /* categorias da regra em grupos: o fieldset de dentro não repete o cartão do fieldset da seção */
  .dsp fieldset.grupo-cats{border:0;border-radius:0;padding:0;margin:0 0 var(--s4);background:none}
  .dsp fieldset.grupo-cats legend{font:var(--t-rotulo);letter-spacing:.06em;text-transform:uppercase;color:var(--mudo);padding:0;margin-bottom:var(--s2)}
  .grupos-cats{margin-top:var(--s2)}
  .grupo-cats button.secondary{margin-top:var(--s2);padding:0 var(--s3);font:var(--t-legenda);font-weight:500}
  .horarios{list-style:none;margin:0 0 var(--s2);padding:0;display:flex;flex-direction:column;gap:var(--s2)}
  .horarios li{display:flex;gap:var(--s2);align-items:center}
  .resumo{font:var(--t-legenda);color:var(--mudo);margin-top:var(--s2)}
  .resumo.aviso{color:var(--falhou)}
  details.filtros{margin-bottom:var(--s3)}
  details.filtros>summary{cursor:pointer;min-height:var(--alvo);display:flex;align-items:center;gap:var(--s1);font:var(--t-legenda);font-weight:500;color:var(--mudo)}
  details.filtros>summary::after{content:"▾" / "";font-size:11px}
  details.filtros[open]>summary::after{content:"▴" / ""}
  .previa{display:flex;flex-direction:column;gap:var(--s3);margin-top:var(--s3)}
  .previa .corpo{display:flex;gap:var(--s3);align-items:flex-start}
  .previa .foto{width:96px;height:96px;flex:none;object-fit:contain;background:var(--fundo-imagem);border:1px solid var(--linha);border-radius:var(--r-sm)}
  .previa .sem-foto{width:96px;height:96px;flex:none;display:flex;align-items:center;justify-content:center;border:1px dashed var(--linha-campo);border-radius:var(--r-sm);font:var(--t-legenda);color:var(--mudo);text-align:center}

  dialog .previa .foto,dialog .previa .sem-foto{width:64px;height:64px}
  .msg{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--papel);border:1px solid var(--linha);border-radius:var(--r);padding:var(--s3);flex:1;min-width:0;margin:0;font:var(--t-corpo)}
  .barra-form{display:flex;flex-wrap:wrap;gap:var(--s2);padding-top:var(--s2)}
  dialog{background:var(--superficie);color:var(--tinta);border:1px solid var(--linha);border-radius:var(--r-lg);padding:var(--s5);width:min(92vw,460px);box-shadow:var(--sombra)}
  dialog::backdrop{background:var(--veu)}
  dialog h3{font:var(--t-subtitulo);margin:0 0 var(--s3)}
  dialog .dlg-corpo{display:flex;flex-direction:column;gap:var(--s3);margin-bottom:var(--s4)}
  dialog .dlg-corpo p{margin:0}
  dialog .actions{justify-content:flex-end}
  .htab{width:100%;border-collapse:collapse;background:var(--superficie);border:1px solid var(--linha);border-radius:var(--r-lg)}
  .htab th{font:var(--t-rotulo);letter-spacing:.06em;text-transform:uppercase;color:var(--mudo);text-align:left;padding:var(--s3);border-bottom:1px solid var(--linha)}
  .htab td{padding:var(--s3);border-bottom:1px solid var(--linha);vertical-align:top;overflow-wrap:anywhere}
  .htab tr:last-child td{border-bottom:0}
  .htab .motivo{font:var(--t-legenda);color:var(--mudo)}
  .htab .quando{white-space:nowrap}

  }
  /* ---- Preço sempre atualizado: idade no cartão, faixa da lista e quadro "Como atualizar os preços". Só tokens existentes; o acabamento fino é do designer. ---- */
  .idade-preco{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s1) var(--s2);margin-top:var(--s1);font:var(--t-legenda);color:var(--mudo)}

  .qp fieldset{margin:0;min-width:0;padding:var(--s3) var(--s4);border:1px solid var(--linha);border-radius:var(--r)}
  .qp legend{font:var(--t-legenda);font-weight:500;padding:0 var(--s2)}
  .qp .linha{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
  .qp input[type=number]{width:8em;max-width:100%;min-height:var(--alvo);padding:0 var(--s3);background:var(--superficie);color:var(--tinta);border:1px solid var(--linha-campo);border-radius:var(--r)}
  .qp [aria-invalid="true"]{border-color:var(--falhou)}
  .qp .campo>label{font:var(--t-legenda);font-weight:500}
  .qp-lojas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:var(--s3)}
  .qp-cab{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:var(--s1) var(--s2)}
  .qp-dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s1) var(--s3);margin:0}
  .qp-dl dt{font:var(--t-rotulo);letter-spacing:.06em;text-transform:uppercase;color:var(--mudo)}
  .qp-dl dd{margin:0;font:var(--t-mono-p);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
  .qp-bloco{display:flex;flex-direction:column;gap:var(--s2);padding-top:var(--s2);border-top:1px solid var(--linha)}
  .qp-bloco h4{margin:0;font:var(--t-legenda);font-weight:600}
  .qp-rot{font:var(--t-rotulo);letter-spacing:.06em;text-transform:uppercase;color:var(--mudo)}
  .qp ol{margin:0;padding-left:var(--s5);font:var(--t-legenda)}
  .cmd-linha{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:flex-start}
  .cmd-linha[hidden],.qp-dl[hidden]{display:none}
  .cmd{flex:1 1 220px;min-width:0;padding:var(--s2) var(--s3);background:var(--superficie);border:1px solid var(--linha-campo);border-radius:var(--r);font:var(--t-mono-p);white-space:pre-wrap;overflow-wrap:anywhere}
  .qp-rodape{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s3);align-items:center}
  @media (max-width:600px){
    details.quadro-precos{padding:0 var(--s3)}
    .idade-preco button,.cmd-linha button,.qp .linha button,.qp-rodape button{flex:1 1 100%;min-height:44px}
    .qp input[type=number]{flex:1 1 6em;min-height:44px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<script>
const DEFAULT_TEMPLATES = {"Template 1": "*{TITULO_PRODUTO}*\n\n😱 De ~{PRECO_ANTIGO}~\n🔥 Por *{PRECO_PRODUTO}*\n({DESCONTO_PRODUTO} OFF)\n⭐ {NUMERO_VENDAS}\n🚚 {FRETE}\n🎫 Cupom: *{CUPOM}*\n\n🛒 Compre aqui: {LINK}", "Template 2": "⚡ *OFERTA RELÂMPAGO* ⚡\n\n*{TITULO_PRODUTO}*\n🔥 *{PRECO_PRODUTO}*\n💥 {DESCONTO_PRODUTO} OFF\n\n🛒 {LINK}", "Template 3": "🎫 *USE O CUPOM: {CUPOM}*\n\n*{TITULO_PRODUTO}*\n😱 De ~{PRECO_ANTIGO}~\n🔥 Por *{PRECO_PRODUTO}*\n💥 {DESCONTO_PRODUTO} OFF\n\n🛒 Compre aqui: {LINK}", "Template 4": "*{TITULO_PRODUTO}*\n\n😱 De ~{PRECO_ANTIGO}~\n🔥 Por *{PRECO_PRODUTO}*\n💥 {DESCONTO_PRODUTO} OFF\n⭐ {NUMERO_VENDAS}\n🚚 {FRETE}\n🎫 Cupom: *{CUPOM}*\n\n🛒 Compre aqui: {LINK}\n\n⏳ Preço e estoque podem mudar a qualquer momento"};
// Lojas na ordem fixa do app (filtro, contador, resumo da regra). Nome exibido; a Shopee é rótulo neutro, sem cor.
const LOJA = {amazon:'Amazon', ml:'Mercado Livre', shopee:'Shopee'};
// Público (gênero) dos itens. ABAS_COM_GENERO espelha genero.ABAS_COM_GENERO do servidor (aba nova: mude lá e aqui) e GENEROS, genero.GENEROS.
// Fora dessas abas todo item é "sem" e nada filtra por público. Cada constante fica numa linha só: testes/test_front_constantes.py confere com o genero.py.

// ---- Preço sempre atualizado: idade do preço, faixa, filtro e quadro "Como atualizar os preços". Funções com `function` para o iframe dos testes alcançar.
// Prazo em vigor: config/preco_validade_horas (inteiro de 1 a 168; qualquer outra coisa vale 24), lido na carga e gravado pelo quadro.
const PRECO_VALIDADE = {padrao:24, min:1, max:168};
let precoValidade = PRECO_VALIDADE.padrao, validadeAviso = false;   // validadeAviso: a leitura falhou ou o valor era inválido
let estadoItens = 'carregando';   // 'carregando' | 'erro' | 'pronto': o quadro mostra isto nas contagens
const RX_PRECO_EM = /^([0-9]{4})-([0-9]{2})-([0-9]{2})T([0-9]{2}):([0-9]{2}):([0-9]{2})$/;   // o formato que o servidor grava (ISO local, sem fuso)
const doisDig = n=>String(n).padStart(2,'0');
const hhmm = d=>doisDig(d.getHours())+':'+doisDig(d.getMinutes());
const ddmm = d=>doisDig(d.getDate())+'/'+doisDig(d.getMonth()+1);
const inicioDoDia = d=>new Date(d.getFullYear(), d.getMonth(), d.getDate());
const FOLGA_FUTURO_PRECO_MS = 5*6e4;   // preco_em mais de 5 min à frente do agora conta como velho (disparo.FOLGA_FUTURO_PRECO)
// Dias do mês no calendário gregoriano, sem a regra do Date de que os anos 0 a 99 são 1900 a 1999
function diasNoMes(a, me){ const u = new Date(0); u.setUTCFullYear(a, me, 0); return u.getUTCDate(); }
// preco_em (ISO local) -> Date local, ou null se for nulo, de outro tipo, fora do formato (fuso, frações, hora 24, 99:99:99) ou com data
// impossível (2026-02-30, ano 0000): o mesmo rigor de disparo.ler_preco_em. A conferência é feita nos números, não num Date de volta,
// para a hora que o horário de verão pulou (válida no servidor) não virar inválida aqui.
function lerPrecoEm(s){
  const m = typeof s === 'string' ? RX_PRECO_EM.exec(s) : null;
  if (!m) return null;
  const [a, me, d, h, mi, se] = m.slice(1).map(Number);
  if (a < 1 || me < 1 || me > 12 || d < 1 || d > diasNoMes(a, me) || h > 23 || mi > 59 || se > 59) return null;
  const q = new Date(2000, 0, 1, h, mi, se); q.setFullYear(a, me-1, d);
  return q;
}
// Passou da validade? Nulo, malformado ou mais de 5 min no futuro conta como velho (na dúvida, o preço é velho), como disparo.preco_recente.
// `agora` entra como parâmetro para o teste.
function precoVelho(preco_em, horas=precoValidade, agora=new Date()){
  const q = lerPrecoEm(preco_em), t = new Date(agora).getTime();
  return !q || q.getTime() > t + FOLGA_FUTURO_PRECO_MS || q.getTime() < t - horas*36e5;
}
const validadeValida = v=>typeof v === 'number' && Number.isInteger(v) && v >= PRECO_VALIDADE.min && v <= PRECO_VALIDADE.max;
// Prazo a partir do texto JSON cru, como disparo.validade_horas (json.loads + int): só um inteiro escrito sem ponto nem expoente vale.
// O JSON.parse leria "48.0" e "1e2" como inteiros, e o servidor os recusa (vale 24). Devolve o número, null para o JSON null, ou NaN.
function validadeDoTexto(texto){
  const t = String(texto ?? '').trim();
  if (t === 'null') return null;
  return /^-?(?:0|[1-9][0-9]*)$/.test(t) ? Number(t) : NaN;
}
// "Preço de hoje, 14:20", "Preço de 03/11 (há 2 dias)"... relativo ao relógio do navegador; ver a tabela na spec
function textoIdadePreco(preco_em, agora=new Date()){
  const q = lerPrecoEm(preco_em), T = TXT_PRECOS;
  if (!q) return T.desconhecida;
  const a = new Date(agora);
  if (q.getTime() > a.getTime() + FOLGA_FUTURO_PRECO_MS) return T.desconhecida;   // D6: futuro é velho no precoVelho; "agora há pouco" contradiria o selo
  if (a.getTime() - q.getTime() < 36e5) return T.agoraPouco;   // menos de 1 h (e relógio um pouco adiantado)
  const dias = Math.round((inicioDoDia(a) - inicioDoDia(q)) / 864e5);
  if (dias <= 0) return T.hoje.replace('{HORA}', hhmm(q));
  if (dias === 1) return T.ontem.replace('{HORA}', hhmm(q));
  if (dias < 30) return T.diasAtras.replace('{DATA}', ddmm(q)).replace('{N}', dias);
  return T.mesAtras.replace('{DATA}', ddmm(q));
}
// "03/11/2026 às 14:20" (title do <time> e "Preço mais antigo"); vazio se preco_em não é uma data
const absoluto = q=>`${ddmm(q)}/${q.getFullYear()} às ${hhmm(q)}`;
function textoAbsolutoPreco(preco_em){
  const q = lerPrecoEm(preco_em);

}
// Só item com preço legível entra nas contagens e ganha a linha de idade: sem preço não haveria data e ele ficaria velho para sempre

// Linha de idade do cartão (logo abaixo do preço): selo "Desatualizado", o texto e, na Amazon velha, "Atualizar preço". ML e Shopee não têm botão: o quadro ensina o comando.
function htmlIdadePreco(it){

  const velho = precoVelho(it.preco_em), q = lerPrecoEm(it.preco_em), t = esc(textoIdadePreco(it.preco_em)), titulo = it.data.titulo;
  const tempo = q ? `<time datetime="${esc(it.preco_em)}" title="${esc(textoAbsolutoPreco(it.preco_em))}">${t}</time>` : `<span>${t}</span>`;
  const botao = velho && it.loja === 'amazon' ? `<button type="button" class="secondary fetch"${titulo ? ` aria-label="${esc(TXT_PRECOS.atualizarDe+' '+titulo)}"` : ''}>${esc(TXT_PRECOS.atualizar)}</button>` : '';
  return `<div class="idade-preco">${[velho ? `<span class="velho">${esc(TXT_PRECOS.desatualizado)}</span>` : '', tempo, botao].filter(Boolean).join(' ')}</div>`;
}

// Prazo: GET /api/config/preco_validade_horas, lido como texto (validadeDoTexto). Nunca rejeita: falha de rede ou valor inválido vale 24
// e levanta validadeAviso (o quadro avisa).
async function lerValidade(){
  let v = null, falhou = false;
  try{
    const r = await fetch('/api/config/preco_validade_horas');
    if (!r.ok) throw new Error('HTTP '+r.status);
    v = validadeDoTexto(await r.text());
  }catch{ falhou = true; }
  validadeAviso = falhou || (v !== null && !validadeValida(v));
  precoValidade = !falhou && validadeValida(v) ? v : PRECO_VALIDADE.padrao;
}

// Contagens de uma lista de itens: com preço, velhos (e quantos sem data), em dia e o preço mais antigo com data válida
function contarPrecos(lista, agora=new Date()){
  const c = {itens:0, velhos:0, semData:0, emDia:0, antigo:null};
  for (const i of lista){
    if (!temPreco(i)) continue;
    c.itens++;
    const q = lerPrecoEm(i.preco_em);
    if (!q) c.semData++;
    else if (!c.antigo || q < c.antigo) c.antigo = q;
    if (precoVelho(i.preco_em, precoValidade, agora)) c.velhos++; else c.emDia++;
  }
  return c;
}

// ---- Quadro "Como atualizar os preços" (<details id="quadroPrecos">). Montado uma vez; depois só mudam textos, para o foco e o que o dono digitou ficarem.
// Aspas do terminal: duas, ou simples se o nome tiver `"`, `\`, `$`, crase ou `!`. null se o nome tiver caractere de controle ou de
// formatação (\p{Cc}/\p{Cf}: quebra de linha, ESC, invisíveis, direção do texto), que não entra em comando copiável.
function aspasShell(s){
  if (/[\p{Cc}\p{Cf}]/u.test(s)) return null;
  return /^[^"\\$`!]*$/.test(s) ? '"'+s+'"' : "'"+s.replace(/'/g, "'\\''")+"'";
}
// O comando de um bloco da loja para a categoria escolhida ('' = todas); '' se o bloco exige categoria e não há, ou se o nome tem
// caractere de controle. Quem mostra o comando ainda confere se a categoria é uma das ORDEM_ABAS (comandoDoQuadro).
function comandoPrecos(loja, bloco, cat){
  if (bloco.precisaCat && !cat) return '';
  if (cat && /[\p{Cc}\p{Cf}]/u.test(cat)) return '';
  const arg = loja === 'ml' ? (cat ? '{cat: '+JSON.stringify(cat)+'}' : '{}') : (cat ? ' --cat '+aspasShell(cat) : '');
  return bloco.cmd.replace('{ARG}', ()=>arg);
}
// Comando que o quadro mostra: só para "Todas as categorias" ou uma das ORDEM_ABAS (o atualizar_precos.py recusa o resto com saída 2).
// Devolve {cmd, aviso}: sem comando, o aviso diz por quê (escolher uma categoria, ou categoria fora das abas).
function comandoDoQuadro(loja, bloco, cat){
  const T = TXT_PRECOS;
  if (!bloco.cmd.includes('{ARG}')) return {cmd:bloco.cmd, aviso:''};
  if (cat && !ORDEM_ABAS.includes(cat)) return {cmd:'', aviso:T.foraDasAbas};
  const cmd = comandoPrecos(loja, bloco, cat);
  return {cmd, aviso: cmd ? '' : !cat ? (T.escolhaCat[loja] || '') : T.foraDasAbas};
}

    '{FRETE}': d.frete || '',

  };

// Espelho de servidor.ler_preco (formato brasileiro, maior que zero): o PATCH com preço vazio ou ilegível apagaria o preço e o preco_em gravados
const RX_PRECO_BR = /^(?:[0-9]{1,3}(?:\.[0-9]{3})+(?:,[0-9]+)?|[0-9]+(?:,[0-9]+)?|[0-9]+\.[0-9]{1,2})$/, RX_PRECO_MILHAR = /^[0-9]{1,3}(?:\.[0-9]{3})+$/;
function precoLegivel(p){
  if (p == null || typeof p === 'boolean') return false;
  let t = String(p).replace(/R\$|\s/g, '');
  if (!RX_PRECO_BR.test(t)) return false;
  if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
  else if (RX_PRECO_MILHAR.test(t)) t = t.replace(/\./g, '');
  return Number(t) > 0;
}
// Mensagem de erro do servidor só aparece se já for uma frase para o dono (maiúscula no começo, ponto no fim); o resto vira o texto padrão
const fraseDoServidor = m=>typeof m === 'string' && m.length <= 200 && /^\p{Lu}.*\.$/su.test(m) ? m : TXT_PRECOS.atualizarFalhou;
// "Atualizar preço" (Amazon): busca a página, grava pelo PATCH (o servidor carimba preco_em) e redesenha o cartão. O resultado vai em .idade-msg, logo abaixo da linha de idade.
// Página de outro produto (asin diferente) ou sem preço legível: não grava nada, para não trocar os dados nem apagar o preço que já estava.
async function fetchItem(it, card){
  const btn = card.querySelector('.fetch'), msg = card.querySelector('.idade-msg'), T = TXT_PRECOS;
  if (!btn || btn.getAttribute('aria-busy') === 'true') return;   // evita o clique duplo
  const rotulo = btn.textContent, tinhaFoco = document.activeElement === btn;
  const dizer = (t, erro=false)=>{ msg.className = 'idade-msg'+(erro ? ' err' : ''); msg.textContent = t; };
  const falha = t=>Object.assign(new Error(t), {pronta:true});
  btn.setAttribute('aria-busy','true'); btn.setAttribute('aria-disabled','true'); btn.textContent = T.buscando; dizer('');
  try{
    const d = await api('fetch?url='+encodeURIComponent(it.url));
    if (!d || typeof d !== 'object') throw falha(T.atualizarFalhou);
    if (d.error) throw falha(fraseDoServidor(d.error));
    if (d.captcha || !d.titulo) throw falha(T.atualizarBloqueio);
    if (d.asin && d.asin !== it.item_id) throw falha(T.outroProduto);
    if (!precoLegivel(d.preco)) throw falha(T.atualizarSemPreco);
    const r = await api('items/'+it.id,'PATCH',{data:d});
    if (!r || r.error) throw falha(fraseDoServidor(r && r.error));
    Object.assign(it, r);
    renderCard(card, it);   // o cartão é redesenhado: o resultado entra no novo .idade-msg (role=status; sem toast, para não dizer duas vezes)
    const semPreco = !lerPrecoEm(it.preco_em);   // o servidor só carimba preco_em quando o preço é legível
    const novaMsg = card.querySelector('.idade-msg');
    novaMsg.className = 'idade-msg'+(semPreco ? ' err' : ''); novaMsg.textContent = semPreco ? T.atualizarSemPreco : T.atualizado;
    atualizarPrecosGeral();
    if (tinhaFoco) card.querySelector('.copy').focus({preventScroll:true});   // o botão saiu de cena se o preço ficou em dia
  }catch(e){
    dizer(e.pronta ? e.message : T.atualizarFalhou, true);
    btn.removeAttribute('aria-busy'); btn.removeAttribute('aria-disabled'); btn.textContent = rotulo;
  }
}

// "Copiar imagem": baixa a foto do CDN da loja (CORS, sem cookies), converte para PNG e põe na área de transferência.
// Só aceita os hosts abaixo, para uma URL forjada no banco não virar requisição a outro lugar.
const HOST_FOTO_SHOPEE = 'down-br.img.susercontent.com';   // CDN da foto da Shopee (a confirmar com um link real do dono; o mesmo valor está em disparo.py)
const HOSTS_FOTO = ['m.media-amazon.com', 'http2.mlstatic.com', HOST_FOTO_SHOPEE];
const falhaFoto = motivo=>Object.assign(new Error(motivo), {motivo});

// Amazon: pede a versão de até 1000 px trocando o sufixo `._<mods>_.<ext>`. Outros hosts ficam como estão.
function urlFotoParaCopiar(url){
  const s = String(url ?? '');
  let host;
  try{ host = new URL(s).hostname; }catch{ return s; }
  if (host !== 'm.media-amazon.com') return s;
  return s.replace(/\._[^/]*_\.(jpe?g|png|webp)$/i, '._AC_SL1000_.$1');
}

async function baixarComoPng(u){
  let p;
  try{ p = new URL(u); }catch{ throw falhaFoto('indisponivel'); }
  if (p.protocol !== 'https:' || !HOSTS_FOTO.includes(p.hostname)) throw falhaFoto('indisponivel');
  let r, blob;
  try{
    r = await fetch(p.href, {mode:'cors', credentials:'omit', signal: AbortSignal.timeout(15000)});
  }catch{ throw falhaFoto('rede'); }   // TypeError (rede/CORS), AbortError ou TimeoutError
  // A lista de hosts vale também para o destino final, depois de redirecionamentos.
  // r.url só vem vazio em Response montada no próprio JS (stub de teste); resposta de rede sempre traz a URL.
  const destino = String(r.url || '');
  if (destino){
    let f;
    try{ f = new URL(destino); }catch{ throw falhaFoto('indisponivel'); }
    if (f.protocol !== 'https:' || !HOSTS_FOTO.includes(f.hostname)) throw falhaFoto('indisponivel');
  }
  // O ML redireciona foto inexistente para um gif "não disponível" que responde 200
  if (!r.ok || destino.includes('/img-not-available/')) throw falhaFoto('indisponivel');
  if (!/^image\//i.test(r.headers.get('content-type')||'')) throw falhaFoto('indisponivel');
  try{ blob = await r.blob(); }catch{ throw falhaFoto('rede'); }
  let bmp;
  try{ bmp = await createImageBitmap(blob); }catch{ throw falhaFoto('indisponivel'); }
  const cv = document.createElement('canvas');
  cv.width = bmp.width; cv.height = bmp.height;
  const ctx = cv.getContext('2d');
  // Fundo branco (o mesmo de --fundo-imagem): sem ele, a transparência vira preto quando o WhatsApp converte para JPEG
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(bmp, 0, 0); bmp.close();
  const png = await new Promise(ok=>cv.toBlob(ok, 'image/png'));
  if (!png) throw falhaFoto('indisponivel');
  return png;
}

// Promise<Blob image/png>; em erro, e.motivo é 'rede' ou 'indisponivel'
async function fotoComoPng(url){
  const maior = urlFotoParaCopiar(url);
  try{ return await baixarComoPng(maior); }
  catch(e){
    if (e.motivo === 'indisponivel' && maior !== url) return baixarComoPng(url);
    throw e;
  }
}

async function copiarImagem(it, card, btn){
  const st = card.querySelector('.status');
  const erro = texto=>{ st.className='status err'; st.textContent=texto; };
  if (!it.data?.imagem){ erro(TXT_IMG.semFoto); return; }
  if (btn.getAttribute('aria-busy') === 'true') return;   // evita o clique duplo
  if (!navigator.clipboard?.write || typeof window.ClipboardItem !== 'function'){ erro('Erro: '+TXT_IMG.semSuporte); return; }
  // O nome acessível começa pelo texto visível em cada estado (WCAG 2.5.3); sem título, o botão não tem aria-label
  const titulo = it.data.titulo;
  const rotulo = (texto, ligacao)=>{ if (titulo) btn.setAttribute('aria-label', texto+ligacao+titulo); };
  btn.setAttribute('aria-busy','true'); btn.setAttribute('aria-disabled','true');
  btn.removeAttribute('data-estado'); btn.textContent = TXT_IMG.carregando; rotulo(TXT_IMG.carregando, ': ');
  st.className='status'; st.textContent='';
  // O write é chamado já no clique, com a Promise dentro do ClipboardItem, para o Chrome não perder o gesto do usuário
  const png = fotoComoPng(it.data.imagem);
  png.catch(()=>{});   // o motivo é lido no catch abaixo; isto só evita o aviso de rejeição não tratada
  try{
    await navigator.clipboard.write([new ClipboardItem({'image/png': png})]);
    btn.setAttribute('data-estado','copiada'); btn.textContent = TXT_IMG.ok; rotulo(TXT_IMG.ok, ': ');
    card.classList.add('img-done'); toast(TXT_IMG.toastOk);
  }catch(e){
    // Vale o motivo da nossa Promise; o write devolve um erro genérico quando ela falha
    const motivo = (await png.then(()=>null, er=>er?.motivo || 'rede')) ?? (e?.name === 'NotAllowedError' ? 'bloqueado' : 'rede');
    btn.textContent = TXT_IMG.botao; rotulo(TXT_IMG.botao, ' de ');
    erro('Erro: '+(TXT_IMG[motivo] || TXT_IMG.rede));
  }finally{
    btn.removeAttribute('aria-busy'); btn.removeAttribute('aria-disabled');
  }
}

// Selo do público no topo do cartão: só em "Todos" (com um público escolhido todos os cartões teriam o mesmo) e só se o item tem público;
// item corrigido à mão ganha "corrigido" (o único selo, se o público estiver escolhido ou for "sem gênero"). Texto, sem cor.
function htmlSeloGenero(it){
  if (!abaTemGenero(it.cat)) return '';
  const g = generoDe(it), manual = it.genero_origem === 'manual', partes = [];
  if (!generoEscolhido(it.cat) && g !== 'sem') partes.push(esc(NOME_GENERO[g]));
  if (manual) partes.push(TXT_GENERO.corrigido);
  if (!partes.length) return '';
  return `<span class="badge selo-genero" data-genero="${esc(g)}"${manual ? ` title="${esc(TXT_GENERO.tituloCorrigido)}"` : ''}>${partes.join(' · ')}</span>`;
}
function atualizarSeloGenero(card, it){
  const velho = card.querySelector('.selo-genero'); if (velho) velho.remove();
  const h = htmlSeloGenero(it); if (h) card.querySelector('.top .badge').insertAdjacentHTML('afterend', h);
}
// "Automático (Feminino)": o valor automático vem do servidor (genero_auto); sem ele, só "Automático"
function rotuloAutomatico(it){
  const auto = it.genero_origem === 'manual' ? it.genero_auto : generoDe(it);
  return GENEROS.includes(auto) ? `${TXT_GENERO.automatico} (${NOME_GENERO[auto]})` : TXT_GENERO.automatico;
}
// Campo "Público" de "Mais ações": só em cartão de aba com gênero. Valor '' = automático.
function htmlCampoGenero(it){
  if (!abaTemGenero(it.cat)) return '';
  const atual = it.genero_origem === 'manual' ? generoDe(it) : '', titulo = it.data && it.data.titulo;
  return `<label class="lbl">${esc(TXT_GENERO.legenda)} <select class="gen" data-anterior="${esc(atual)}" aria-describedby="gen-msg-${esc(it.id)}"${titulo ? ` aria-label="${esc(TXT_GENERO.legenda+' de '+titulo)}"` : ''}><option value=""${atual === '' ? ' selected' : ''}>${esc(rotuloAutomatico(it))}</option>${GENEROS.map(g=>`<option value="${g}"${g === atual ? ' selected' : ''}>${esc(NOME_GENERO[g])}</option>`).join('')}</select></label><p class="gen-msg" id="gen-msg-${esc(it.id)}" role="status"></p>`;
}
// Resultado da correção, logo abaixo do campo (o .status do cartão fica longe do campo com "Mais ações" aberto no celular).
// O papel é definido antes do texto: erro vira alert (lido na hora), o resto é status.
function mostrarMsgGenero(card, texto, erro=false){
  const m = card.querySelector('.gen-msg'); if (!m) return;
  m.setAttribute('role', erro ? 'alert' : 'status');
  m.className = 'gen-msg'+(erro ? ' err' : '');
  m.textContent = texto;
}
// O que a resposta do servidor muda no cartão: selo e campo (valor, opção "Automático (...)" e valor anterior)
function aplicarGeneroNoCartao(card, it){
  const sel = card.querySelector('select.gen'); if (!sel) return;
  sel.dataset.anterior = it.genero_origem === 'manual' ? generoDe(it) : '';
  sel.value = sel.dataset.anterior; sel.options[0].textContent = rotuloAutomatico(it);
  atualizarSeloGenero(card, it);
}
// Corrige o público do item (PUT /api/items/<id>/genero). Não recria o cartão: preserva "✓ Mensagem copiada", o foco e "Mais ações" aberto.
async function corrigirGenero(it, card, sel){
  const anterior = sel.dataset.anterior || '';
  const novo = sel.value === '' ? null : sel.value, tinhaFoco = document.activeElement === sel;
  sel.disabled = true; sel.setAttribute('aria-busy','true'); mostrarMsgGenero(card, '');
  const falhou = texto=>{ sel.value = anterior; mostrarMsgGenero(card, texto, true); toast(texto, true); };
  try{
    let r;
    try{ r = await fetch('/api/items/'+encodeURIComponent(it.id)+'/genero', {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({genero:novo})}); }
    catch{ falhou(TXT_GENERO.semServidor); return; }
    let d = null; try{ d = await r.json(); }catch{ /* corpo vazio ou não-JSON */ }
    if (!r.ok){ falhou(r.status === 404 ? TXT_GENERO.naoExiste : TXT_GENERO.naoSalvou); return; }
    if (!d || !GENEROS.includes(d.genero)){ falhou(TXT_GENERO.naoSalvou); return; }
    copiarGenero(it, d);
    // render() pode ter recriado o cartão enquanto o PUT andava (trocar de aba e voltar): atualiza todos os cartões deste item que estão na tela
    const vivos = new Set([card, ...document.querySelectorAll('.card[data-id="'+it.id+'"]')]);
    const escolhido = generoEscolhido(it.cat);   // antes de atualizarPublico(), que pode apagar a escolha
    vivos.forEach(c=>aplicarGeneroNoCartao(c, it));
    atualizarPublico();
    toast(novo === null ? TXT_GENERO.voltou : TXT_GENERO.salvo+NOME_GENERO[generoDe(it)]+'.');
    // o cartão fica onde está, mesmo que o novo público o tire da lista; sai no próximo render()
    if (escolhido && !casaGenero(it, [escolhido])){
      const msg = `Agora é ${NOME_GENERO[generoDe(it)]}. Sai desta lista quando você trocar de página ou de filtro.`;
      vivos.forEach(c=>mostrarMsgGenero(c, msg));
    }
  } finally {
    sel.disabled = false; sel.removeAttribute('aria-busy');
    if (tinhaFoco) sel.focus();
  }
}

// Itens da aba ativa (ou de todas, sem categoria marcada) que passam nos filtros. semGenero e semBusca servem às contagens do controle "Público" (loja e título valem; o próprio público e a busca não).
// semPreco serve às contagens do filtro de preço (o próprio filtro não vale nelas)
function filtrarItens({semGenero=false, semBusca=false, semPreco=false}={}){
  const loja=$('#fLoja').value, busca=semBusca?'':$('#fBusca').value, txt=$('#fTexto').value.trim().toLowerCase(), g=semGenero?'':generoEscolhido(activeCat), fp=semPreco?'':$('#fPreco').value, agora=new Date();
  return items.filter(i=>(!activeCat||i.cat===activeCat) && (!loja||i.loja===loja) && (!busca||i.busca===busca) && (!txt||(i.data&&i.data.titulo||'').toLowerCase().includes(txt)) && (!g||casaGenero(i,[g])) && (!fp||(temPreco(i)&&precoVelho(i.preco_em,precoValidade,agora)===(fp==='velho'))));
}
function filtrada(){
  const ordem=$('#fOrdem').value;
  let l = filtrarItens();
  if(ordem==='desc') l=[...l].sort((a,b)=>pct(b.data&&b.data.desconto)-pct(a.data&&a.data.desconto));
  if(ordem==='preco') l=[...l].sort((a,b)=>(num(a.data&&a.data.preco)||1e12)-(num(b.data&&b.data.preco)||1e12));
  // mais antigo primeiro: com preço e sem data (nulo ou malformado) vêm antes; sem preço (sem data possível) ficam no fim
  if(ordem==='antigo'){
    const chave=i=>{ if(!temPreco(i)) return Infinity; const q=lerPrecoEm(i.preco_em); return q?q.getTime():-Infinity; };
    l=l.map(i=>[chave(i),i]).sort((a,b)=>a[0]===b[0]?0:a[0]<b[0]?-1:1).map(x=>x[1]);
  }
  return l;
}

// Abas: as faixas por grupo (#tabs, desktop) e o seletor (#selCat, celular) saem da mesma lista. A marcação só é refeita quando a lista de abas muda
// (aparece ou some uma "Outras"); nas trocas de aba e de público só mudam o ativo e as contagens, e o foco do teclado fica onde está.
function desenharAbas(grupos, contagem){
  const estrutura = grupos.map(g=>g.rotulo+'\n'+g.abas.join('\n')).join('\n\n'), box = $('#tabs'), sel = $('#selCat');
  if (box.dataset.estrutura !== estrutura){
    box.dataset.estrutura = estrutura;
    box.innerHTML = grupos.map((g,k)=>`<div class="tabs-grupo" role="group" aria-labelledby="tg-${k}"><span class="lbl" id="tg-${k}">${esc(g.rotulo)}</span><div class="tabs-pilulas">${g.abas.map(c=>`<button type="button" class="tab" data-c="${esc(c)}" aria-pressed="false"><span class="nome" data-n="${esc(c)}">${esc(c)}</span> <span class="muted"></span></button>`).join('')}</div></div>`).join('');
    sel.innerHTML = `<option value=""></option>`+grupos.map(g=>`<optgroup label="${esc(g.rotulo)}">${g.abas.map(c=>`<option value="${esc(c)}"></option>`).join('')}</optgroup>`).join('');   // a primeira opção, sem valor, é "Todas as categorias"
  }
  const mudar = (el, t)=>{ if (el.textContent !== t) el.textContent = t; };
  for (const b of box.querySelectorAll('.tab')){
    const ativa = b.dataset.c === activeCat;
    b.classList.toggle('active', ativa); b.setAttribute('aria-pressed', ativa);
    if (ativa) b.title = TXT_ABAS.dicaDesmarcar; else b.removeAttribute('title');   // a marcada avisa que outro clique a desmarca
    mudar(b.querySelector('.muted'), fmtNum(contagem.get(b.dataset.c) || 0));
  }
  for (const o of sel.options) mudar(o, `${o.value || TXT_ABAS.todas} (${fmtNum(o.value ? contagem.get(o.value) || 0 : items.length)})`);
  sel.value = activeCat; sel.title = activeCat || TXT_ABAS.todas;
}
// Trocar de aba (botão ou seletor; '' = nenhuma, todas as categorias): zera a busca e a página, restaura o público lembrado (o render lê generoEscolhido) e anuncia o resultado
function escolherAba(c){
  activeCat = c; page = 1; $('#fBusca').value = ''; render();
  const n = filtrada().length, t = n === 0 ? TXT_ABAS.anuncioNenhuma : n === 1 ? TXT_ABAS.anuncioUma : TXT_ABAS.anuncio;
  $('#anuncioLista').textContent = t.replace('{ABA}', activeCat || TXT_ABAS.todas).replace('{N}', fmtNum(n));
}
$('#tabs').addEventListener('click', ev=>{ const b = ev.target.closest('.tab'); if (b) escolherAba(b.dataset.c === activeCat ? '' : b.dataset.c); });   // clicar na marcada a desmarca
$('#selCat').addEventListener('change', ev=>escolherAba(ev.target.value));
$('#lblSelCat').textContent = TXT_ABAS.rotuloSelect;

// Sem categoria marcada: as buscas agrupadas pela categoria dona, a primeira das abas (ordem de `cs`) que tem a busca. Uma só passada pelos itens.
function buscasPorCategoria(buscas, cs){
  const dona = new Map(), porCat = new Map(), pos = new Map(cs.map((c,k)=>[c,k]));
  for (const i of items){
    if (!i.busca || !pos.has(i.cat)) continue;
    const d = dona.get(i.busca);
    if (d === undefined || pos.get(i.cat) < pos.get(d)) dona.set(i.busca, i.cat);
  }
  for (const b of buscas){ const c = dona.get(b); if (!porCat.has(c)) porCat.set(c, []); porCat.get(c).push(b); }
  return cs.filter(c=>porCat.has(c)).map(c=>[c, porCat.get(c)]);
}

function render(){
  if (!ofertasProntas) return;   // carregando ou com erro de carga: o bloco do estado fica, nada de lista
  const foco = guardarFoco();
  const contagem = contarAbas(), grupos = gruposDeAbas(contagem), cs = grupos.flatMap(g=>g.abas);
  if(activeCat && !cs.includes(activeCat)) activeCat = cs[0] || '';   // aba que não existe mais: a primeira, "Celulares e Informática" ('' é válido: todas as categorias)
  guardarCat(activeCat);
  desenharAbas(grupos, contagem);
  // "Sem gênero" que zerou (com a loja e o título de agora) cai em "Todos" antes de filtrar
  if (abaTemGenero(activeCat) && generoEscolhido(activeCat)==='sem' && !contarGeneros(filtrarItens({semGenero:true, semBusca:true})).sem) guardarGenero(activeCat, '');
  atualizarPublico();
  // o select de buscas só lista as buscas que têm item no público escolhido; sem categoria, as de todas, agrupadas por categoria
  const gSel=generoEscolhido(activeCat);
  const buscas=[...new Set(items.filter(i=>(!activeCat||i.cat===activeCat) && (!gSel||casaGenero(i,[gSel]))).map(i=>i.busca).filter(Boolean))];
  const bsel=$('#fBusca'), bval=bsel.value, opBusca=b=>`<option ${b===bval?'selected':''}>${esc(b)}</option>`;
  bsel.innerHTML='<option value="">Todas as buscas ('+buscas.length+')</option>'+(activeCat ? buscas.map(opBusca).join('') : buscasPorCategoria(buscas, cs).map(([c,bs])=>`<optgroup label="${esc(c)}">${bs.map(opBusca).join('')}</optgroup>`).join(''));
  atualizarFiltroPreco();
  const list = filtrada();
  // loja sem item some do contador; cada trecho leva o "·" final no mesmo nowrap, para o separador nunca abrir a 2ª linha
  const partes = [items.length+' itens no total'].concat(Object.keys(LOJA).map(k=>[k, items.filter(i=>i.loja===k).length]).filter(x=>x[1] > 0).map(([k,n])=>n+' '+LOJA[k]));
  $('#count').innerHTML = partes.map((t,i)=>`<span class="nb">${esc(t)}${i < partes.length-1 ? ' ·' : ''}</span>`).join(' ');
  const PAGE=24, pages=Math.max(1,Math.ceil(list.length/PAGE));
  if(page>pages) page=pages; if(page<1) page=1;
  const pagerHtml = pages>1 ? `<button class="secondary pg" data-a="primeira" data-p="1" ${page===1?'disabled':''}>« Primeira</button><button class="secondary pg" data-a="anterior" data-p="${page-1}" ${page===1?'disabled':''}>‹ Anterior</button><span class="muted">Página ${page} de ${pages} · ${list.length} itens</span><button class="secondary pg" data-a="proxima" data-p="${page+1}" ${page===pages?'disabled':''}>Próxima ›</button><button class="secondary pg" data-a="ultima" data-p="${pages}" ${page===pages?'disabled':''}>Última »</button>` : `<span class="muted">${list.length} itens</span>`;

// Itens que combinam com os filtros, separados em {enviaveis, velhos}: o de preço velho (itemComPrecoVelho) o disparo não manda.
// Conta do cliente; o servidor ainda tira os já enviados e confere o link.
function contagemDaRegra(v, agora=new Date()){
  const pal = (v.palavras||[]).map(semAcento), c = {enviaveis:0, velhos:0};
  for (const i of items){
    const d = i.data;
    if (!d || !d.titulo || !d.preco) continue;
    if (!v.cats.includes(i.cat) || !v.lojas.includes(i.loja)) continue;
    if (!casaGenero(i, v.generos)) continue;   // o público só vale nas categorias com gênero; nas outras o item passa
    if (pct(d.desconto) < (Number.isFinite(v.desconto_min) ? v.desconto_min : 0)) continue;
    if (pal.length){ const t = semAcento(d.titulo); if (!pal.some(p=>t.includes(p))) continue; }
    if (itemComPrecoVelho(i, agora)) c.velhos++; else c.enviaveis++;
  }
  return c;
}

// ---------------------------------------------------------------- diálogo de confirmação (<dialog> nativo)
// corpoHtml já vem escapado por quem chama. Resolve true só no botão de confirmar; Esc ou Cancelar = false.
function confirmar({titulo, corpoHtml, ok, perigo=false, soFechar=false, origem=document.activeElement}){
  return new Promise(resolve=>{
    const d = $('#dlg');
    if (d.open) d.close('0');
    d.innerHTML = `<h3 id="dlgTitulo">${esc(titulo)}</h3><div class="dlg-corpo">${corpoHtml}</div>
      <div class="actions"><button type="button" class="secondary" data-r="0">${esc(soFechar ? TXT_DISPARO.entendi : TXT_DISPARO.cancelar)}</button>${soFechar ? '' : `<button type="button" class="${perigo ? 'secondary danger' : ''}" data-r="1">${esc(ok)}</button>`}</div>`;
    d.setAttribute('aria-labelledby','dlgTitulo');
    let feito = false;
    const fim = ok=>{ if (feito) return; feito = true; d.onclose = null; if (d.open) d.close(); if (origem && origem.isConnected) origem.focus(); resolve(ok); };
    d.querySelectorAll('button').forEach(b=>b.onclick=()=>fim(b.dataset.r === '1'));
    // Esc fecha pelo navegador; o evento de um diálogo anterior, atrasado, chega com o novo já aberto e é ignorado
    d.onclose = ()=>{ if (!d.open) fim(false); };
    d.showModal();
    d.querySelector('button[data-r="0"]').focus();   // foco no botão seguro
  });
}

// ---------------------------------------------------------------- rotas por hash
function rotaAtual(){
  const h = location.hash.replace(/^#/,'');
  let m;
  if (h === 'precos') return {tela:'precos'};   // atalho: mostra a lista com o quadro "Como atualizar os preços" aberto; não é tela do disparo
  if (h === 'disparo') return {tela:'regras'};
  if (h === 'disparo/nova') return {tela:'regra', id:null};
  if ((m = /^disparo\/regra\/(\d{1,9})$/.exec(h))) return {tela:'regra', id:+m[1]};
  if (h === 'historico') return {tela:'historico'};
  if (h === 'numeros') return {tela:'numeros'};
  if (h === 'numeros/novo') return {tela:'numero', id:null};
  if ((m = /^numeros\/(\d{1,9})$/.exec(h))) return {tela:'numero', id:+m[1]};
  return null;
}

function sairDisparo(){
  const veio = noDisparo;
  noDisparo = false;
  document.body.classList.remove('em-disparo');
  $('#telaDisparo').hidden = true; $('#telaOfertas').hidden = false;

let hashAceito = '', confirmandoRota = false;
async function rotear(){
  // Voltar/Avançar do navegador com formulário não salvo: devolve o endereço anterior e pergunta antes de seguir
  if (formSujo && location.hash !== hashAceito){
    if (confirmandoRota) return;
    const novo = location.hash;
    history.replaceState(null, '', hashAceito || location.pathname+location.search);
    confirmandoRota = true;
    const ok = await confirmar({titulo:TXT_DISPARO.descartarT, corpoHtml:`<p>${esc(TXT_DISPARO.descartar)}</p>`, ok:TXT_DISPARO.descartarOk, perigo:true});
    confirmandoRota = false;
    if (!ok) return;
    marcarSujo(false);
    history.replaceState(null, '', novo || location.pathname+location.search);
  }
  hashAceito = location.hash;
  const r = rotaAtual(), seq = ++rotaSeq;
  pararFila(); marcarSujo(false); previaSeq++; clearTimeout(tempoPrevia);
  if (!r){ sairDisparo(); return; }
  if (r.tela === 'precos'){ const veio = noDisparo; sairDisparo(); if (!veio) atualizarAtencao(); abrirQuadroPrecos(); return; }   // vindo do disparo, o sairDisparo já confere a atenção
  if (!noDisparo){
    scrollOfertas = window.scrollY; noDisparo = true;
    document.body.classList.add('em-disparo');
    $('#addBox').classList.remove('open'); $('#tplBox').classList.remove('open');
    $('#telaOfertas').hidden = true; $('#telaDisparo').hidden = false; window.scrollTo(0, 0);
  }
  const tela = {regras:telaRegras, historico:telaHistorico, numeros:telaNumeros, regra:telaRegra, numero:telaNumero}[r.tela];
  await tela(r, seq);
}

const ASSINATURA = new WeakMap();   // html de cada cartão de regra já desenhado
function desenharRegras(){
  const box = $('#dspRegras'); if (!box) return;
  if (!disp.numeros.length){
    box.innerHTML = `<div class="vazio"><p id="dspSemNumero">${esc(TXT_DISPARO.semNumero)}</p><button type="button" data-acao="novo-numero">${esc(TXT_DISPARO.cadastrarNumero)}</button></div>`;
    return;
  }
  if (!disp.regras.length){
    box.innerHTML = `<div class="vazio"><p>${esc(TXT_DISPARO.semRegra)}</p><button type="button" data-acao="nova-regra">${esc(TXT_DISPARO.novaRegra)}</button></div>`;
    return;
  }
  const peso = r=>r.aviso ? 0 : r.ativa ? 1 : 2;   // atenção, depois ativas, depois pausadas
  const atuais = new Map([...box.children].filter(c=>c.dataset.regra).map(c=>[c.dataset.regra, c]));
  const lista = [...disp.regras].sort((a,b)=>peso(a)-peso(b) || a.id-b.id).map(r=>{
    const html = htmlRegra(r), velho = atuais.get(String(r.id));
    if (velho && ASSINATURA.get(velho) === html) return velho;   // não mudou: mantém o nó (foco, "Mais ações" aberto)
    const t = document.createElement('div'); t.innerHTML = html;
    const novo = t.firstElementChild; ASSINATURA.set(novo, html);
    return novo;
  });
  [...box.children].forEach(c=>{ if (!lista.includes(c)) c.remove(); });
  let ref = null;
  for (const c of lista){
    if (c.parentNode !== box || (ref ? ref.nextElementSibling : box.firstElementChild) !== c){ if (ref) ref.after(c); else box.prepend(c); }
    ref = c;
  }
}

async function atualizarFila(){

    disp.fila = disp.fila.filter(e=>e.id !== id);
    card.remove(); desenharFila(); marcarAtencao();
    toast(status === 'enviado' ? TXT_DISPARO.marcadaEnviada : TXT_DISPARO.marcadaPulada);

  }catch(er){
    bs.forEach(b=>b.disabled = false);

async function alternarRegra(id, btn){
  const r = disp.regras.find(x=>x.id === id); if (!r) return;
  btn.disabled = true;
  try{
    await dapi('regras/'+id, 'PUT', {ativa: r.ativa ? 0 : 1});

  }catch(e){ btn.disabled = false; toast(e.message, true); }

function enviosHoje(regraId){
  const hoje = dataLocal(new Date());
  return (disp.envios||[]).filter(e=>e.regra_id === regraId && String(e.criado_em).startsWith(hoje) && ['enviado','pendente','enviando','incerto'].includes(e.status)).length;

async function dispararAgora(id, btn){
  const r = disp.regras.find(x=>x.id === id); if (!r) return;
  const n = disp.numeros.find(x=>x.id === r.numero_id);
  btn.disabled = true; btn.textContent = 'Preparando…';
  let amostra;
  try{ amostra = await dapi('previa', 'POST', {...r, n:Math.min(r.por_disparo, 20)}); }
  catch(e){ toast(e.message, true); btn.disabled = false; btn.textContent = TXT_DISPARO.agora; return; }
  btn.disabled = false; btn.textContent = TXT_DISPARO.agora;
  const grupo = n ? n.grupo_nome : '';
  const ja = enviosHoje(r.id);
  const corpoHtml = amostra.length
    ? `<p>Disparar até ${r.por_disparo} ${r.por_disparo === 1 ? 'mensagem' : 'mensagens'} para a fila do grupo ${esc(grupo)}? Você copia e cola no WhatsApp. Valem como parte dos envios de hoje (${ja} de ${r.max_por_dia}).</p>
       ${amostra.slice(0,3).map(a=>`<div class="previa"><div class="corpo">${a.imagem ? `<img class="foto" alt="" src="${esc(a.imagem)}">` : `<div class="sem-foto">Sem foto</div>`}<p class="name">${esc(a.titulo)}</p></div></div>`).join('')}`
    : `<p>Nenhum item combina com esta regra agora. Confira as categorias e os filtros, ou espere entrarem itens novos.</p>`;
  const ok = await confirmar({titulo:`${TXT_DISPARO.agora}: ${r.nome}`, corpoHtml, ok:TXT_DISPARO.agora, soFechar:!amostra.length, origem:btn});
  if (!ok) return;
  btn.disabled = true; btn.textContent = 'Disparando…';
  try{
    const res = await dapi('regras/'+id+'/agora', 'POST');
    const q = Array.isArray(res && res.envios) ? res.envios.length : (res && res.criados) || 0;
    await carregarTudo(); desenharFila(); desenharRegras(); focarRegra(id, 'agora');
    toast(q ? `${q} ${q === 1 ? 'mensagem entrou' : 'mensagens entraram'} na fila.` : 'Nada foi gerado: limite do dia, item já enviado recentemente ou nenhum item disponível.');
  }catch(e){ toast(e.message, true); btn.disabled = false; btn.textContent = TXT_DISPARO.agora; }
}
async function excluirRegra(id, btnOrigem){
  const r = disp.regras.find(x=>x.id === id); if (!r) return;
  const ok = await confirmar({titulo:`Excluir a regra "${r.nome}"?`, corpoHtml:`<p>${esc(TXT_DISPARO.excluirTexto)}</p>`, ok:TXT_DISPARO.excluirRegra, perigo:true, origem:btnOrigem});

  }catch(e){ toast(e.message, true); }
}

async function carregarHistorico(seq){

  box.innerHTML = `<table class="htab" role="table"><caption class="sr">Envios do disparo automático</caption><thead role="rowgroup"><tr role="row"><th scope="col" role="columnheader">Data e hora</th><th scope="col" role="columnheader">Item</th><th scope="col" role="columnheader">Regra</th><th scope="col" role="columnheader">Status</th></tr></thead><tbody role="rowgroup">${linhas}</tbody></table>

const campoErro = id=>`<p class="erro-campo" id="e-${id}"></p>`;
// Mostra os erros: inline sob o campo, aria-invalid e um resumo no topo com links que levam ao campo
function mostrarErros(erros, extra){
  document.querySelectorAll('#telaDisparo [aria-invalid]').forEach(e=>e.removeAttribute('aria-invalid'));
  document.querySelectorAll('#telaDisparo .erro-campo').forEach(e=>e.textContent = '');
  const resumo = $('#dspErros');
  for (const e of erros){
    const p = $('#e-'+e.id), campo = document.getElementById('f-'+e.id);
    if (p) p.textContent = e.msg;
    // grupos (categorias, dias, horários) marcam os campos de dentro; o aria-describedby de cada um já aponta o erro
    if (campo) (campo.matches('input,select,textarea') ? [campo] : [...campo.querySelectorAll('input')]).forEach(c=>c.setAttribute('aria-invalid','true'));
  }
  if (!erros.length && !extra){ resumo.innerHTML = ''; return; }
  resumo.innerHTML = extra
    ? `<p><strong>Não salvou.</strong> ${esc(extra)}</p>`
    : `<p><strong>Corrija ${erros.length === 1 ? 'este campo' : 'estes '+erros.length+' campos'} para salvar:</strong></p><ul>${erros.map(e=>`<li><button type="button" class="linklike" data-acao="foco" data-alvo="f-${e.id}">${esc(e.msg)}</button></li>`).join('')}</ul>`;
  resumo.setAttribute('role','alert');
  resumo.tabIndex = -1; resumo.focus();
}

  const el = document.getElementById(id); if (!el) return;

}

function generosDoForm(f){

  try{ const o = JSON.parse(f.querySelector('#f-publico').dataset.original); if (Array.isArray(o)) return o; }catch{ /* sem original: todos */ }
  return [];
}
// Lê o formulário no formato da API (campos numéricos inválidos viram NaN e a validação aponta)
function lerFormRegra(){
  const f = $('#frmRegra'), marcados = n=>[...f.querySelectorAll(`input[name="${n}"]:checked`)];
  const pal = [...new Set($('#f-palavras').value.split(',').map(p=>p.trim()).filter(Boolean))];
  return {
    nome: $('#f-nome').value.trim(),
    numero_id: $('#f-numero').value ? +$('#f-numero').value : null,
    cats: marcados('cat').map(i=>i.value),
    lojas: marcados('lojas').map(i=>i.value),
    generos: generosDoForm(f),
    palavras: pal,
    desconto_min: lerInt($('#f-desc')),
    ordem: (f.querySelector('input[name="ordem"]:checked')||{}).value,
    template: $('#f-template').value,
    com_foto: $('#f-foto').checked ? 1 : 0,
    dias: marcados('dia').map(i=>+i.value).sort((a,b)=>a-b),
    horarios: [...f.querySelectorAll('input[name="horario"]')].map(i=>i.value),
    por_disparo: lerInt($('#f-por')),
    max_por_dia: lerInt($('#f-max')),
    repetir_apos_dias: $('#f-nunca').checked ? null : lerInt($('#f-rep')),
    intervalo_seg: lerInt($('#f-intervalo')),
  };
}
function validarRegra(v){
  const e = [];
  if (!v.nome || v.nome.length > 80) e.push({id:'nome', msg:'Dê um nome à regra, de 1 a 80 letras.'});
  if (!v.numero_id) e.push({id:'numero', msg:'Escolha o número que envia.'});
  if (!v.cats.length) e.push({id:'cats', msg:'Escolha ao menos uma categoria.'});
  if (!v.lojas.length) e.push({id:'lojas', msg:'Escolha ao menos uma loja.'});
  if (v.palavras.length > 20 || v.palavras.some(p=>p.length > 40)) e.push({id:'palavras', msg:'Use até 20 palavras, de até 40 letras cada.'});
  if (!intEm(v.desconto_min, 0, 95)) e.push({id:'desc', msg:'Informe um desconto mínimo de 0 a 95.'});
  if (!v.dias.length) e.push({id:'dias', msg:'Escolha ao menos um dia.'});
  if (!v.horarios.length || v.horarios.some(h=>!/^([01]\d|2[0-3]):[0-5]\d$/.test(h))) e.push({id:'horarios', msg:'Preencha todos os horários (hora e minuto).'});
  else if (new Set(v.horarios).size !== v.horarios.length) e.push({id:'horarios', msg:'Há horários repetidos. Cada horário só pode aparecer uma vez.'});
  else if (v.horarios.length > 48) e.push({id:'horarios', msg:'Use no máximo 48 horários.'});
  if (!intEm(v.por_disparo, 1, 10)) e.push({id:'por', msg:'Informe de 1 a 10 mensagens por horário.'});
  if (!intEm(v.max_por_dia, 1, 200)) e.push({id:'max', msg:'Informe um máximo por dia de 1 a 200.'});
  if (v.repetir_apos_dias !== null && !intEm(v.repetir_apos_dias, 1, 365)) e.push({id:'rep', msg:'Informe de 1 a 365 dias, ou marque "Nunca repetir".'});
  if (!intEm(v.intervalo_seg, 30, 3600)) e.push({id:'intervalo', msg:'Informe um intervalo de 30 a 3600 segundos (em "Avançado").'});
  if (!templates[v.template] || !String(templates[v.template]).includes('{LINK}')) e.push({id:'template', msg:'Escolha um template que exista e tenha o campo {LINK}.'});
  return e;
}
// Contador, resumo da agenda e prévia, a cada mudança no formulário
function atualizarDerivados(){
  const v = lerFormRegra(), ct = $('#f-contador'), rs = $('#f-resumo');
  if (!v.cats.length) ct.textContent = 'Escolha ao menos uma categoria para ver quantos itens combinam.';
  else {
    const {enviaveis:n, velhos} = contagemDaRegra(v), T = TXT_PRECOS;
    const fora = velhos ? (velhos === 1 ? T.contadorVelhosUm : T.contadorVelhos.replace('{N}', fmtNum(velhos))) : '';
    ct.className = 'resumo'+(n ? '' : ' aviso');
    ct.textContent = n ? `Cerca de ${fmtNum(n)} ${n === 1 ? 'item combina' : 'itens combinam'} com esses filtros (sem contar os já enviados recentemente)`+(fora ? '; '+fora : '.')
      : velhos ? (velhos === 1 ? T.contadorSoVelhosUm : T.contadorSoVelhos.replace('{N}', fmtNum(velhos)))
      : 'Nenhum item combina; a regra não enviará nada até entrarem itens.';
  }
  const hs = v.horarios.filter(h=>/^\d\d:\d\d$/.test(h));
  if (!hs.length || !v.dias.length || !Number.isInteger(v.por_disparo)){ rs.className = 'resumo'; rs.textContent = ''; return; }
  const cap = new Set(hs).size * v.por_disparo;
  const folga = Number.isInteger(v.max_por_dia) && cap < v.max_por_dia;   // o aviso só aparece depois de o dono mexer em horários, quantidade ou máximo
  rs.className = 'resumo'+(folga && capTocada ? ' aviso' : '');
  rs.textContent = `Gera ${v.por_disparo} ${v.por_disparo === 1 ? 'mensagem' : 'mensagens'} em cada horário (${listaTexto(horariosOrdenados([...new Set(hs)]))}), ${textoDias(v.dias)}`
    + (Number.isInteger(v.max_por_dia) ? `, até ${v.max_por_dia} por dia.` : '.')
    + (folga && capTocada ? ` Pelos horários, saem no máximo ${cap} por dia.` : '');
}

function desenharPrevia(){

async function atualizarPrevia(){
  const box = $('#dspPrevia'); if (!box) return;
  const v = lerFormRegra(), seq = ++previaSeq;
  const faltam = validarRegra({...v, nome: v.nome || 'Prévia'});   // o servidor valida de novo; aqui evita um pedido sabidamente inválido
  if (faltam.length){
    box.innerHTML = `<p class="muted">Complete o formulário para ver a prévia: ${esc(faltam[0].msg)}</p>`; return;
  }
  box.setAttribute('aria-busy','true');
  try{
    const r = await dapi('previa', 'POST', {...v, nome: v.nome || 'Prévia', n:5, com_info:true});
    if (seq !== previaSeq) return;
    ({itens: previaLista, precoVelho: previaPrecoVelho} = lerRespostaPrevia(r));
    previaIdx = 0; desenharPrevia();
  }catch(e){
    if (seq !== previaSeq) return;
    box.innerHTML = `<p class="resumo aviso">Prévia indisponível: ${esc(e.message)}</p>`;
  }finally{ if (seq === previaSeq) box.removeAttribute('aria-busy'); }
}

// ---------------------------------------------------------------- eventos (delegação) e início
$('#telaDisparo').addEventListener('click', ev=>{
  const a = ev.target.closest('a[data-nav]');
  if (a){
    if (ev.ctrlKey || ev.metaKey || ev.shiftKey || ev.button) return;
    ev.preventDefault(); navegar(a.getAttribute('href')); return;
  }
  const b = ev.target.closest('[data-acao]'); if (!b) return;
  const id = +b.dataset.id, card = b.closest('[data-envio]');
  switch (b.dataset.acao){
    case 'tentar': rotear(); break;
    case 'nova-regra': navegar('#disparo/nova'); break;
    case 'novo-numero': navegar('#numeros/novo'); break;
    case 'editar': navegar('#disparo/regra/'+id); break;
    case 'duplicar': {
      const r = disp.regras.find(x=>x.id === id);
      if (r){ rascunhoRegra = {...r, nome:r.nome+' (cópia)'}; navegar('#disparo/nova'); }
      break;
    }
    case 'alternar': alternarRegra(id, b); break;
    case 'agora': dispararAgora(id, b); break;
    case 'excluir-regra': excluirRegra(id, b); break;
    case 'editar-numero': navegar('#numeros/'+id); break;
    case 'excluir-numero': excluirNumero(id); break;
    case 'copiar-msg': if (card) copiarMensagemFila(card); break;
    case 'copiar-img': if (card){ const e = disp.fila.find(x=>x.id === +card.dataset.envio); if (e) copiarImagem(itemDaFila(e), card, b); } break;
    case 'marcar': if (card) marcarEnvio(card, b.dataset.status); break;
    case 'mais-historico': histMostrar += 50; desenharHistorico(); break;
    case 'cancelar': navegar(b.dataset.volta); break;
    case 'foco': focarCampo(b.dataset.alvo); break;
    case 'cats-todas': document.querySelectorAll('#f-cats input').forEach(i=>i.checked = true); aoMudarForm(); break;
    case 'cats-limpar': document.querySelectorAll('#f-cats input').forEach(i=>i.checked = false); aoMudarForm(); break;
    case 'cats-grupo': { const caixas = [...b.closest('.grupo-cats').querySelectorAll('input')], marcar = !caixas.every(i=>i.checked); caixas.forEach(i=>i.checked = marcar); aoMudarForm(); break; }
    case 'dias-todos': document.querySelectorAll('#f-dias input').forEach(i=>i.checked = true); aoMudarForm(); break;
    case 'dias-util': document.querySelectorAll('#f-dias input').forEach(i=>i.checked = +i.value < 5); aoMudarForm(); break;
    case 'add-horario': {
      const hs = [...document.querySelectorAll('#f-horarios input')].map(i=>i.value);
      if (hs.length >= 48) break;
      capTocada = true; hs.push(''); $('#f-horarios').innerHTML = htmlHorarios(hs); focarCampo('hor-'+(hs.length-1)); aoMudarForm();
      break;
    }
    case 'rm-horario': {
      const hs = [...document.querySelectorAll('#f-horarios input')].map(i=>i.value);
      if (hs.length < 2) break;
      capTocada = true; hs.splice(+b.dataset.i, 1); $('#f-horarios').innerHTML = htmlHorarios(hs); focarCampo('hor-'+Math.min(+b.dataset.i, hs.length-1)); aoMudarForm();
      break;
    }
    case 'outra-previa': previaIdx++; desenharPrevia(); break;
    case 'editar-templates': $('#btnTpl').click(); $('#tplBox').scrollIntoView({block:'nearest'}); break;
  }
});
$('#telaDisparo').addEventListener('change', ev=>{
  if (ev.target.id === 'f-nunca'){   // "Nunca repetir" desliga o campo de dias
    const n = $('#f-rep'); n.disabled = ev.target.checked; if (!ev.target.checked && !n.value) n.value = 7;
  }
});
$('#btnDisparo').onclick = ()=>navegar('#disparo');
$('#btnVoltarCab').textContent = TXT_DISPARO.voltar; $('#btnVoltarCab').onclick = ()=>navegar('#');
function iniciarDisparo(){
  hashAceito = location.hash;
  window.addEventListener('hashchange', ()=>rotear());
  if (rotaAtual()) rotear(); else atualizarAtencao();
}
document.addEventListener('visibilitychange', ()=>{ if (!document.hidden && noDisparo && timerFila) atualizarFila(); });
</script>
</body>
